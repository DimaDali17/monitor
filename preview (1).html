<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>EasyForm Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
--bg:#F0EBE1;
--bg2:#E8E1D4;
--bg3:#FAF8F4;
--card:#FFF;
--border:rgba(160,148,128,.25);
--border2:rgba(160,148,128,.45);
--ink:#1A1610;
--ink2:#6B6357;
--ink3:#A09688;
--green:#2D7A4F;
--red:#B84040;
--amber:#A06820;
--blue:#005BFF;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Comfortaa,sans-serif;background:var(--bg);color:var(--ink);font-size:13px}

/* HEADER */
.header{
background:var(--bg2);
border-bottom:1px solid var(--border2);
padding:0 20px;
height:60px;
display:flex;
align-items:center;
gap:12px;
position:sticky;
top:0;
z-index:100;
}

.logo{width:38px;height:38px;border-radius:10px;object-fit:cover}
.bname{font-size:16px;font-weight:700}
.bsub{font-size:9px;color:var(--ink3);text-transform:uppercase;letter-spacing:.12em}

.hright{margin-left:auto;display:flex;gap:8px;align-items:center}
.clock{font-size:12px;color:var(--ink2)}

.tabs{display:flex;gap:2px;background:var(--bg);padding:3px;border-radius:8px}

.tab{
padding:5px 12px;
border:none;
background:transparent;
font-size:11px;
font-weight:700;
cursor:pointer;
color:var(--ink3);
border-radius:6px;
}

.tab.on{background:var(--ink);color:#fff}
.tab.ozon.on{background:var(--blue)}

.b{
padding:5px 10px;
border:1px solid var(--border2);
background:transparent;
border-radius:7px;
font-size:11px;
font-weight:600;
cursor:pointer;
color:var(--ink2);
}

.upd{font-size:10px;color:var(--ink3)}

.main{padding:20px;max-width:1400px;margin:0 auto}
.mc{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px}
.mg{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}

.lm{text-align:center;color:var(--ink3);padding:40px}
</style>
</head>

<body>

<!-- SETUP -->
<div id="setup" style="position:fixed;inset:0;background:#f0ebe1ee;display:flex;align-items:center;justify-content:center;">
<div style="background:#fff;padding:20px;border-radius:12px;width:420px">

<h3>EasyForm Setup</h3>

<input id="sk1" placeholder="WB token 1" style="width:100%;margin:5px 0">
<input id="sk2" placeholder="WB token 2" style="width:100%;margin:5px 0">
<input id="soid" placeholder="Ozon Client ID" style="width:100%;margin:5px 0">
<input id="sokey" placeholder="Ozon API Key" style="width:100%;margin:5px 0">

<input id="sprx" placeholder="Proxy 1" style="width:100%;margin:5px 0">
<input id="sprx2" placeholder="Proxy 2 (WB EZFR)" style="width:100%;margin:5px 0">

<button onclick="save()" style="width:100%;padding:10px;margin-top:10px">Сохранить</button>

</div>
</div>

<!-- HEADER -->
<div class="header">
<img id="logo" class="logo">

<div>
<div class="bname">EasyForm</div>
<div class="bsub">Dashboard</div>
</div>

<div class="hright">
<div class="clock" id="clk"></div>

<div class="tabs">
<button class="tab on" onclick="go(1)">EF</button>
<button class="tab" onclick="go(2)">EZFR</button>
<button class="tab ozon" onclick="go(3)">Ozon</button>
</div>

<button class="b" onclick="reload(1)">EF</button>
<button class="b" onclick="reload(2)">EZFR</button>
<button class="b" onclick="reload(3)">Ozon</button>

<span class="upd" id="upd"></span>
</div>
</div>

<div class="main">
<div id="v1" class="lm">loading...</div>
<div id="v2" class="lm" style="display:none">loading...</div>
<div id="v3" class="lm" style="display:none">loading...</div>
</div>

<script>

/* ================= STATE ================= */

let PX='', PX2='';

const K={wb1:'',wb2:'',oid:'',ok:''};
const D={1:null,2:null,3:null};

let LOCK=0;

/* ================= CLOCK ================= */

setInterval(()=>{
clk.textContent=new Date().toLocaleString();
},1000);

/* ================= SAVE ================= */

function save(){
K.wb1=sk1.value.trim();
K.wb2=sk2.value.trim();
K.oid=soid.value.trim();
K.ok=sokey.value.trim();

PX=sprx.value.trim();
PX2=sprx2.value.trim();

localStorage.setItem('ef',JSON.stringify({K,PX,PX2}));

setup.style.display='none';

if(K.wb1)reload(1);
if(K.wb2)reload(2);
if(K.oid&&K.ok)reload(3);
}

/* ================= INIT ================= */

window.onload=()=>{
const s=JSON.parse(localStorage.getItem('ef')||'{}');
if(s.K)Object.assign(K,s.K);
if(s.PX)PX=s.PX;
if(s.PX2)PX2=s.PX2;

sk1.value=K.wb1;
sk2.value=K.wb2;
soid.value=K.oid;
sokey.value=K.ok;

if(K.wb1||K.oid) setup.style.display='none';
};

/* ================= TABS FIX ================= */

function go(n){

document.querySelectorAll('.tab')
.forEach((t,i)=>t.classList.toggle('on',i===n-1));

v1.style.display=n===1?'block':'none';
v2.style.display=n===2?'block':'none';
v3.style.display=n===3?'block':'none';
}

/* ================= THROTTLE ================= */

async function throttle(){
const now=Date.now();
const wait=Math.max(0,LOCK-now);
if(wait) await new Promise(r=>setTimeout(r,wait));
LOCK=Date.now()+2200;
}

/* ================= WB PROXY (FIXED) ================= */

async function wbGet(url,token,cab){

await throttle();

const proxy=(cab===2&&PX2)?PX2:PX;

const r=await fetch(proxy+'?url='+encodeURIComponent(url)+'&t='+Date.now(),{
headers:{'X-WB-Token':token}
});

if(r.status===429){
await new Promise(r=>setTimeout(r,5000+Math.random()*5000));
return wbGet(url,token,cab);
}

if(!r.ok) throw new Error(await r.text());
return r;
}

/* ================= OZON FIX ================= */

async function ozPost(url,body){

const r=await fetch(PX+'?url='+encodeURIComponent(url)+'&t='+Date.now(),{
method:'POST',
headers:{
'X-Ozon-Client-Id':K.oid,
'X-Ozon-Api-Key':K.ok,
'Content-Type':'application/json'
},
body:JSON.stringify(body)
});

if(!r.ok) throw new Error(await r.text());
return r;
}

/* ================= DATE ================= */

function td(){return new Date().toISOString().slice(0,10)}
function yd(){return new Date(Date.now()-864e5).toISOString().slice(0,10)}
function wd(){return new Date(Date.now()-7*864e5).toISOString().slice(0,10)}

/* ================= RELOAD ================= */

async function reload(n){

v1.innerHTML='loading...';
v2.innerHTML='loading...';
v3.innerHTML='loading...';

try{
if(n<=2) await loadWB(n);
else await loadOZ();
}catch(e){
document.getElementById('v'+n).innerHTML='ERROR: '+e.message;
}
}

/* ================= WB ================= */

async function loadWB(n){

const token=n===1?K.wb1:K.wb2;

const from=wd();

const url='https://statistics-api.wildberries.ru/api/v1/supplier/orders?dateFrom='+from+'T00:00:00';

const r=await wbGet(url,token,n);
const orders=await r.json();

const stocksR=await wbGet(
'https://statistics-api.wildberries.ru/api/v1/supplier/stocks?dateFrom=2019-01-01',
token,n
);

const stocks=await stocksR.json();

const t=td();
const y=yd();

const today=orders.filter(o=>o.date?.startsWith(t));
const yesterday=orders.filter(o=>o.date?.startsWith(y));
const week=orders;

const sum=o=>o.totalPrice||o.priceWithDisc||0;

const tR=today.reduce((s,o)=>s+sum(o),0);
const yR=yesterday.reduce((s,o)=>s+sum(o),0);
const wR=week.reduce((s,o)=>s+sum(o),0);

const out=stocks.filter(s=>(s.quantity||0)===0).length;
const low=stocks.filter(s=>s.quantity>0&&s.quantity<10).length;

D[n]={today,yesterday,week,tR,yR,wR,out,low};

renderWB(n);
}

/* ================= RENDER ================= */

function renderWB(n){

const d=D[n];

document.getElementById('v'+n).innerHTML=
`
<div class="mg">
<div class="mc">Today <b>${d.today.length}</b></div>
<div class="mc">Yesterday <b>${d.yesterday.length}</b></div>
<div class="mc">7 days <b>${d.week.length}</b></div>
<div class="mc">Revenue today <b>${d.tR}</b></div>
<div class="mc">Revenue 7d <b>${d.wR}</b></div>
</div>
`;

}

/* ================= OZON ================= */

async function loadOZ(){

const body={
filter:{
since:wd()+"T00:00:00Z",
to:new Date().toISOString()
},
limit:100,
offset:0
};

const r=await ozPost(
'https://api-seller.ozon.ru/v3/posting/fbo/list',
body
);

const d=await r.json();

const list=d.result?.postings||[];

const t=td();

const today=list.filter(o=>{
const dt=new Date(o.in_process_at||o.created_at);
return dt.toISOString().startsWith(t);
});

document.getElementById('v3').innerHTML=
`
<div class="mg">
<div class="mc">Today <b>${today.length}</b></div>
<div class="mc">7 days <b>${list.length}</b></div>
</div>
`;

}

</script>

</body>
</html>
