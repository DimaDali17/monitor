# Бот-оповещения в Telegram (scripts/bot.mjs) — на тех же расчётах, что монитор.
# Время в cron — UTC (Москва минус 3 часа). GitHub может запускать с опозданием до ~15 минут.
name: Бот — оповещения в Telegram

on:
  schedule:
    - cron: "0 7 * * *"    # 10:00 МСК — «срочно на ВБ» + правила FBS
    - cron: "0 12 * * *"   # 15:00 МСК — падение заказов к этому часу
  workflow_dispatch:       # ручной запуск: Actions → этот workflow → Run workflow
    inputs:
      mode:
        description: "morning — дефицит и FBS, drop — падение заказов"
        required: true
        default: morning
        type: choice
        options: [morning, drop]

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Запуск бота
        env:
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "0 12 * * *" ]; then MODE=drop; else MODE=morning; fi
          fi
          node scripts/bot.mjs "$MODE"
