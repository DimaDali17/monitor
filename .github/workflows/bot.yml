# Бот-оповещения в Telegram (scripts/bot.mjs) — на тех же расчётах, что монитор.
# Время в cron — UTC (Москва минус 3 часа). GitHub может запускать с опозданием до ~15 минут.
name: Бот — оповещения в Telegram

on:
  # Расписание держит воркер Cloudflare (cron «0 1-21 * * *», v5.4): GitHub по своему
  # расписанию запускает ненадёжно. Воркер присылает mode: 10:00 morning, 15:00 drop + fbs,
  # остальные часы 4:00–0:00 — fbs.
  workflow_dispatch:             # ручной запуск: Actions → этот workflow → Run workflow
    inputs:
      mode:
        description: "morning — сводка за вчера + дефицит + FBS, fbs — только FBS, drop — падение заказов"
        required: true
        default: morning
        type: choice
        options: [morning, fbs, drop]

# запуски по очереди — чтобы не перезаписывать память остатков друг другу
concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Память остатков FBS (с прошлой проверки)
        uses: actions/cache/restore@v4
        with:
          path: .bot-state
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-
      - name: Запуск бота
        env:
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TZ: Europe/Moscow   # «вчера» и «сегодня» — по Москве, как в мониторе
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            MODE=fbs
          fi
          node scripts/bot.mjs "$MODE"
      - name: Сохранить память остатков
        if: always() && hashFiles('.bot-state/fbs.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .bot-state
          key: bot-state-${{ github.run_id }}-${{ github.run_attempt }}
