# Бот-оповещения в Telegram (scripts/bot.mjs) — на тех же расчётах, что монитор.
# Время в cron — UTC (Москва минус 3 часа). GitHub может запускать с опозданием до ~15 минут.
name: Бот — оповещения в Telegram

on:
  schedule:
    - cron: "0 7 * * *"          # 10:00 МСК — «срочно на ВБ» + «закончилось на FBS»
    - cron: "0 6,8-18 * * *"     # 9:00, 11:00–21:00 МСК каждый час — «закончилось на FBS»
    - cron: "0 12 * * *"         # 15:00 МСК — падение заказов к этому часу
  workflow_dispatch:             # ручной запуск: Actions → этот workflow → Run workflow
    inputs:
      mode:
        description: "morning — дефицит + FBS, fbs — только FBS, drop — падение заказов"
        required: true
        default: morning
        type: choice
        options: [morning, fbs, drop]

# запуски по очереди — чтобы не перезаписывать память остатков друг другу
concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Память остатков FBS (с прошлой проверки)
        uses: actions/cache/restore@v4
        with:
          path: .bot-state
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-
      - name: Запуск бота
        env:
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            case "${{ github.event.schedule }}" in
              "0 12 * * *") MODE=drop ;;
              "0 7 * * *") MODE=morning ;;
              *) MODE=fbs ;;
            esac
          fi
          node scripts/bot.mjs "$MODE"
      - name: Сохранить память остатков
        if: always() && hashFiles('.bot-state/fbs.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .bot-state
          key: bot-state-${{ github.run_id }}-${{ github.run_attempt }}
