<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>EasyForm Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F0EBE1;--bg2:#E8E1D4;--bg3:#FAF8F4;--card:#FFF;--border:rgba(160,148,128,.25);--border2:rgba(160,148,128,.45);--ink:#1A1610;--ink2:#6B6357;--ink3:#A09688;--green:#2D7A4F;--red:#B84040;--amber:#A06820;--blue:#005BFF;--sgp:#5B3FA0;--raw:#8B4513;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Comfortaa',sans-serif;background:var(--bg);color:var(--ink);font-size:13px}
.header{background:var(--bg2);border-bottom:1px solid var(--border2);padding:0 20px;height:60px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.logo{width:38px;height:38px;border-radius:10px;object-fit:cover}
.bname{font-size:16px;font-weight:700}.bsub{font-size:9px;color:var(--ink3);letter-spacing:.12em;text-transform:uppercase}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px}
.clock{font-size:12px;color:var(--ink2);white-space:nowrap}
.tabs{display:flex;gap:2px;background:var(--bg);border-radius:8px;padding:3px}
.tab{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;border:none;background:0;color:var(--ink3);font-family:inherit;white-space:nowrap}
.tab.on{background:var(--ink);color:var(--bg3)}.tab.ozon.on{background:var(--blue);color:#fff}
.tab.conso{background:linear-gradient(135deg,#5B3FA0,#7C5BC4);color:#FAF8F4}
.tab.conso.on{background:linear-gradient(135deg,#5B3FA0,#7C5BC4);color:#FAF8F4;box-shadow:0 0 0 2px #5B3FA0 inset}
.b{padding:5px 10px;background:0;border:1px solid var(--border2);border-radius:7px;font-size:11px;font-weight:600;color:var(--ink2);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:4px;white-space:nowrap}
.b:hover{background:var(--ink);color:var(--bg3);border-color:var(--ink)}.b:disabled{opacity:.4;cursor:default}
.upd{font-size:10px;color:var(--ink3)}
.sov{display:none;position:fixed;inset:0;background:rgba(240,235,225,.95);backdrop-filter:blur(6px);z-index:200;align-items:center;justify-content:center}
.sov.show{display:flex}
.sc{background:var(--card);border:1px solid var(--border2);border-radius:16px;padding:28px;width:480px;box-shadow:0 8px 40px rgba(0,0,0,.1);max-height:90vh;overflow-y:auto}
.slogo{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.stitle{font-size:20px;font-weight:700}.ssub{font-size:10px;color:var(--ink3);letter-spacing:.1em;text-transform:uppercase}
.ssec{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.1em;margin:16px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.fg{margin-bottom:10px}
.fl{font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px;font-weight:700}
.fi{width:100%;padding:8px 12px;font-size:12px;background:var(--bg3);border:1px solid var(--border2);border-radius:7px;color:var(--ink);font-family:inherit;outline:0}
.fi:focus{border-color:var(--ink)}
.sbtn{width:100%;padding:12px;background:var(--ink);color:var(--bg3);border:0;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:8px}
.smsg{font-size:12px;margin-top:8px;text-align:center}.smsg.err{color:var(--red)}
.main{padding:20px;max-width:1700px;margin:0 auto}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.mc{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:14px 16px}
.ml{font-size:9px;color:var(--ink3);text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-bottom:7px}
.mv{font-size:24px;font-weight:700;line-height:1}.mv.g{color:var(--green)}.mv.sm{font-size:18px}.mv.oz{color:var(--blue)}
.md{font-size:11px;margin-top:4px}
.du{color:var(--green)}.dd{color:var(--red)}
.sec{margin-bottom:20px}
.sh{display:flex;align-items:center;justify-content:space-between;padding-bottom:7px;margin-bottom:10px;border-bottom:1px solid var(--border2);flex-wrap:wrap;gap:6px}
.st{font-size:10px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.12em}
.sm2{font-size:11px;color:var(--ink3)}
.flt{padding:5px 10px;font-size:11px;background:var(--bg3);border:1px solid var(--border2);border-radius:7px;color:var(--ink);font-family:inherit;outline:0}
.flt:focus{border-color:var(--ink)}
.tw{background:var(--card);border:1px solid var(--border);border-radius:11px;overflow:hidden}
.sw{background:var(--card);border:1px solid var(--border);border-radius:11px;overflow-x:auto}
.sw-sticky{max-height:70vh;overflow-y:auto}
.sw-sticky thead th{position:sticky;top:0;z-index:10;box-shadow:0 1px 0 var(--border2)}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;padding:6px 9px;font-size:9px;font-weight:700;color:var(--ink3);background:var(--bg3);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--border);font-family:inherit;white-space:nowrap}
thead th.sa{background:var(--ink)!important;color:var(--bg3)!important}
thead th[onclick]{cursor:pointer;user-select:none}
thead th.th-wb{background:#FFF3E0!important;color:#A06820!important;border-bottom:2px solid #A06820}
thead th.th-sgp{background:#EDE7F6!important;color:#5B3FA0!important;border-bottom:2px solid #5B3FA0}
thead th.th-raw{background:#FBE9E7!important;color:#8B4513!important;border-bottom:2px solid #8B4513}
thead th.th-transit{background:#E3F2FD!important;color:#0D47A1!important;border-bottom:2px dashed #90CAF9}
thead th.th-msk{background:#F3E5F5!important;color:#6A1B9A!important;border-bottom:2px dashed #CE93D8}
thead th.th-total{background:#E8F5E9!important;color:#1B5E20!important;border-bottom:2px solid #4CAF50}
.thg-total{background:#E8F5E9;color:#1B5E20}
thead th.th-need{background:#FFF8E1!important;color:#F57F17!important}
thead th.th-days{background:#E0F2F1!important;color:#004D40!important}
.th-group{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;text-align:center;padding:3px 6px;border-bottom:1px solid var(--border)}
.thg-wb{background:#FFF3E0;color:#A06820}.thg-sgp{background:#EDE7F6;color:#5B3FA0}.thg-raw{background:#FBE9E7;color:#8B4513}
.thg-need{background:#FFF8E1;color:#F57F17}.thg-days{background:#E0F2F1;color:#004D40}.thg-ref{background:#F3F3F3;color:#888;font-style:italic}
tbody td{padding:5px 9px;color:var(--ink);border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--bg3)}
.tp{font-size:11px;font-weight:700;color:var(--ink2);background:var(--bg2);padding:2px 8px;border-radius:20px}
.art{font-family:monospace;font-size:11px;color:var(--ink2)}
.pr{font-weight:700}.qo{color:var(--green);font-weight:700}.ql{color:var(--amber);font-weight:700}.qx{color:var(--red);font-weight:700}
.tc{font-weight:700;background:var(--bg3)!important;text-align:center;font-size:14px}
.er td{text-align:center;padding:10px}
.eb{background:0;border:1px solid var(--border2);border-radius:7px;padding:5px 16px;font-size:11px;font-weight:600;color:var(--ink2);cursor:pointer;font-family:inherit}
.eb:hover{background:var(--ink);color:var(--bg3);border-color:var(--ink)}
.fl2{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:700}
.ff{background:#FEE8E8;color:#B84040}.fw{background:#FEF3E2;color:#A06820}.fk{background:#E8F4EE;color:#2D7A4F}.fd{background:#EDEDF0;color:#6B6B80}.fe{background:#F5F5F5;color:#A09688}
.dbw{background:var(--bg2);border-radius:4px;height:4px;width:60px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:4px}
.db{height:100%;border-radius:4px}.bf{background:#B84040}.bw{background:#A06820}.bk{background:#2D7A4F}.bd{background:#A09688}
.em{padding:28px;text-align:center;color:var(--ink3)}
.ar-row{cursor:pointer;background:var(--bg3)}.ar-row:hover{background:var(--bg2)}
.ar-row td{font-weight:700;border-bottom:1px solid var(--border2)}
.sz-row td{font-size:12px;color:var(--ink2);border-bottom:1px solid var(--border)}
.sz-row td:first-child{padding-left:28px}
.tog{display:inline-block;width:16px;text-align:center;font-size:10px;color:var(--ink3);margin-right:4px}
.fb{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px;position:relative}
.fb input{flex:1;min-width:160px;padding:7px 10px;font-size:12px;background:var(--bg3);border:1px solid var(--border2);border-radius:7px;color:var(--ink);font-family:inherit;outline:0}
.fb input:focus{border-color:var(--ink)}
.filter-bar{background:var(--card);border:1px solid var(--border2);border-radius:12px;padding:12px 14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.04);max-width:50%;min-width:380px}
.filter-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.filter-row:last-of-type{margin-bottom:0}
.filter-label{font-size:11px;font-weight:700;color:var(--ink2);white-space:nowrap;padding-top:7px;min-width:90px}
.chip{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;background:var(--ink);color:var(--bg3);border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap}
.chip .cx{cursor:pointer;opacity:.7;font-size:13px;line-height:1}.chip .cx:hover{opacity:1}
.ddrop{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--border2);border-radius:8px;max-height:200px;overflow-y:auto;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.1);display:none}
.ddrop.show{display:block}.ddrop div{padding:6px 12px;font-size:12px;cursor:pointer}.ddrop div:hover{background:var(--bg3)}
.ctog{display:inline-flex;background:var(--bg);border-radius:6px;padding:2px;gap:1px}
.ctog button{padding:3px 10px;border:0;border-radius:5px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;background:0;color:var(--ink3)}
.ctog button.on{background:var(--ink);color:var(--bg3)}
.lm{padding:50px;text-align:center;color:var(--ink3)}
.sb{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--ink2);display:flex;gap:10px;align-items:flex-start;word-break:break-all}
.sde{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px;background:var(--red)}
.sp{display:inline-block;animation:spin .8s linear infinite}
.loadbtn{margin-top:14px;padding:9px 22px;background:var(--ink);color:var(--bg3);border:0;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.buyrate{font-size:9px;padding:1px 5px;border-radius:10px;font-weight:700;margin-left:5px;vertical-align:middle}
.buyrate-ok{background:#E8F4EE;color:#2D7A4F}.buyrate-est{background:#FEF3E2;color:#A06820}
.days-crit{color:#B84040;font-weight:700}.days-warn{color:#A06820;font-weight:700}.days-ok{color:#2D7A4F;font-weight:700}.days-na{color:var(--ink3)}
.td-ref{color:var(--ink3)!important}
/* Tooltip — fixed position чтобы не обрезался overflow */
[data-tip]{position:relative}
thead th[data-tip]{cursor:help}
thead th[onclick][data-tip]{cursor:pointer}
#tip-box{position:fixed;background:rgba(26,22,16,.93);color:#fff;font-size:11px;font-weight:500;padding:7px 11px;border-radius:9px;white-space:normal;z-index:99999;pointer-events:none;font-family:'Comfortaa',sans-serif;width:240px;text-align:center;line-height:1.55;box-shadow:0 4px 20px rgba(0,0,0,.3);display:none}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="sov show" id="setup">
<div class="sc">
  <div class="slogo"><img id="slogoimg" class="logo" alt=""><div><div class="stitle">EasyForm</div><div class="ssub">WB + Ozon Dashboard</div></div></div>
  <div class="ssec">Wildberries</div>
  <div class="fg"><div class="fl">API-ключ Easyform</div><input class="fi" type="password" id="sk1" placeholder="eyJ..."></div>
  <div class="fg"><div class="fl">API-ключ EZFR</div><input class="fi" type="password" id="sk2" placeholder="eyJ..."></div>
  <div class="ssec">Ozon</div>
  <div class="fg"><div class="fl">Client-ID</div><input class="fi" id="soid" placeholder="123456"></div>
  <div class="fg"><div class="fl">API-ключ</div><input class="fi" type="password" id="sokey" placeholder="xxx-xxx-xxx"></div>
  <div class="ssec">Прокси</div>
  <div class="fg"><div class="fl">Прокси 1 — для EF + Ozon</div><input class="fi" id="sprx" value="https://wb-proxy.ooo6311ooo.workers.dev"></div>
  <div class="fg"><div class="fl">Прокси 2 — для EZFR</div><input class="fi" id="sprx2" placeholder="https://wb-proxy-2.xxx.workers.dev"></div>
  <button class="sbtn" onclick="doSave()">Сохранить и загрузить</button>
  <div class="smsg" id="smsg"></div>
</div></div>

<div class="header">
  <img id="hlogo" class="logo" alt="">
  <div><div class="bname" id="hname">EasyForm</div><div class="bsub">Dashboard</div></div>
  <div class="hright">
    <div class="clock" id="clk"></div>
    <div class="tabs">
      <button class="tab on" onclick="go(1)">Easyform</button>
      <button class="tab" onclick="go(2)">EZFR</button>
      <button class="tab ozon" onclick="go(3)">Ozon</button>
      <button class="tab conso" onclick="go(4)">📊 Консо</button>
    </div>
    <button class="b" id="rb1" onclick="reload(1)"><span id="ri1">↻</span> EF</button>
    <button class="b" id="rb2" onclick="reload(2)"><span id="ri2">↻</span> EZFR</button>
    <button class="b" id="rb3" onclick="reload(3)"><span id="ri3">↻</span> Ozon</button>
    <span class="upd" id="upd"></span>
    <button class="b" onclick="openSetup()">⚙</button>
  </div>
</div>

<div class="main">
  <div id="v1"><div class="lm">⚙ Введите API-ключи</div></div>
  <div id="v2" style="display:none"><div class="lm">⚙ Введите API-ключи</div></div>
  <div id="v3" style="display:none"><div class="lm">⚙ Введите API-ключи</div></div>
  <div id="v4" style="display:none"><div class="lm">Загрузите кабинеты и нажмите 📊 Консо</div></div>
</div>

let gBuyrate={};      // artLower → 0..1
let gSgp={};          // "artPr_lower;szPr_lower" → qty
let gRaw={};          // "artPr_lower;szPr_lower" → qty (nobrand тоже)
// Маппинг: "wbArt_lower;wbSz_lower" → [{artPr, szPr}]
let gMap={};
let gExtLoaded=false;
let _gExtPromise=null; // защита от повторного параллельного вызова (race condition)

function parseCSV(text){
  const lines=text.trim().split('\n');
  if(!lines.length)return[];
  const hdr=lines[0].split(',').map(c=>c.trim().replace(/^"|"$/g,''));
  return lines.slice(1).map(row=>{
    const vals=row.split(',').map(c=>c.trim().replace(/^"|"$/g,''));
    const o={};hdr.forEach((h,i)=>o[h]=vals[i]||'');return o;
  });
}

async function loadExternal(){
  if(gExtLoaded)return;
  if(_gExtPromise)return _gExtPromise; /* уже идёт загрузка — ждём ту же промис, не запускаем вторую */
  _gExtPromise=(async()=>{
  try{
    /* Очищаем перед загрузкой — защита от повторного накопления */
    gBuyrate={};gSgp={};gRaw={};gMap={};
    const [rB,rS,rR,rM]=await Promise.all([
      fetch(CSV_BUYRATE).then(r=>r.text()),
      fetch(CSV_SGP).then(r=>r.text()),
      fetch(CSV_RAW).then(r=>r.text()),
      fetch(CSV_MAP).then(r=>r.text())
    ]);

    /* Выкупаемость */
    parseCSV(rB).forEach(row=>{
      const art=(row['supplierArticle']||'').trim().toLowerCase();
      const pct=(row['Выкупаемость']||'').replace('%','').trim();
      if(art&&pct)gBuyrate[art]=parseFloat(pct)/100;
    });

    /* Арт производ маппинг: WB-арт + WB-размер → производ-арт + производ-размер
       Обрабатываем Арт ВБ и Арт ВБ2 (если заполнен) */
    parseCSV(rM).forEach(row=>{
      const artPr=(row['Артикул произв']||'').trim();
      const szPr=(row['Размер произв']||'').trim();
      const szWB=(row['Размер ВБ']||'').trim();
      [row['Арт ВБ'],row['Арт ВБ2']].forEach(wb=>{
        const wbArt=(wb||'').trim();
        if(!wbArt||!artPr)return;
        const k=(wbArt.toLowerCase())+';'+(szWB.toLowerCase());
        if(!gMap[k])gMap[k]=[];
        gMap[k].push({artPr:artPr.trim(),szPr:szPr.trim()});
      });
    });

    /* СГП: колонки "Артикул ИП" (WB-арт напрямую) + "Размер" → "ИТОГО ТЕ" */
    parseCSV(rS).forEach(row=>{
      const art=(row['Артикул ИП']||'').trim();
      const sz=(row['Размер']||'').trim();
      const raw=row[' ИТОГО ТЕ']||row['ИТОГО ТЕ']||row[' ИТОГО ТЕ ']||'';
      const qty=parseInt(raw,10)||0;
      if(!art||!qty)return;
      const k=art.toLowerCase()+';'+sz.toLowerCase();
      gSgp[k]=(gSgp[k]||0)+qty;
    });

    /* Сырьё: тянем и обычный и nobrand (исключение для Pantal.SK.bejnew.02 и подобных) */
    parseCSV(rR).forEach(row=>{
      const art=(row['Арт производ']||'').trim();
      const sz=(row['Размер']||'').trim();
      const qty=parseInt(row['SUM из Штук']||0,10)||0;
      if(!art)return;
      const k=art.toLowerCase()+';'+sz.toLowerCase();
      gRaw[k]=(gRaw[k]||0)+qty;
      /* Если артикул содержит " nobrand" — также записываем без него */
      if(art.toLowerCase().includes(' nobrand')){
        const artClean=art.toLowerCase().replace(' nobrand','').trim();
        const k2=artClean+';'+sz.toLowerCase();
        gRaw[k2]=(gRaw[k2]||0)+qty;
      }
    });

    gExtLoaded=true;
    console.log('Ext loaded: buyrate='+Object.keys(gBuyrate).length+' sgp='+Object.keys(gSgp).length+' raw='+Object.keys(gRaw).length+' map='+Object.keys(gMap).length);
  }catch(e){console.warn('Ошибка внешних данных:',e);}
  })();
  return _gExtPromise;
}

function getBuyrate(art){
  if(!art)return{val:0.7,est:true};
  const k=art.toLowerCase();
  if(gBuyrate[k]!=null)return{val:gBuyrate[k],est:false};
  for(const [ka,v] of Object.entries(gBuyrate))
    if(k.includes(ka)||ka.includes(k))return{val:v,est:false};
  return{val:0.7,est:true};
}

/* Получить {sgp, raw} по WB-арт + WB-размер
   SGP: прямой ключ WB-арт;WB-размер (лист СГП содержит WB-артикулы напрямую)
   RAW: через маппинг произв-арт;произв-размер */
function getStocksForSz(wbArt,wbSz){
  const ka=wbArt.toLowerCase(),kz=wbSz.toLowerCase();
  /* SGP — прямой поиск */
  const sgp=gSgp[ka+';'+kz]||0;
  /* RAW — через маппинг */
  const mapKey=ka+';'+kz;
  const mappings=gMap[mapKey]||[];
  let raw=0;
  mappings.forEach(({artPr,szPr})=>{
    const kp=artPr.toLowerCase()+';'+szPr.toLowerCase();
    raw+=gRaw[kp]||0;
  });
  return{sgp,raw};
}

/* Для строки артикула — сумма по всем размерам
   SGP: прямой поиск по WB-арт (все размеры)
   RAW: через маппинг */
function getStocksForArt(wbArt){
  const ka=wbArt.toLowerCase();
  /* SGP — все ключи начинающиеся с этого артикула */
  let sgp=0;
  for(const [kk,v] of Object.entries(gSgp)){
    if(kk.split(';')[0]===ka)sgp+=v;
  }
  /* RAW — через маппинг произв-арт */
  const seen=new Set();let raw=0;
  for(const [k,mappings] of Object.entries(gMap)){
    if(!k.startsWith(ka+';'))continue;
    mappings.forEach(({artPr,szPr})=>{
      const kp=artPr.toLowerCase()+';'+szPr.toLowerCase();
      if(!seen.has(kp)){seen.add(kp);raw+=gRaw[kp]||0;}
    });
  }
  /* RAW fallback если нет маппинга */
  if(!seen.size){
    for(const [kk,v] of Object.entries(gRaw)){if(kk.split(';')[0]===ka)raw+=v;}
  }
  return{sgp,raw};
}

/* ── WB fetch ── */
function pxFor(cab){return(cab===2&&PX2)?PX2:PX;}
let _wbBusy=Promise.resolve(),_wbLast=0;
const WB_GAP=1200;
function wbQueue(fn){
  const run=_wbBusy.then(async()=>{
    const g=Math.max(0,_wbLast+WB_GAP-Date.now());if(g>0)await new Promise(r=>setTimeout(r,g));
    try{return await fn();}finally{_wbLast=Date.now();}
  });
  _wbBusy=run.catch(()=>{});return run;
}
async function wbGet(url,token,cab){
  const purl=pxFor(cab)+'?url='+encodeURIComponent(url);
  const waits=[3000,7000,15000];let lastInfo='';
  return wbQueue(async()=>{
    for(let i=0;i<=waits.length;i++){
      let r,txt='';
      try{r=await fetch(purl,{headers:{'X-WB-Token':token}});txt=await r.text();}catch(e){lastInfo='сеть: '+e;r=null;}
      const bad=!r||r.status===429||r.status>=500||!txt||!txt.trim();
      if(bad){
        if(r)lastInfo=r.status===429?'429 (лимит)':'WB '+r.status;
        if(i===waits.length)throw new Error('WB: не удалось после '+(waits.length+1)+' попыток ('+lastInfo+'). Подождите 1–2 мин.');
        await new Promise(x=>setTimeout(x,r?parseInt(r.headers.get('retry-after')||'0',10)*1000||waits[i]:waits[i]));
        const ic=document.getElementById('ri'+cab);if(ic)ic.innerHTML='<span class="sp">↻</span>';
        continue;
      }
      if(!r.ok)throw new Error('WB '+r.status+': '+txt.slice(0,200));
      try{return JSON.parse(txt);}catch(e){throw new Error('Некорректный JSON: '+txt.slice(0,160));}
    }
  });
}
let _ozT=0;
async function ozPost(url,body){
  const g=Math.max(0,_ozT+1200-Date.now());if(g>0)await new Promise(r=>setTimeout(r,g));_ozT=Date.now();
  const purl=PX+'?url='+encodeURIComponent(url);
  let r=await fetch(purl,{method:'POST',headers:{'X-Ozon-Client-Id':K.oid,'X-Ozon-Api-Key':K.okey,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.status===429){await new Promise(x=>setTimeout(x,8000));_ozT=Date.now();r=await fetch(purl,{method:'POST',headers:{'X-Ozon-Client-Id':K.oid,'X-Ozon-Api-Key':K.okey,'Content-Type':'application/json'},body:JSON.stringify(body)});}
  if(!r.ok){const t=await r.text().catch(()=>'');throw new Error('Ozon '+r.status+': '+t.slice(0,300));}
  return r;
}
async function safeJson(r,l){const txt=await r.text().catch(()=>'');if(!txt||!txt.trim())return{};try{return JSON.parse(txt);}catch(e){throw new Error((l||'API')+': '+txt.slice(0,160));}}

  }

function ensureArts(n){
  /* ВСЕГДА перестраиваем arts из текущих D[n].stocks — без кэша.
     Кэш ломал фильтры: при spread {...d} ссылка на старый arts "утекала"
     в новый объект fd, и ensureArts пропускал пересчёт на отфильтрованных данных. */
  const stocks=D[n].stocks||[],type=D[n].isOz?'oz':'wb';
  const arts={},whs=new Set();
  stocks.forEach(s=>{
    let art,sz,wh,q,name;
    if(type==='wb'){art=s.supplierArticle||'—';sz=s.techSize||'—';wh=s.warehouseName||'—';q=wbQty(s);name=s.subject||s.category||'';}
    else{art=s.item_code||s.offer_id||'—';sz='—';wh=s.warehouse_name||'—';q=s.free_to_sell_amount||s.quantity||0;name=s.item_name||'';}
    const key=art+' · '+sz;whs.add(wh);
    if(!arts[key])arts[key]={art,sz,name,total:0,wh:{}};
    arts[key].wh[wh]=(arts[key].wh[wh]||0)+q;arts[key].total+=q;
  });
  D[n].arts=arts;
  D[n].whList=[...whs];
  D[n].mskWhs=type==='wb'?[...whs].filter(w=>/коледино|электросталь|тула|подольск/i.test(w)):[];
}

function deficitSummary(n){
  ensureArts(n);
  const{arts,orders7,isOz}=D[n];
  if(!arts)return null;
  /* Заказы за 7д по ключу арт·размер */
  const om={};
  (orders7||[]).forEach(o=>{
    if(isOz)(o.products||[]).forEach(p=>{const key=(p.offer_id||'—')+' · —';om[key]=(om[key]||0)+(p.quantity||1);});
    else{const key=(o.supplierArticle||'—')+' · '+(o.techSize||'—');om[key]=(om[key]||0)+(o.quantity||1);}
  });
  let totalWb=0,totalSgp=0,totalRaw=0,totalO7=0;
  const seenArts=new Set();
  for(const key of Object.keys(arts)){
    const v=arts[key];
    totalWb+=v.total;
    totalO7+=om[key]||0;
    if(!seenArts.has(v.art)){
      seenArts.add(v.art);
      const{sgp,raw}=getStocksForArt(v.art);
      totalSgp+=sgp;totalRaw+=raw;
    }
  }
  const totalStk=totalWb+totalSgp+totalRaw;
  const dr=totalO7/7;
  const need30=Math.round(dr*30);
  const balance=totalStk-need30;
  return{totalWb,totalSgp,totalRaw,totalStk,drDay:Math.round(dr),need30,balance};
}

function calcDef(stk,o7,totalStk){
  /* stk = ВБ (для расчёта дней запаса на ВБ)
     totalStk = ВБ+СГП+Сырьё (для расчёта дефицита)
     Если totalStk не передан — используем stk */
  const ts=totalStk!=null?totalStk:stk;
  const dr=o7/7,need=Math.round(dr*30),days=dr>0?Math.round(stk/dr):null;
  let fc,bc,bw,sev;
  if(days===null){fc='fe';bc='bd';bw=0;sev=99999;}
  else if(days<14){fc='ff';bc='bf';bw=Math.min(100,days/14*100);sev=days;}
  else if(days<30){fc='fw';bc='bw';bw=Math.min(100,days/30*100);sev=days;}
  else if(days<=90){fc='fk';bc='bk';bw=Math.min(100,days/90*100);sev=days;}
  else{fc='fd';bc='bd';bw=100;sev=days;}
  const ft=days===null?'нет продаж':days<14?'🔥 горит':days<30?'⚠️ скоро':days<=90?'✅ норма':'💀 избыток';
  const def=Math.max(0,need-ts);
  return{stk,o7,need,days,def,fc,ft,bc,bw,sev,sc:stk===0?'qx':stk<10?'ql':'qo'};
}

function defTbl(n){
  const d=D[n];if(!d||!d.arts)return'<div class="em">Нет данных</div>';
  const{arts,orders7,isOz}=d;

  if(!om){

   КОНСОЛИДАЦИЯ
════════════════════════════════════════════════════════ */

/* Ozon: парсим артикул вида "Pantal.SK.bejnew.02_XL" → {baseArt, ozSz}
   Затем через gMap ищем: szPr=XL → wbSz (Размер ВБ)
   gMap ключ: "wbArt_lower;wbSz_lower" → [{artPr, szPr}]
   Нам нужен обратный маппинг: artPr_lower+szPr_lower → wbSz */
let gRevMap={}; // "baseArtLower;szPrLower" → wbSz

/* Нормализация обозначений размеров: 2XL≡XXL, 3XL≡XXXL, 4XL≡XXXXL и т.д.
   Используется и при построении gRevMap, и при поиске ozSz */
function normSz(sz){
  let s=(sz||'').toUpperCase().trim();
  /* NXL → N раз "X" + L, например 2XL → XXL, 5XL → XXXXXL */
  const m=s.match(/^(\d+)XL$/);
  if(m){const n=parseInt(m[1],10);return 'X'.repeat(n)+'L';}
  return s;
}

function buildRevMap(){
  gRevMap={};
  for(const [k,mappings] of Object.entries(gMap)){
    const parts=k.split(';');
    const wbArt=parts[0]||'',wbSz=parts[1]||'';
    mappings.forEach(({szPr})=>{
      /* Ключ: wbArt + НОРМАЛИЗОВАННЫЙ произв.размер → wbSz
         normSz сводит XXL/2XL, XXXL/3XL и т.д. к одному виду */
      const rk=wbArt+';'+normSz(szPr).toLowerCase();
      if(!gRevMap[rk])gRevMap[rk]=wbSz;
    });
  }
}

function parseOzonArt(offerID){
  /* "Pantal.SK.bejnew.02_XL" → baseArt="Pantal.SK.bejnew.02", ozSz="XL" */
  const last=offerID.lastIndexOf('_');
  if(last<0)return{baseArt:offerID,ozSz:'',wbSz:''};
  const baseArt=offerID.slice(0,last);
  const ozSz=offerID.slice(last+1);
  /* gRevMap ключ: wbArt_lower + ';' + нормализованный szPr_lower → wbSz
     Нормализация сводит 2XL/XXL, 3XL/XXXL и т.д. к одному виду перед поиском */
  const rk=baseArt.toLowerCase()+';'+normSz(ozSz).toLowerCase();
  const wbSz=gRevMap[rk]||ozSz; /* fallback: используем Ozon-размер как есть, если маппинг не нашёлся */
  return{baseArt,ozSz,wbSz};
}

/* Структура консолидации:
   consoData[wbArt][wbSz] = {
     stk:  {ef:0, ezfr:0, oz:0},
     o7:   {ef:0, ezfr:0, oz:0},
     msk:  {ef:0, ezfr:0}
   }
*/
function buildConsoData(){
  buildRevMap();
  const data={};

  function ensureSz(art,sz){
    if(!data[art])data[art]={};
    if(!data[art][sz])data[art][sz]={
      stk:{ef:0,ezfr:0,oz:0},
      o7:{ef:0,ezfr:0,oz:0},
      msk:{ef:0,ezfr:0}
    };
    return data[art][sz];
  }

  /* ── WB кабинеты (1=EF, 2=EZFR) ── */
  [1,2].forEach(n=>{
    const d=D[n];if(!d)return;
    const cab=n===1?'ef':'ezfr';
    const mskWhs=(d.mskWhs&&d.mskWhs.length)?d.mskWhs:
      (d.whList||[]).filter(w=>/коледино|электросталь|тула|подольск/i.test(w));

    /* Стоки */
    (d.stocks||[]).forEach(s=>{
      const art=s.supplierArticle||'';
      const sz=s.techSize||'—';
      const q=s.quantity||0;
      if(!art)return;
      const r=ensureSz(art,sz);
      r.stk[cab]+=q;
      /* МСК */
      const wh=s.warehouseName||'';
      if(mskWhs.some(m=>wh.toLowerCase().includes(m.toLowerCase())))r.msk[cab]+=q;
    });

    /* Заказы за 7 дней */
    (d.orders7||[]).forEach(o=>{
      const art=o.supplierArticle||'';
      const sz=o.techSize||'—';
      if(!art)return;
      ensureSz(art,sz).o7[cab]+=(o.quantity||1);
    });
  });

  /* ── Ozon (кабинет 3) ── */
  const dOz=D[3];
  if(dOz){
    /* Стоки Ozon */
    (dOz.stocks||[]).forEach(s=>{
      const offerID=s.item_code||s.offer_id||'';
      if(!offerID)return;
      const{baseArt,wbSz}=parseOzonArt(offerID);
      const q=s.free_to_sell_amount||s.quantity||0;
      ensureSz(baseArt,wbSz).stk.oz+=q;
    });

    /* Заказы Ozon за 7 дней */
    (dOz.orders7||[]).forEach(o=>{
      (o.products||[]).forEach(p=>{
        const offerID=p.offer_id||'';
        if(!offerID)return;
        const{baseArt,wbSz}=parseOzonArt(offerID);
        ensureSz(baseArt,wbSz).o7.oz+=(p.quantity||1);
      });
    });
  }

  return data;
}

    const artsArr=Object.values(d.arts||{});

    whList.forEach(w=>{totalByWh[w]=artsArr.reduce((s,a)=>s+(a.wh[w]||0),0);});
    const topWh=[...whList].sort((a,b)=>totalByWh[b]-totalByWh[a]).slice(0,8);
    const grandTotal=artsArr.reduce((s,a)=>s+a.total,0);
    sections+=`<div style="margin-bottom:14px">
      <div style="font-size:11px;font-weight:700;color:var(--ink2);margin-bottom:6px">${label} — всего ${grandTotal.toLocaleString('ru')} шт на ${whList.length} складах</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${topWh.map(w=>`<div style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:11px"><span style="color:var(--ink3)">${w.slice(0,18)}</span><br><b>${totalByWh[w].toLocaleString('ru')}</b></div>`).join('')}
      </div>
    </div>`;
  });
  const dOz=D[3];
  if(dOz){
    const total=(dOz.stocks||[]).reduce((s,r)=>s+(r.free_to_sell_amount||r.quantity||0),0);
    sections+=`<div style="margin-bottom:14px">
      <div style="font-size:11px;font-weight:700;color:var(--blue);margin-bottom:6px">Ozon — всего ${total.toLocaleString('ru')} шт (FBO)</div>
    </div>`;
  }
  return`<div class="sec"><div class="sh"><span class="st">📦 Остатки по складам · сводно</span></div>${sections||'<div class="em">Нет данных</div>'}</div>`;
}

/* ── Render Консо ── */
const CONSO_LOG=[];
function logConso(msg){
  CONSO_LOG.push(new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+' '+msg);
  const el=document.getElementById('consoLog');
  if(el)el.innerHTML=CONSO_LOG.slice(-8).map(l=>`<div>${l}</div>`).join('');
}

function renderConso(){
  const el=document.getElementById('v4');if(!el)return;
  const loaded=[D[1]&&'EF',D[2]&&'EZFR',D[3]&&'Ozon'].filter(Boolean);

  /* Step-by-step loader panel */
  const steps=[
    {n:1,label:'Easyform',color:'var(--ink)'},
    {n:2,label:'EZFR',color:'var(--ink)'},
    {n:3,label:'Ozon',color:'var(--blue)'},
  ];
  const stepsHTML=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px">${steps.map(s=>{
    const done=!!D[s.n];
    return`<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:${done?'#E8F5E9':'var(--bg3)'};border:1px solid ${done?'#4CAF50':'var(--border2)'};border-radius:9px;flex:1;min-width:200px">
      <span style="font-size:16px">${done?'✅':'⏳'}</span>
      <span style="font-weight:700;font-size:12px">${s.label}</span>
      ${done
        ?`<span style="font-size:10px;color:var(--green)">· ${(D[s.n].stocks||[]).length} стока · ${(D[s.n].orders7||[]).length} зак/7д</span>`
        :`<button class="loadbtn" style="margin:0;padding:5px 12px;font-size:10px" onclick="reloadForConso(${s.n})">↻ Загрузить</button>`
      }
    </div>`;
  }).join('')}</div>`;

  const logHTML=`<div id="consoLog" style="font-size:10px;color:var(--ink3);margin-top:8px;font-family:monospace;line-height:1.8">${CONSO_LOG.slice(-8).map(l=>`<div>${l}</div>`).join('')||'<div>— лог загрузки —</div>'}</div>`;

  if(!loaded.length){
    el.innerHTML=`<div style="max-width:480px;margin:40px auto">
      <div class="sh"><span class="st">📊 Консолидация — загрузка данных</span></div>
      ${stepsHTML}${logHTML}
    </div>`;
    return;
  }

  /* Build data */
  const data=buildConsoData();
  const hasEF=!!D[1],hasEZFR=!!D[2],hasOZ=!!D[3];

  /* Collect all arts and sizes */
  const artList=Object.keys(data).sort();

  /* Summary cards */
  const totalStk={ef:0,ezfr:0,oz:0};
  const totalO7={ef:0,ezfr:0,oz:0};
  for(const art of artList){
    for(const sz of Object.keys(data[art])){
      const r=data[art][sz];
      ['ef','ezfr','oz'].forEach(c=>{totalStk[c]+=r.stk[c];totalO7[c]+=r.o7[c];});
    }
  }
  /* СГП + Сырьё по всем артикулам — считаем один раз, используем и в карточке, и в дефиците */
  const sgpRawTotal=artList.reduce((s,a)=>{const ss=getStocksForArt(a);return{sgp:s.sgp+ss.sgp,raw:s.raw+ss.raw};},{sgp:0,raw:0});
  const totWbOz=totalStk.ef+totalStk.ezfr+totalStk.oz;
  const totStkAll=totWbOz+sgpRawTotal.sgp+sgpRawTotal.raw; /* теперь включает СГП+Сырьё */
  const totO7All=totalO7.ef+totalO7.ezfr+totalO7.oz;

  const cards=`<div class="mg" style="grid-template-columns:repeat(5,1fr)">
    <div class="mc" style="border-top:3px solid var(--ink)"><div class="ml">Общий сток</div><div class="mv">${totStkAll.toLocaleString('ru')}</div><div class="md" style="font-size:10px;color:var(--ink3)">${hasEF?'EF: '+totalStk.ef:''} ${hasEZFR?'· EZFR: '+totalStk.ezfr:''} ${hasOZ?'· OZ: '+totalStk.oz:''} · СГП: ${sgpRawTotal.sgp} · Сырьё: ${sgpRawTotal.raw}</div></div>
    <div class="mc" style="border-top:3px solid var(--green)"><div class="ml">Зак/день (7д) всего</div><div class="mv g">${Math.round(totO7All/7)}</div><div class="md" style="font-size:10px;color:var(--ink3)">${hasEF?'EF: '+Math.round(totalO7.ef/7):''} ${hasEZFR?'· EZFR: '+Math.round(totalO7.ezfr/7):''} ${hasOZ?'· OZ: '+Math.round(totalO7.oz/7):''}</div></div>
    <div class="mc" style="border-top:3px solid var(--amber)"><div class="ml">Потребность 30д</div><div class="mv a">${Math.round(totO7All/7*30).toLocaleString('ru')}</div></div>
    <div class="mc" style="border-top:3px solid var(--red)"><div class="ml">Дефицит (Общий−Потр.)</div>
      ${(()=>{const need=Math.round(totO7All/7*30);
      /* totStkAll уже включает СГП+Сырьё. Дефицит = Общий сток минус Потребность.
         Отрицательное = нехватка, положительное = профицит (запас сверху) */
      const balance=totStkAll-need;
      return balance<0
        ?`<div class="mv" style="color:var(--red)">−${Math.abs(balance).toLocaleString('ru')}</div>`
        :`<div class="mv" style="color:var(--green)">✓ +${balance.toLocaleString('ru')}</div>`;})()}
    </div>
    <div class="mc" style="border-top:3px solid #5B3FA0"><div class="ml">Кабинеты загружены</div><div class="mv" style="font-size:18px">${loaded.join(' · ')}</div></div>
  </div>`;

  /* Main table */
  /* Column headers depend on which cabinets are loaded */
  const cabCols=[];
  if(hasEF)cabCols.push({key:'ef',label:'EF',color:'#FFF8F0',accent:'#E65100'});
  if(hasEZFR)cabCols.push({key:'ezfr',label:'EZFR',color:'#F0F4FF',accent:'#1565C0'});
  if(hasOZ)cabCols.push({key:'oz',label:'Ozon',color:'#F0F0FF',accent:'var(--blue)'});

  const colCount=1 + cabCols.length*2 + 3 + 4 + 4; /* art + (stk+o7)*cabs + sgp+raw+общий_сток + потр+доля+деф+статус + дни */

  /* Group header */
  const grpHdr=`<tr style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em">
    <th rowspan="2" style="text-align:left;background:var(--bg3);vertical-align:middle">Артикул / Размер</th>
    ${cabCols.map(c=>`<th colspan="2" style="text-align:center;background:${c.color};color:${c.accent};border-bottom:2px solid ${c.accent}">${c.label}</th>`).join('')}
    <th colspan="1" style="text-align:center;background:#EDE7F6;color:#5B3FA0;border-bottom:2px solid #5B3FA0">🏭 СГП</th>
    <th colspan="1" style="text-align:center;background:#FBE9E7;color:#8B4513;border-bottom:2px solid #8B4513">🧵 Сырьё</th>
    <th colspan="1" style="text-align:center;background:#E8F5E9;color:#1B5E20;border-bottom:2px solid #4CAF50;font-weight:900">📊 Общий</th>
    <th colspan="4" style="text-align:center;background:#FFF8E1;color:#F57F17;border-bottom:2px solid #FFC107">📈 Потребность и дефицит</th>
    <th colspan="2" style="text-align:center;background:#E0F2F1;color:#004D40;border-bottom:2px solid #26A69A">⏱ Запас дней ×выкуп</th>
  </tr>
  <tr style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em">
    ${cabCols.map(c=>`
      <th style="text-align:center;background:${c.color};color:${c.accent}" data-tip="Остаток на складах ${c.label}">Сток</th>
      <th style="text-align:center;background:${c.color};color:${c.accent}" data-tip="Заказов в день за 7 дней — кабинет ${c.label}">Зак/д</th>
    `).join('')}
    <th style="text-align:center;background:#EDE7F6;color:#5B3FA0" data-tip="Остаток готовой продукции на вашем складе">СГП</th>
    <th style="text-align:center;background:#FBE9E7;color:#8B4513" data-tip="Полуфабрикаты на складе (nobrand суммируется)">Сырьё</th>
    <th style="text-align:center;background:#E8F5E9;color:#1B5E20;font-weight:900" data-tip="ВБ(EF+EZFR) + Ozon + СГП + Сырьё">ИТОГО</th>
    <th style="text-align:center;background:#FFF8E1;color:#F57F17" data-tip="Суммарных заказов в день по всем кабинетам">Зак/д ∑</th>
    <th style="text-align:center;background:#FFF8E1;color:#F57F17" data-tip="Потребность на 30 дней по всем кабинетам">Мес.</th>
    <th style="text-align:center;background:#FFF8E1;color:#F57F17" data-tip="Доля размера в заказах по этому артикулу (все кабинеты)">Доля</th>
    <th style="text-align:center;background:#FFF8E1;color:#F57F17" data-tip="Нехватка: потребность − общий сток">Дефицит</th>
    <th style="text-align:center;background:#E0F2F1;color:#004D40" data-tip="Дней хватит стока ВБ+Ozon (EF+EZFR+Ozon) с учётом выкупаемости">ВБ/ОЗ×</th>
    <th style="text-align:center;background:#E0F2F1;color:#004D40" data-tip="Дней хватит всего: ВБ+Ozon+СГП+Сырьё, с учётом выкупаемости">Всё×</th>
  </tr>`;

  const OAC=window._OAC||(window._OAC=new Set()); /* открытые артикулы в консо */

  /* Общая сумма заказов по ВСЕМ артикулам — для доли артикула */
  let grandTotalO7=0;
  for(const a2 of artList){
    for(const sz2 of Object.keys(data[a2])){
      const rr=data[a2][sz2];
      grandTotalO7+=rr.o7.ef+rr.o7.ezfr+rr.o7.oz;
    }
  }

  let rows='';
  for(const art of artList){
    const szMap=data[art];
    const szList=Object.keys(szMap).sort((a,b)=>szCmp(a,b));
    const br=getBuyrate(art);
    const{sgp:artSgp,raw:artRaw}=getStocksForArt(art);

    /* Суммы по артикулу */
    const artStk={ef:0,ezfr:0,oz:0},artO7={ef:0,ezfr:0,oz:0};
    szList.forEach(sz=>{
      ['ef','ezfr','oz'].forEach(c=>{artStk[c]+=szMap[sz].stk[c];artO7[c]+=szMap[sz].o7[c];});
    });
    const artWbStk=artStk.ef+artStk.ezfr;
    const artOzStk=artStk.oz;
    const artWbOzStk=artWbStk+artOzStk; /* ВБ/ОЗ — маркетплейсы без своего склада */
    const artTotalStk=artWbOzStk+artSgp+artRaw;
    const artTotalO7=artO7.ef+artO7.ezfr+artO7.oz;
    const artDr=artTotalO7/7;
    const artNeed=Math.round(artDr*30);
    const artDef=artNeed-artTotalStk;
    const effDr=artDr*br.val;
    const dWb=effDr>0?Math.round(artWbOzStk/effDr):null;
    const dAll=effDr>0?Math.round(artTotalStk/effDr):null;

    /* Status by dAll */
    const sd=dAll;
    const sfc=sd===null?'fe':sd<14?'ff':sd<30?'fw':sd<=90?'fk':'fd';
    const sft=sd===null?'∞':sd+'д';

    const wbC=artWbStk===0?'qx':artWbStk<20?'ql':'qo';
    const totC=artTotalStk===0?'qx':artTotalStk<30?'ql':'qo';
    const defC=artDef>0?'var(--red)':'var(--green)';
    const open=OAC.has(art);
    const hasSz=szList.length>1;
    const tog=hasSz?`<span class="tog" onclick="event.stopPropagation();togConsoArt('${art.replace(/'/g,"\\'")}',this)">${open?'▼':'▶'}</span>`:'<span class="tog"> </span>';

    rows+=`<tr class="ar-row" ${hasSz?`onclick="togConsoArt('${art.replace(/'/g,"\\'")}',null)"`:''} id="car_${art.replace(/[^a-z0-9]/gi,'_')}">
      <td>${tog}<span class="art">${art}</span><span class="buyrate ${br.est?'buyrate-est':'buyrate-ok'}">${Math.round(br.val*100)}%${br.est?'~':''}</span></td>
      ${cabCols.map(c=>{
        const s=artStk[c.key],o=Math.round(artO7[c.key]/7);
        const sc=s===0?'qx':s<20?'ql':'qo';
        return`<td class="${sc}" style="text-align:center;background:${c.color}">${s||'—'}</td><td style="text-align:center;background:${c.color};font-size:11px">${o||'—'}</td>`;
      }).join('')}
      <td style="text-align:center;color:#5B3FA0">${artSgp||'—'}</td>
      <td style="text-align:center;color:#8B4513">${artRaw||'—'}</td>
      <td class="${totC}" style="text-align:center;font-weight:900;font-size:14px">${artTotalStk}</td>
      <td style="text-align:center;font-weight:600">${Math.round(artDr)}</td>
      <td style="text-align:center">${artNeed||'—'}</td>
      <td style="text-align:center;font-size:11px;color:var(--blue)">${grandTotalO7>0&&artTotalO7>0?Math.round(artTotalO7/grandTotalO7*100)+'%':'—'}</td>
      <td style="text-align:center;font-weight:700;color:${defC}">${artDef>0?'−'+artDef.toLocaleString('ru'):'✓ +'+Math.abs(artDef).toLocaleString('ru')}</td>
      <td style="text-align:center">${fmtDays(dWb)}</td>
      <td style="text-align:center">${fmtDays(dAll)}</td>
    </tr>`;

    if(open){
      /* Общий о7 по артикулу для доли */
      szList.forEach(sz=>{
        const r=szMap[sz];
        const szO7=r.o7.ef+r.o7.ezfr+r.o7.oz;
        const szWbStk=r.stk.ef+r.stk.ezfr;
        const szOzStk=r.stk.oz;
        const szWbOzStk=szWbStk+szOzStk;
        const{sgp:szSgp,raw:szRaw}=getStocksForSz(art,sz);
        const szTotalStk=szWbOzStk+szSgp+szRaw;
        const szDr=szO7/7;
        const szNeed=Math.round(szDr*30);
        const szDef=szNeed-szTotalStk;
        const szEffDr=szDr*br.val;
        const szDWb=szEffDr>0?Math.round(szWbOzStk/szEffDr):null;
        const szDAll=szEffDr>0?Math.round(szTotalStk/szEffDr):null;
        const szShare=artTotalO7>0&&szO7>0?Math.round(szO7/artTotalO7*100)+'%':'—';
        const szSfc=szDAll===null?'fe':szDAll<14?'ff':szDAll<30?'fw':szDAll<=90?'fk':'fd';
        const szSft=szDAll===null?'∞':szDAll+'д';
        const szWbC=szWbStk===0?'qx':szWbStk<10?'ql':'qo';
        const szTotC=szTotalStk===0?'qx':szTotalStk<15?'ql':'qo';

        rows+=`<tr class="sz-row">
          <td style="padding-left:28px;font-weight:600">${sz}</td>
          ${cabCols.map(c=>{
            const s=r.stk[c.key],o=Math.round(r.o7[c.key]/7);
            const sc=s===0?'qx':s<10?'ql':'qo';
            return`<td class="${sc}" style="text-align:center;background:${c.color};font-size:11px">${s||'—'}</td><td style="text-align:center;background:${c.color};font-size:10px;color:var(--ink3)">${o||'—'}</td>`;
          }).join('')}
          <td style="text-align:center;font-size:11px;color:#5B3FA0">${szSgp||'—'}</td>
          <td style="text-align:center;font-size:11px;color:#8B4513">${szRaw||'—'}</td>
          <td class="${szTotC}" style="text-align:center;font-weight:700">${szTotalStk}</td>
          <td style="text-align:center;font-size:11px">${Math.round(szDr)}</td>
          <td style="text-align:center;font-size:11px">${szNeed||'—'}</td>
          <td style="text-align:center;font-size:11px;color:var(--blue)">${szShare}</td>
          <td style="text-align:center;font-size:11px;font-weight:700;color:${szDef>0?'var(--red)':'var(--green)'}">${szDef>0?'−'+szDef.toLocaleString('ru'):'✓ +'+Math.abs(szDef).toLocaleString('ru')}</td>
          <td style="text-align:center;font-size:11px">${fmtDays(szDWb)}</td>
          <td style="text-align:center;font-size:11px">${fmtDays(szDAll)}</td>
        </tr>`;
      });
    }
  }

  const tbl=`<div class="sw sw-sticky"><table><thead>${grpHdr}</thead><tbody>${rows||'<tr><td class="em" colspan="20">Нет данных — загрузите кабинеты</td></tr>'}</tbody></table></div>`;

  el.innerHTML=`
    <div style="max-width:480px;margin:0 0 16px">
      ${stepsHTML}
      ${logHTML}
    </div>
    ${cards}
    ${consoOrdersHTML()}
    <div class="sec">
      <div class="sh"><span class="st">📊 Консолидированный дефицит · ${loaded.join(' + ')}</span><span class="sm2">${artList.length} артикулов</span></div>
      ${tbl}
    </div>
    ${consoStocksHTML()}`;
}

function togConsoArt(art,togEl){
  const id='car_'+art.replace(/[^a-z0-9]/gi,'_');
  /* Toggle open state */
  const allTr=document.querySelectorAll('#v4 tr');
  /* Just re-render */
  const OAC_global=window._OAC||(window._OAC=new Set());
  if(OAC_global.has(art))OAC_global.delete(art);else OAC_global.add(art);
  renderConso();
}

async function reloadForConso(n){
  logConso(`⏳ Загружаю ${n===1?'EF':n===2?'EZFR':'Ozon'}...`);
  renderConso(); /* update UI to show loading state */
  const btn=document.getElementById('rb'+n),ic=document.getElementById('ri'+n);
  if(btn)btn.disabled=true;if(ic)ic.innerHTML='<span class="sp">↻</span>';
  await loadExternal();
  try{
    if(n<=2)await loadWB(n);else await loadOZ();
    logConso(`✅ ${n===1?'EF':n===2?'EZFR':'Ozon'} загружен`);
  }catch(e){
    logConso(`❌ Ошибка: ${e.message.slice(0,60)}`);
  }
  if(btn)btn.disabled=false;if(ic)ic.textContent='↻';
  renderConso();
}

/* ── Global tooltip (fixed, not clipped) ── */
(function(){
  const box=document.createElement('div');
  box.id='tip-box';document.body.appendChild(box);
  let cur=null;
  document.addEventListener('mouseover',e=>{
    const el=e.target.closest('[data-tip]');
    if(el&&el.dataset.tip){cur=el;box.textContent=el.dataset.tip;box.style.display='block';move(e);}
    else{box.style.display='none';cur=null;}
  });
  document.addEventListener('mousemove',e=>{if(cur)move(e);});
  document.addEventListener('mouseout',e=>{if(cur&&!cur.contains(e.relatedTarget)){box.style.display='none';cur=null;}});
  function move(e){
    const bw=box.offsetWidth||240,bh=box.offsetHeight||50;
    let x=e.clientX-bw/2,y=e.clientY-bh-12;
    x=Math.max(6,Math.min(x,window.innerWidth-bw-6));
    y=Math.max(6,y);
    box.style.left=x+'px';box.style.top=y+'px';
  }
})();
