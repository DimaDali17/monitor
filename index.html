<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>EasyForm Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F0EBE1;--bg2:#E8E1D4;--bg3:#FAF8F4;--card:#FFF;--border:rgba(160,148,128,.25);--border2:rgba(160,148,128,.45);--ink:#1A1610;--ink2:#6B6357;--ink3:#A09688;--green:#2D7A4F;--red:#B84040;--amber:#A06820;--blue:#005BFF;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Comfortaa',sans-serif;background:var(--bg);color:var(--ink);font-size:13px}

.header{background:var(--bg2);border-bottom:1px solid var(--border2);padding:0 20px;height:60px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.logo{width:38px;height:38px;border-radius:10px;object-fit:cover}
.bname{font-size:16px;font-weight:700}.bsub{font-size:9px;color:var(--ink3);letter-spacing:.12em;text-transform:uppercase}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px}
.clock{font-size:12px;color:var(--ink2);white-space:nowrap}
.tabs{display:flex;gap:2px;background:var(--bg);border-radius:8px;padding:3px}
.tab{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;border:none;background:0;color:var(--ink3);font-family:inherit;white-space:nowrap}
.tab.on{background:var(--ink);color:var(--bg3)}
.tab.ozon.on{background:var(--blue);color:#fff}
.b{padding:5px 10px;background:0;border:1px solid var(--border2);border-radius:7px;font-size:11px;font-weight:600;color:var(--ink2);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:4px;white-space:nowrap}
.b:hover{background:var(--ink);color:var(--bg3);border-color:var(--ink)}
.b:disabled{opacity:.4;cursor:default}
.upd{font-size:10px;color:var(--ink3)}

.sov{display:none;position:fixed;inset:0;background:rgba(240,235,225,.95);backdrop-filter:blur(6px);z-index:200;align-items:center;justify-content:center}
.sov.show{display:flex}
.sc{background:var(--card);border:1px solid var(--border2);border-radius:16px;padding:28px;width:480px;box-shadow:0 8px 40px rgba(0,0,0,.1);max-height:90vh;overflow-y:auto}
.slogo{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.stitle{font-size:20px;font-weight:700}.ssub{font-size:10px;color:var(--ink3);letter-spacing:.1em;text-transform:uppercase}
.ssec{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.1em;margin:16px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.fg{margin-bottom:10px}
.fl{font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px;font-weight:700}
.fi{width:100%;padding:8px 12px;font-size:12px;background:var(--bg3);border:1px solid var(--border2);border-radius:7px;color:var(--ink);font-family:inherit;outline:0}
.fi:focus{border-color:var(--ink)}
.sbtn{width:100%;padding:12px;background:var(--ink);color:var(--bg3);border:0;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:8px}
.smsg{font-size:12px;margin-top:8px;text-align:center}
.smsg.err{color:var(--red)}

.main{padding:20px;max-width:1400px;margin:0 auto}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.mc{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:14px 16px}
.ml{font-size:9px;color:var(--ink3);text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-bottom:7px}
.mv{font-size:24px;font-weight:700;line-height:1}.mv.g{color:var(--green)}.mv.a{color:var(--amber)}.mv.sm{font-size:18px}.mv.oz{color:var(--blue)}
.md{font-size:11px;margin-top:4px}
.du{color:var(--green)}.dd{color:var(--red)}.ds{color:var(--ink3)}

.sec{margin-bottom:20px}
.sh{display:flex;align-items:center;justify-content:space-between;padding-bottom:7px;margin-bottom:10px;border-bottom:1px solid var(--border2);flex-wrap:wrap;gap:6px}
.st{font-size:10px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.12em}
.sm{font-size:11px;color:var(--ink3)}
.flt{padding:5px 10px;font-size:11px;background:var(--bg3);border:1px solid var(--border2);border-radius:7px;color:var(--ink);font-family:inherit;outline:0;width:170px}
.flt:focus{border-color:var(--ink)}

.tw{background:var(--card);border:1px solid var(--border);border-radius:11px;overflow:hidden}
.sw{background:var(--card);border:1px solid var(--border);border-radius:11px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;padding:8px 12px;font-size:9px;font-weight:700;color:var(--ink3);background:var(--bg3);text-transform:uppercase;letter-spacing:.1em;border-bottom:1px solid var(--border);font-family:inherit;white-space:nowrap}
thead th.sa{background:var(--ink)!important;color:var(--bg3)!important}
thead th.wh{background:var(--bg2)!important;color:var(--ink2)!important}
thead th[onclick]{cursor:pointer;user-select:none}
tbody td{padding:7px 12px;color:var(--ink);border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--bg3)}
.tp{font-size:11px;font-weight:700;color:var(--ink2);background:var(--bg2);padding:2px 8px;border-radius:20px}
.art{font-family:monospace;font-size:11px;color:var(--ink2)}
.nb{font-size:9px;background:#E4F0EB;color:var(--green);padding:2px 6px;border-radius:10px;font-weight:700;margin-right:4px}
.pr{font-weight:700}.pc{font-size:11px;color:var(--blue);font-weight:600}
.qo{color:var(--green);font-weight:700}.ql{color:var(--amber);font-weight:700}.qx{color:var(--red);font-weight:700}
.tc{font-weight:700;background:var(--bg3)!important;text-align:center;font-size:15px}
.er td{text-align:center;padding:10px}
.eb{background:0;border:1px solid var(--border2);border-radius:7px;padding:5px 16px;font-size:11px;font-weight:600;color:var(--ink2);cursor:pointer;font-family:inherit}
.eb:hover{background:var(--ink);color:var(--bg3);border-color:var(--ink)}
.fl2{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.ff{background:#FEE8E8;color:#B84040}.fw{background:#FEF3E2;color:#A06820}
.fk{background:#E8F4EE;color:#2D7A4F}.fd{background:#EDEDF0;color:#6B6B80}.fe{background:#F5F5F5;color:#A09688}
.dbw{background:var(--bg2);border-radius:4px;height:5px;width:70px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:5px}
.db{height:100%;border-radius:4px}
.bf{background:#B84040}.bw{background:#A06820}.bk{background:#2D7A4F}.bd{background:#A09688}
.em{padding:28px;text-align:center;color:var(--ink3)}
.lm{padding:50px;text-align:center;color:var(--ink3)}
.sb{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--ink2);display:flex;gap:10px;align-items:flex-start;word-break:break-all}
.sde{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px;background:var(--red)}
.sp{display:inline-block;animation:spin .8s linear infinite}
.loadbtn{margin-top:14px;padding:9px 22px;background:var(--ink);color:var(--bg3);border:0;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

/* ═══ RATE-LIMITED FETCH ═══
   EF (каб.1) и Ozon → прокси 1 (PX).  EZFR (каб.2) → прокси 2 (PX2).
   ВАЖНО: оба прокси у вас на одном аккаунте Cloudflare = один IP для WB,
   а статистика WB лимитит по IP+токену. Поэтому очередь к WB — ОБЩАЯ:
   все WB-запросы (EF и EZFR) идут строго по одному, с короткой паузой. */
function pxFor(cab){return (cab===2&&PX2)?PX2:PX;}
let _wbBusy=Promise.resolve();   // общая очередь ко всем WB-запросам
let _wbLast=0;
const WB_GAP=1200;               // пауза между двумя WB-запросами подряд, мс
function wbQueue(fn){
  const run=_wbBusy.then(async()=>{
    const g=Math.max(0,_wbLast+WB_GAP-Date.now());
    if(g>0)await new Promise(r=>setTimeout(r,g));
    try{return await fn();}finally{_wbLast=Date.now();}
  });
  _wbBusy=run.catch(()=>{});      // очередь не должна рваться при ошибке
  return run;
}

async function wbGet(url,token,cab){
  const purl=pxFor(cab)+'?url='+encodeURIComponent(url);
  const waits=[3000,7000,15000];           // быстрый первый ретрай, далее нарастает
  let lastInfo='';
  return wbQueue(async()=>{
    for(let i=0;i<=waits.length;i++){
      let r,txt='';
      try{
        r=await fetch(purl,{headers:{'X-WB-Token':token}});
        txt=await r.text();
      }catch(netErr){lastInfo='сеть/прокси: '+netErr;r=null;}

      const retriable = !r || r.status===429 || r.status>=500 || !txt || !txt.trim();
      if(retriable){
        if(r) lastInfo = r.status===429 ? '429 (лимит токена/IP)' :
                         r.status>=500 ? ('WB '+r.status) :
                         (!txt||!txt.trim()) ? 'пустой ответ' : ('WB '+r.status);
        if(i===waits.length){
          throw new Error('WB: не удалось получить данные после '+(waits.length+1)+' попыток ('+lastInfo+'). Токен, вероятно, занят (PBI?). Подождите 1–2 мин и нажмите ↻.');
        }
        const ra=r?parseInt(r.headers.get('retry-after')||'0',10):0;
        const wait=ra>0?ra*1000:waits[i];
        const ic=document.getElementById('ri'+cab);if(ic)ic.innerHTML='<span class="sp">↻</span>';
        await new Promise(x=>setTimeout(x,wait));
        continue;
      }
      if(!r.ok){throw new Error('WB '+r.status+': '+txt.slice(0,200));}
      try{return JSON.parse(txt);}
      catch(e){throw new Error('WB: некорректный JSON — '+txt.slice(0,160));}
    }
  });
}

// Ozon → всегда прокси 1 (PX). Отдельный счётчик паузы.
let _ozT=0;
async function ozPost(url,body){
  const g=Math.max(0,_ozT+1200-Date.now());if(g>0)await new Promise(r=>setTimeout(r,g));_ozT=Date.now();
  const purl=PX+'?url='+encodeURIComponent(url);
  let r=await fetch(purl,{method:'POST',headers:{'X-Ozon-Client-Id':K.oid,'X-Ozon-Api-Key':K.okey,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.status===429){await new Promise(x=>setTimeout(x,8000));_ozT=Date.now();r=await fetch(purl,{method:'POST',headers:{'X-Ozon-Client-Id':K.oid,'X-Ozon-Api-Key':K.okey,'Content-Type':'application/json'},body:JSON.stringify(body)});}
  if(!r.ok){const t=await r.text().catch(()=>'');throw new Error('Ozon '+r.status+': '+t.slice(0,300));}
  return r;
}

// Безопасный разбор JSON: читаем как текст, пустой/битый ответ → {} вместо краха.
async function safeJson(r,label){
  const txt=await r.text().catch(()=>'');
  if(!txt||!txt.trim())return {};
  try{return JSON.parse(txt);}
  catch(e){throw new Error((label||'API')+': некорректный ответ — '+txt.slice(0,160));}
}

/* ═══ WB ═══  ровно 2 запроса, методы как в рабочем PBI.
   orders:  /supplier/orders?dateFrom=<ГГГГ-01-01>T00:00:00Z&flag=0
   stocks:  /supplier/stocks?dateFrom=<ГГГГ-01-01>T00:00:00Z&flag=0
   Дата URL-кодируется (%3A), как в PBI. Оба идут через общую очередь wbQueue. */
async function loadWB(n){
  const key=K[n],t=td(),y=yd(),w=wd();
  // Заказы: тянем ТОЛЬКО последние ~14 дней (нужно лишь сегодня/вчера/7дн) — ответ
  // в разы меньше и быстрее, чем с начала года. Остатки — как в PBI (dateFrom WB игнорит).
  const ordFrom=new Date(Date.now()-14*864e5).toISOString().slice(0,10)+'T00:00:00Z';
  const stkFrom=new Date().getFullYear()+'-01-01T00:00:00Z';
  const BASE='https://statistics-api.wildberries.ru/api/v1/supplier';
  const allOrdersR=await wbGet(BASE+'/orders?dateFrom='+ordFrom+'&flag=0',key,n);
  const stocksR  =await wbGet(BASE+'/stocks?dateFrom='+stkFrom+'&flag=0',key,n);
  const allOrders=Array.isArray(allOrdersR)?allOrdersR:[];
  const stocks=Array.isArray(stocksR)?stocksR:[];
  const orders7=allOrders.filter(o=>(o.date||'')>=w);
  const todayO=allOrders.filter(o=>(o.date||'').startsWith(t));
  const yestO=allOrders.filter(o=>(o.date||'').startsWith(y));
  D[n]={todayO,yestO,stocks,orders7};
  renderWB(n);
}

/* ═══ OZON ═══  всего 2 запроса: orders FBO(7дн) + остатки по складам
   Используем v2/posting/fbo/list (как в рабочем запросе PBI): result — массив. */
async function loadOZ(){
  const t=td(),y=yd(),w=wd();
  const OZ='https://api-seller.ozon.ru';

  // ── Заказы FBO: одно окно (7 дней), потом фильтруем в JS ──
  let postings=[],offset=0;
  for(let p=0;p<5;p++){            // максимум 5 страниц × 1000 = 5000 заказов
    const body={dir:'DESC',filter:{since:w+'T00:00:00.000Z',to:t+'T23:59:59.999Z'},limit:1000,offset};
    const r=await ozPost(OZ+'/v2/posting/fbo/list',body);
    const d=await safeJson(r,'Ozon orders');
    const arr=Array.isArray(d.result)?d.result:(d.result&&d.result.postings)||[];
    postings=postings.concat(arr);
    if(arr.length<1000)break;
    offset+=1000;
  }
  const dayOf=o=>(o.created_at||o.in_process_at||'').slice(0,10);
  const todayO=postings.filter(o=>dayOf(o)===t);
  const yestO =postings.filter(o=>dayOf(o)===y);

  // ── Остатки по складам: v2/analytics/stock_on_warehouses (как в рабочем PBI) ──
  // Ответ: result.rows[] с полями item_code, item_name, warehouse_name, free_to_sell_amount …
  let stocksRaw=[],soff=0;
  for(let p=0;p<6;p++){            // максимум 6 страниц × 500 = 3000 строк
    const rS=await ozPost(OZ+'/v2/analytics/stock_on_warehouses',{warehouse_type:'FBO',limit:500,offset:soff});
    const d=await safeJson(rS,'Ozon stocks');
    const rows=(d.result&&d.result.rows)||[];
    stocksRaw=stocksRaw.concat(rows);
    if(rows.length<500)break;
    soff+=500;
  }

  D[3]={todayO,yestO,stocks:stocksRaw,orders7:postings,isOz:true};
  renderOZ();
}

/* ═══ HELPERS ═══ */
const fmt=v=>Math.round(v).toLocaleString('ru')+' ₽';
function dlt(pct){return pct==null?'':pct>=0?'<span class="du">▲ +'+pct+'% к этому часу</span>':'<span class="dd">▼ '+pct+'% к этому часу</span>';}
function wbPrice(o){return o.finishedPrice||o.priceWithDisc||(o.totalPrice*(1-(o.discountPercent||0)/100))||o.totalPrice||0;}
function wbQty(s){return s.quantity||s.quantityFull||s.quantityNotInOrders||0;}
const ozRev=o=>(o.products||[]).reduce((s,p)=>s+parseFloat(p.price||p.offer_price||0)*(p.quantity||1),0);
// Фильтр вчерашних заказов до текущего часа (для честного сравнения)
function yestToHour(orders,type){
  const nowH=new Date().getHours(),nowM=new Date().getMinutes();
  return orders.filter(o=>{
    const dt=type==='oz'?(o.in_process_at||o.created_at):o.date;
    if(!dt)return false;
    const d=new Date(dt);
    return d.getHours()<nowH||(d.getHours()===nowH&&d.getMinutes()<=nowM);
  });
}

/* ═══ RENDER WB ═══ */
function renderWB(n){
  const{todayO,yestO,stocks}=D[n];
  const yH=yestToHour(yestO,'wb');            // вчера к этому часу
  const tC=todayO.length,yC=yestO.length,yhC=yH.length;
  const tR=todayO.reduce((s,o)=>s+wbPrice(o),0);
  const yR=yestO.reduce((s,o)=>s+wbPrice(o),0);
  const yhR=yH.reduce((s,o)=>s+wbPrice(o),0);
  const dO=yhC>0?Math.round((tC-yhC)/yhC*100):null;
  const dR=yhR>0?Math.round((tR-yhR)/yhR*100):null;

  let h=`<div class="mg">
    <div class="mc"><div class="ml">Заказы сегодня</div><div class="mv">${tC}</div><div class="md">${dlt(dO)}</div></div>
    <div class="mc"><div class="ml">Вчера (всего / к ${new Date().getHours()}:00)</div><div class="mv">${yC} <span style="font-size:14px;color:var(--ink3)">/ ${yhC}</span></div></div>
    <div class="mc"><div class="ml">Сумма сегодня</div><div class="mv sm g">${fmt(tR)}</div><div class="md">${dlt(dR)}</div></div>
    <div class="mc"><div class="ml">Сумма вчера</div><div class="mv sm">${fmt(yR)}</div></div>
  </div>`;

  h+=ordersHTML(n,todayO,'wb');
  h+=stocksHTML(n);
  h+=deficitHTML(n);

  document.getElementById('v'+n).innerHTML=h;
  paintTables(n);
}

function paintTables(n){
  const e1=document.getElementById('stbl'+n);if(e1)e1.innerHTML=stocksTbl(n);
  const e2=document.getElementById('dtbl'+n);if(e2)e2.innerHTML=defTbl(n);
}

/* ═══ ORDERS TABLE ═══ */
function ordersHTML(n,orders,type){
  const sorted=[...orders].sort((a,b)=>{
    const da=type==='wb'?a.date:(a.in_process_at||a.created_at);
    const db=type==='wb'?b.date:(b.in_process_at||b.created_at);
    return new Date(db)-new Date(da);
  });
  const show=EXP[n]?sorted:sorted.slice(0,LIM);
  const rows=show.map((o,i)=>{
    let t,art,sz,name,qty,price,pclient,wh;
    if(type==='wb'){
      t=o.date?new Date(o.date).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'}):'—';
      art=o.supplierArticle||'—';
      sz=o.techSize||'—';
      name=o.subject||o.category||'—';
      qty=o.quantity||1;price=wbPrice(o);pclient=o.salePrice||(price>0?Math.round(price*0.7):null);
      wh=o.warehouseName||'—';
    }else{
      const dt=o.in_process_at||o.created_at;
      t=dt?new Date(dt).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'}):'—';
      const items=o.products||[];
      art=items.map(p=>p.offer_id||'').join(', ');
      // Размер из offer_id: "ART_SIZE" → SIZE; или из name
      sz=items.map(p=>{const parts=(p.offer_id||'').split('_');return parts.length>1?parts[parts.length-1]:'—'}).join(', ');
      name=items.map(p=>p.name||'').join(', ');
      qty=items.reduce((s,p)=>s+(p.quantity||1),0);
      price=ozRev(o);pclient=null;
      wh=((o.analytics_data&&o.analytics_data.warehouse_name)||'—');
    }
    const pcCol=pclient?`<td><span class="pc">${fmt(pclient)}</span></td>`:(type==='wb'?'<td>—</td>':'');
    return `<tr><td><span class="tp">${t}</span></td><td><span class="art">${art}</span></td>
      <td>${sz}</td><td>${name}</td><td>${qty}</td><td><span class="pr">${price>0?fmt(price):'—'}</span></td>${pcCol}
      <td style="font-size:11px;color:var(--ink3)">${wh}</td></tr>`;
  }).join('');

  const exp=!EXP[n]&&sorted.length>LIM
    ?`<tr class="er"><td colspan="9"><button class="eb" onclick="togExp(${n},'${type}')">▼ Все ${sorted.length}</button></td></tr>`
    :sorted.length>LIM&&EXP[n]
    ?`<tr class="er"><td colspan="9"><button class="eb" onclick="togExp(${n},'${type}')">▲ Свернуть</button></td></tr>`:'';

  const thPC=type==='wb'?'<th>Цена клиента</th>':'';
  return `<div class="sec"><div class="sh"><span class="st">Заказы сегодня</span><span class="sm">${orders.length} заказов</span></div>
    <div class="tw"><table><thead><tr><th>Время</th><th>Артикул</th><th>Размер</th><th>Товар</th><th>Кол-во</th><th>Цена</th>${thPC}<th>Склад</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="9" class="em">Нет заказов</td></tr>'}${exp}</tbody></table></div></div>`;
}

function togExp(n,type){EXP[n]=!EXP[n];if(D[n]){if(n<=2)renderWB(n);else renderOZ();}}

/* ═══ STOCKS PIVOT ═══ */
function stocksHTML(n){
  const stocks=D[n].stocks,type=D[n].isOz?'oz':'wb';
  const arts={},whs=new Set();
  stocks.forEach(s=>{
    let art,sz,wh,q,name;
    if(type==='wb'){
      art=s.supplierArticle||'—';
      sz=s.techSize||'—';
      wh=s.warehouseName||'—';q=wbQty(s);name=s.subject||s.category||'';
    }else{
      art=s.item_code||s.offer_id||'—';
      sz='—';  // Ozon stock_on_warehouses не отдаёт размер отдельно
      wh=s.warehouse_name||'—';q=s.free_to_sell_amount||s.quantity||0;name=s.item_name||'';
    }
    const key=art+' · '+sz;       // ключ = артикул + размер
    whs.add(wh);
    if(!arts[key])arts[key]={art,sz,name,total:0,wh:{}};
    arts[key].wh[wh]=(arts[key].wh[wh]||0)+q;
    arts[key].total+=q;
  });
  const whTot={};whs.forEach(w=>{whTot[w]=Object.values(arts).reduce((s,a)=>s+(a.wh[w]||0),0)});
  const whList=[...whs].sort((a,b)=>whTot[b]-whTot[a]);
  D[n].arts=arts;D[n].whList=whList;
  if(!SS[n])SS[n]={c:'total',d:-1};

  return `<div class="sec"><div class="sh"><span class="st">Остатки по складам</span>
    <span style="display:flex;align-items:center;gap:8px">
      <input class="flt" id="sflt${n}" placeholder="🔎 фильтр по артикулу" value="${FS[n]||''}" oninput="fltS(${n},this.value)">
      <span class="sm">${Object.keys(arts).length} позиций · ${whList.length} складов</span>
    </span></div>
    <div class="sw" id="stbl${n}"><div class="lm"><span class="sp">↻</span></div></div></div>`;
}

function fltS(n,val){
  FS[n]=val;
  const e=document.getElementById('stbl'+n);if(e)e.innerHTML=stocksTbl(n);
}
function sortS(n,c){
  if(!SS[n])SS[n]={c:'total',d:-1};
  SS[n].d=SS[n].c===c?SS[n].d*-1:-1;SS[n].c=c;
  const e=document.getElementById('stbl'+n);if(e)e.innerHTML=stocksTbl(n);
}

function stocksTbl(n){
  const d=D[n];if(!d||!d.arts)return '<div class="em">Нет данных</div>';
  const{arts,whList}=d;
  const{c,d:dir}=SS[n]||{c:'total',d:-1};
  const f=(FS[n]||'').trim().toLowerCase();
  let keys=Object.keys(arts);
  if(f)keys=keys.filter(a=>{const v=arts[a];return v.art.toLowerCase().includes(f)||v.sz.toLowerCase().includes(f)||(v.name||'').toLowerCase().includes(f)});
  const artL=keys.sort((a,b)=>{
    const va=c==='total'?arts[a].total:(arts[a].wh[c]||0);
    const vb=c==='total'?arts[b].total:(arts[b].wh[c]||0);
    return(va-vb)*dir;
  });
  const ar=k=>SS[n].c===k?(SS[n].d<0?' ↓':' ↑'):' ↕';
  const cl=k=>SS[n].c===k?' sa':'';
  const whH=whList.map(w=>`<th class="wh${cl(w)}" onclick="sortS(${n},'${w.replace(/'/g,"\\'")}')"><span style="font-size:8px">${w.slice(0,14)}</span>${ar(w)}</th>`).join('');
  const show=EXS[n]?artL:artL.slice(0,LIM);
  const rows=show.map(a=>{
    const v=arts[a];const tc=v.total===0?'qx':v.total<10?'ql':'qo';
    const cells=whList.map(w=>{const q=v.wh[w]||0;return`<td class="${q===0?'qx':q<10?'ql':'qo'}" style="text-align:center">${q||'—'}</td>`}).join('');
    return`<tr><td><span class="art">${v.art}</span><div style="font-size:10px;color:var(--ink3)">${v.name.slice(0,22)}</div></td><td style="text-align:center;font-weight:600">${v.sz}</td><td class="tc ${tc}">${v.total}</td>${cells}</tr>`;
  }).join('');
  const span=whList.length+3;
  const exp=artL.length>LIM
    ? `<tr class="er"><td colspan="${span}"><button class="eb" onclick="togExS(${n})">${EXS[n]?'▲ Свернуть':'▼ Все '+artL.length}</button></td></tr>`
    : '';
  return`<table><thead><tr><th>Артикул</th><th>Размер</th><th class="${cl('total')}" style="background:var(--bg3)" onclick="sortS(${n},'total')">Итого${ar('total')}</th>${whH}</tr></thead><tbody>${rows||'<tr><td class="em" colspan="99">Ничего не найдено</td></tr>'}${exp}</tbody></table>`;
}
function togExS(n){EXS[n]=!EXS[n];const e=document.getElementById('stbl'+n);if(e)e.innerHTML=stocksTbl(n);}

/* ═══ DEFICIT ═══ */
function deficitHTML(n){
  return`<div class="sec"><div class="sh"><span class="st">📦 Дефицит и неликвид</span>
    <span class="sm" style="display:flex;gap:4px;flex-wrap:wrap">
      <span class="fl2 ff">🔥 &lt;14дн</span><span class="fl2 fw">⚠️ 14-30</span>
      <span class="fl2 fk">✅ 30-90</span><span class="fl2 fd">💀 &gt;90</span>
    </span></div>
    <div class="sw" id="dtbl${n}"><div class="lm"><span class="sp">↻</span></div></div></div>`;
}

function sortD(n,c){const s=DS[n];s.d=s.c===c?s.d*-1:(c==='days'?1:-1);s.c=c;const e=document.getElementById('dtbl'+n);if(e)e.innerHTML=defTbl(n);}

function defTbl(n){
  const d=D[n];if(!d||!d.arts)return'<div class="em">Нет данных</div>';
  const{arts,orders7,isOz}=d;
  // Карта продаж за 7дн по ключу «артикул · размер» (как в остатках)
  let om=d._om;
  if(!om){
    om={};
    (orders7||[]).forEach(o=>{
      if(isOz){
        (o.products||[]).forEach(p=>{const key=(p.offer_id||'—')+' · —';om[key]=(om[key]||0)+(p.quantity||1)});
      }else{
        const key=(o.supplierArticle||'—')+' · '+(o.techSize||'—');
        om[key]=(om[key]||0)+(o.quantity||1);
      }
    });
    d._om=om;
  }
  const rows=Object.keys(arts).map(a=>{
    const v=arts[a];
    const stk=v.total,name=v.name||'',o7=om[a]||0;
    const dr=o7/7,need=Math.round(dr*30),days=dr>0?Math.round(stk/dr):null;
    let fc,ft,bc,bw,sev;
    if(days===null){fc='fe';ft='— нет продаж';bc='bd';bw=0;sev=99999;}
    else if(days<14){fc='ff';ft='🔥 '+days+'дн';bc='bf';bw=Math.min(100,days/14*100);sev=days;}
    else if(days<30){fc='fw';ft='⚠️ '+days+'дн';bc='bw';bw=Math.min(100,days/30*100);sev=days;}
    else if(days<=90){fc='fk';ft='✅ '+days+'дн';bc='bk';bw=Math.min(100,days/90*100);sev=days;}
    else{fc='fd';ft='💀 '+days+'д';bc='bd';bw=100;sev=days;}
    const def=need>stk?need-stk:0;
    const sc=stk===0?'qx':stk<10?'ql':'qo';
    return{a,art:v.art,sz:v.sz,name,stk,o7,need,days,def,fc,ft,bc,bw,sc,sev};
  });
  const{c,d:dir}=DS[n];
  rows.sort((a,b)=>{
    if(c==='art')return dir*(a.a<b.a?-1:a.a>b.a?1:0);
    let va,vb;
    if(c==='stk'){va=a.stk;vb=b.stk}else if(c==='o7'){va=a.o7;vb=b.o7}
    else if(c==='need'){va=a.need;vb=b.need}else if(c==='def'){va=a.def;vb=b.def}
    else{va=a.sev;vb=b.sev}
    return dir*(va-vb);
  });
  const ar=k=>DS[n].c===k?(DS[n].d>0?' ↑':' ↓'):' ↕';
  const cl=k=>DS[n].c===k?' sa':'';
  const th=(k,l,al='center')=>`<th class="${cl(k)}" onclick="sortD(${n},'${k}')" style="text-align:${al}">${l}${ar(k)}</th>`;
  const show=EXD[n]?rows:rows.slice(0,LIM);
  const trs=show.map(r=>`<tr>
    <td><span class="art">${r.art}</span><div style="font-size:10px;color:var(--ink3)">${r.name.slice(0,24)}</div></td>
    <td style="text-align:center;font-weight:600">${r.sz}</td>
    <td class="${r.sc}" style="text-align:center;font-size:14px;font-weight:700">${r.stk}</td>
    <td style="text-align:center">${r.o7}</td>
    <td style="text-align:center;color:var(--ink2)">${r.need||'—'}</td>
    <td style="text-align:center;color:${r.def>0?'var(--red)':'var(--green)'};font-weight:${r.def>0?700:400}">${r.def>0?'-'+r.def:'✓'}</td>
    <td><span class="fl2 ${r.fc}">${r.ft}</span>${r.days!=null?`<span class="dbw"><span class="db ${r.bc}" style="width:${r.bw}%"></span></span>`:''}</td>
  </tr>`).join('');
  const exp=rows.length>LIM
    ? `<tr class="er"><td colspan="7"><button class="eb" onclick="togExD(${n})">${EXD[n]?'▲ Свернуть':'▼ Все '+rows.length}</button></td></tr>`
    : '';
  return`<table><thead><tr>${th('art','Артикул','left')}<th>Размер</th>${th('stk','Остаток')}${th('o7','7дн заказов')}${th('need','Потребн. 30дн')}${th('def','Дефицит')}${th('days','Статус')}</tr></thead><tbody>${trs||'<tr><td class="em" colspan="7">Нет</td></tr>'}${exp}</tbody></table>`;
}
function togExD(n){EXD[n]=!EXD[n];const e=document.getElementById('dtbl'+n);if(e)e.innerHTML=defTbl(n);}
