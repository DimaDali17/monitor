<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EasyForm Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Настройки -->
<div class="sov" id="setup">
  <div class="sc">
    <div class="slogo">
      <img class="logo" id="slogoimg" alt="">
      <div><div class="stitle">EasyForm</div><div class="ssub">Dashboard</div></div>
    </div>

    <div class="ssec">Wildberries</div>
    <div class="fg"><div class="fl">Ключ Easyform</div><input class="fi" id="sk1" placeholder="eyJhbGciOi…"></div>
    <div class="fg"><div class="fl">Ключ EZFR</div><input class="fi" id="sk2" placeholder="eyJhbGciOi…"></div>

    <div class="ssec">Ozon</div>
    <div class="fg"><div class="fl">Client-ID</div><input class="fi" id="soid" placeholder="123456"></div>
    <div class="fg"><div class="fl">API-ключ</div><input class="fi" id="sokey" placeholder="xxxxxxxx-xxxx-…"></div>

    <div class="ssec">Прокси</div>
    <div class="fg"><div class="fl">Основной воркер</div><input class="fi" id="sprx"></div>
    <div class="fg">
      <div class="fl">Второй воркер (для EZFR, необязательно)</div>
      <input class="fi" id="sprx2" placeholder="свой воркер для второго кабинета">
    </div>

    <button class="sbtn" onclick="App.doSave()">Сохранить и загрузить</button>
    <div class="smsg" id="smsg"></div>
  </div>
</div>

<!-- Шапка -->
<div class="header">
  <img class="logo" id="hlogo" alt="">
  <div><div class="bname">EasyForm</div><div class="bsub">Dashboard</div></div>

  <div class="tabs" style="margin-left:20px">
    <button class="tab on" onclick="App.go(1)">
      <img class="logo" id="logo1" alt="" style="width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px">Easyform
    </button>
    <button class="tab" onclick="App.go(2)">
      <img class="logo" id="logo2" alt="" style="width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px">EZFR
    </button>
    <button class="tab ozon" onclick="App.go(3)">
      <img class="logo" id="logo3" alt="" style="width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px">Ozon
    </button>
    <button class="tab conso" onclick="App.go(4)">📊 Консо</button>
  </div>

  <div class="hright">
    <button class="ver-badge ver-check" id="verBtn" onclick="App.checkVersion()" data-tip="Клик — проверить, не вышла ли новая версия"></button>
    <span class="clock" id="clk"></span>
    <span class="upd" id="upd"></span>
    <button class="b" id="rb1" onclick="App.reload(1,true)" data-tip="Загрузить Easyform заново, минуя кэш">↻ EF</button>
    <button class="b" id="rb2" onclick="App.reload(2,true)" data-tip="Загрузить EZFR заново, минуя кэш">↻ EZFR</button>
    <button class="b" id="rb3" onclick="App.reload(3,true)" data-tip="Загрузить Ozon заново, минуя кэш">↻ OZ</button>
    <button class="b" onclick="App.openSetup()">⚙</button>
  </div>
</div>

<!-- Кабинеты -->
<div class="main">
  <div class="view" id="v1"></div>
  <div class="view" id="v2" style="display:none"></div>
  <div class="view" id="v3" style="display:none"></div>
  <div class="view" id="v4" style="display:none"></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
