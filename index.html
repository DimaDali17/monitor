<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>EasyForm · WB Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#F0EBE1; --bg2:#E8E1D4; --bg3:#FAF8F4; --card:#FFFFFF;
  --border:rgba(160,148,128,0.25); --border2:rgba(160,148,128,0.45);
  --ink:#1A1610; --ink2:#6B6357; --ink3:#A09688;
  --green:#2D7A4F; --red:#B84040; --amber:#A06820; --blue:#2A5FA0;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Comfortaa',sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; font-size:13px; }

.header {
  background:var(--bg2); border-bottom:1px solid var(--border2);
  padding:0 28px; height:64px; display:flex; align-items:center; gap:16px;
  position:sticky; top:0; z-index:100;
}
.logo-mark { width:40px; height:40px; background:var(--ink); border-radius:10px; display:flex; align-items:center; justify-content:center; }
.logo-mark svg { width:22px; height:22px; }
.brand-name { font-size:18px; font-weight:700; }
.brand-sub { font-size:9px; color:var(--ink3); letter-spacing:.12em; text-transform:uppercase; margin-top:1px; }
.header-right { margin-left:auto; display:flex; align-items:center; gap:12px; }
.clock { font-size:13px; color:var(--ink2); }
.cab-tabs { display:flex; gap:3px; background:var(--bg); border-radius:8px; padding:3px; }
.cab-tab { padding:5px 14px; border-radius:6px; font-size:12px; font-weight:700; cursor:pointer; border:none; background:transparent; color:var(--ink3); transition:all .15s; font-family:'Comfortaa',sans-serif; }
.cab-tab.active { background:var(--ink); color:#FAF8F4; }
.btn { padding:7px 14px; background:transparent; border:1px solid var(--border2); border-radius:8px; font-size:12px; font-weight:600; color:var(--ink2); cursor:pointer; font-family:'Comfortaa',sans-serif; display:flex; align-items:center; gap:5px; transition:all .15s; }
.btn:hover { background:var(--ink); color:#FAF8F4; border-color:var(--ink); }
.btn:disabled { opacity:.4; cursor:default; }
.updated { font-size:11px; color:var(--ink3); }

/* SETUP */
.setup-overlay { display:none; position:fixed; inset:0; background:rgba(240,235,225,.94); backdrop-filter:blur(6px); z-index:200; align-items:center; justify-content:center; }
.setup-overlay.show { display:flex; }
.setup-card { background:var(--card); border:1px solid var(--border2); border-radius:16px; padding:36px; width:480px; box-shadow:0 8px 40px rgba(0,0,0,.1); }
.setup-logo { display:flex; align-items:center; gap:12px; margin-bottom:28px; }
.setup-title { font-size:22px; font-weight:700; }
.setup-sub { font-size:10px; color:var(--ink3); letter-spacing:.1em; text-transform:uppercase; }
.field-group { margin-bottom:14px; }
.field-label { font-size:10px; color:var(--ink3); text-transform:uppercase; letter-spacing:.1em; margin-bottom:6px; font-weight:700; }
.field-input { width:100%; padding:10px 14px; font-size:13px; background:var(--bg3); border:1px solid var(--border2); border-radius:8px; color:var(--ink); font-family:'Comfortaa',sans-serif; outline:none; transition:border-color .15s; }
.field-input:focus { border-color:var(--ink); }
.setup-btn { width:100%; padding:13px; background:var(--ink); color:#FAF8F4; border:none; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; font-family:'Comfortaa',sans-serif; margin-top:8px; transition:opacity .15s; }
.setup-btn:hover { opacity:.85; }
.setup-msg { font-size:12px; margin-top:10px; text-align:center; }
.setup-msg.err { color:var(--red); } .setup-msg.wait { color:var(--ink3); }

/* MAIN */
.main { padding:24px 28px; max-width:1400px; margin:0 auto; }

/* METRICS */
.metrics-row { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:20px; }
.metric-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px 20px; }
.metric-label { font-size:9px; color:var(--ink3); text-transform:uppercase; letter-spacing:.12em; font-weight:700; margin-bottom:10px; }
.metric-val { font-size:28px; font-weight:700; color:var(--ink); line-height:1; }
.metric-val.green { color:var(--green); } .metric-val.amber { color:var(--amber); } .metric-val.sm { font-size:20px; }
.metric-delta { font-size:11px; margin-top:6px; }
.delta-up { color:var(--green); } .delta-down { color:var(--red); } .delta-same { color:var(--ink3); }

/* ADS BLOCK */
.ads-row { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
.ads-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px; border-top:3px solid var(--amber); }
.ads-label { font-size:9px; color:var(--amber); text-transform:uppercase; letter-spacing:.12em; font-weight:700; margin-bottom:8px; }
.ads-val { font-size:24px; font-weight:700; color:var(--ink); }
.ads-sub { font-size:11px; color:var(--ink3); margin-top:4px; }

/* SECTION */
.section { margin-bottom:24px; }
.section-hdr { display:flex; align-items:center; justify-content:space-between; padding-bottom:8px; margin-bottom:12px; border-bottom:1px solid var(--border2); }
.section-title { font-size:10px; font-weight:700; color:var(--ink2); text-transform:uppercase; letter-spacing:.12em; }
.section-meta { font-size:11px; color:var(--ink3); }

/* TABLE */
.tbl-wrap { background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
.stocks-tbl-wrap { background:var(--card); border:1px solid var(--border); border-radius:12px; overflow-x:auto; }
table { width:100%; border-collapse:collapse; }
thead th { text-align:left; padding:10px 14px; font-size:9px; font-weight:700; color:var(--ink3); background:var(--bg3); text-transform:uppercase; letter-spacing:.1em; border-bottom:1px solid var(--border); font-family:'Comfortaa',sans-serif; }
tbody td { padding:9px 14px; color:var(--ink); border-bottom:1px solid var(--border); vertical-align:middle; }
tbody tr:last-child td { border-bottom:none; }
tbody tr:hover { background:var(--bg3); }
.time-pill { font-size:11px; font-weight:700; color:var(--ink2); background:var(--bg2); padding:3px 9px; border-radius:20px; }
.art { font-family:monospace; font-size:11px; color:var(--ink2); }
.new-badge { font-size:9px; background:#E4F0EB; color:var(--green); padding:2px 7px; border-radius:10px; font-weight:700; margin-right:5px; }
.price { font-weight:700; }
.price-client { font-size:11px; color:var(--blue); font-weight:600; }
.qty-ok { color:var(--green); font-weight:700; } .qty-low { color:var(--amber); font-weight:700; } .qty-out { color:var(--red); font-weight:700; }
.total-col { font-weight:700; background:var(--bg3) !important; text-align:center; font-size:15px; }
.wh-col { background:var(--bg2) !important; color:var(--ink2) !important; }
.expand-row td { text-align:center; padding:12px; }
.expand-btn { background:transparent; border:1px solid var(--border2); border-radius:8px; padding:7px 20px; font-size:12px; font-weight:600; color:var(--ink2); cursor:pointer; font-family:'Comfortaa',sans-serif; transition:all .15s; }
.expand-btn:hover { background:var(--ink); color:#FAF8F4; border-color:var(--ink); }

/* DEFICIT */
.deficit-wrap { background:var(--card); border:1px solid var(--border); border-radius:12px; overflow-x:auto; }
.deficit-wrap table { min-width:900px; }
.flag { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; }
.flag-fire  { background:#FEE8E8; color:#B84040; }   /* < 14 дней — огонь */
.flag-warn  { background:#FEF3E2; color:#A06820; }   /* 14-30 дней — внимание */
.flag-ok    { background:#E8F4EE; color:#2D7A4F; }   /* 30-90 дней — норм */
.flag-dead  { background:#EDEDF0; color:#6B6B80; }   /* > 90 дней — неликвид */
.flag-empty { background:#F5F5F5; color:#A09688; }   /* нет данных */
.days-bar-wrap { background:var(--bg2); border-radius:4px; height:6px; width:80px; overflow:hidden; display:inline-block; vertical-align:middle; margin-left:6px; }
.days-bar { height:100%; border-radius:4px; }
.bar-fire { background:#B84040; }
.bar-warn { background:#A06820; }
.bar-ok   { background:#2D7A4F; }
.bar-dead { background:#A09688; }
thead th.sort-active { background:var(--ink) !important; color:#FAF8F4 !important; }

.empty { padding:40px; text-align:center; color:var(--ink3); }
.loading-msg { padding:30px; text-align:center; color:var(--ink3); font-size:13px; }
.spin { display:inline-block; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* STATUS */
.status-bar { background:var(--bg3); border:1px solid var(--border); border-radius:10px; padding:12px 18px; margin-bottom:20px; font-size:12px; color:var(--ink2); display:flex; gap:16px; align-items:center; }
.status-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.status-dot.ok { background:var(--green); } .status-dot.err { background:var(--red); } .status-dot.loading { background:var(--amber); animation:pulse 1s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
</style>
</head>
<body>

<div class="setup-overlay show" id="setupOverlay">
  <div class="setup-card">
    <div class="setup-logo">
      <div class="logo-mark" style="width:48px;height:48px;border-radius:12px">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 6h11M4 12h11M4 18h7" stroke="#FAF8F4" stroke-width="2.5" stroke-linecap="round"/><path d="M18 9l3 3-3 3" stroke="#FAF8F4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div><div class="setup-title">EasyForm</div><div class="setup-sub">Wildberries · Аналитика</div></div>
    </div>
    <div class="field-group">
      <div class="field-label">API-ключ Easyform (кабинет 1)</div>
      <input class="field-input" type="password" id="sk1" placeholder="eyJhbGciOiJFUzI1NiIs...">
    </div>
    <div class="field-group">
      <div class="field-label">API-ключ EZFR (кабинет 2)</div>
      <input class="field-input" type="password" id="sk2" placeholder="eyJhbGciOiJFUzI1NiIs...">
    </div>
    <button class="setup-btn" onclick="saveKeys()">Загрузить дашборд</button>
    <div class="setup-msg" id="setupMsg"></div>
  </div>
</div>

<div class="header">
  <img id="headerLogo" src="" style="width:40px;height:40px;border-radius:10px;object-fit:cover;flex-shrink:0">
  <div><div class="brand-name" id="headerBrand">EasyForm</div><div class="brand-sub">Wildberries Dashboard</div></div>
  <div class="header-right">
    <div class="clock" id="clock"></div>
    <div class="cab-tabs">
      <button class="cab-tab active" onclick="switchCab(1)">Easyform</button>
      <button class="cab-tab" onclick="switchCab(2)">EZFR</button>
    </div>
    <button class="btn" id="refreshBtn1" onclick="refreshOne(1)"><span id="rIcon1">↻</span> Easyform</button>
    <button class="btn" id="refreshBtn2" onclick="refreshOne(2)"><span id="rIcon2">↻</span> EZFR</button>
    <span class="updated" id="updBadge"></span>
    <button class="btn" style="padding:7px 10px" onclick="openSetup()">⚙</button>
  </div>
</div>

<div class="main">
  <div id="v1"><div class="loading-msg">Введите API-ключи для загрузки</div></div>
  <div id="v2" style="display:none"><div class="loading-msg">Введите API-ключи для загрузки</div></div>
</div>

const keys={1:'',2:''};
let currentCab=1;
const PREVIEW=20;
const expanded={1:false,2:false};

function updateClock(){
  document.getElementById('clock').textContent=
    new Date().toLocaleDateString('ru',{day:'2-digit',month:'2-digit',year:'numeric'})+' · '+
    new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
setInterval(updateClock,1000); updateClock();

function dateStr(d){return d.toISOString().slice(0,10);}
function todayStr(){return dateStr(new Date());}
function yesterdayStr(){return dateStr(new Date(Date.now()-86400000));}

function saveKeys(){
  const k1=document.getElementById('sk1').value.trim();
  const k2=document.getElementById('sk2').value.trim();
  if(!k1&&!k2){showSetupMsg('Введите хотя бы один ключ','err');return;}
  if(k1)keys[1]=k1; if(k2)keys[2]=k2;
  try{if(k1)localStorage.setItem('ef_k1',k1);if(k2)localStorage.setItem('ef_k2',k2);}catch(e){}
  document.getElementById('setupOverlay').classList.remove('show');
  refreshData();
}
function openSetup(){
  document.getElementById('sk1').value=keys[1]||'';
  document.getElementById('sk2').value=keys[2]||'';
  document.getElementById('setupOverlay').classList.add('show');
}
function showSetupMsg(t,c){const el=document.getElementById('setupMsg');el.textContent=t;el.className='setup-msg '+c;}

function switchCab(n){
  currentCab=n;
  document.querySelectorAll('.cab-tab').forEach((t,i)=>t.classList.toggle('active',i===n-1));
  document.getElementById('v1').style.display=n===1?'block':'none';
  document.getElementById('v2').style.display=n===2?'block':'none';
  document.getElementById('headerLogo').src=n===1?LOGO_EF:LOGO_EZFR;
  document.getElementById('headerBrand').textContent=n===1?'EasyForm':'EZFR';
}

// Глобальная очередь: все запросы к WB строго по одному, пауза >= 2.5 сек
let _lastReq = 0;
async function wbFetch(url, opts={}){
  const wait = Math.max(0, _lastReq + 2500 - Date.now());
  if(wait > 0) await new Promise(r=>setTimeout(r,wait));
  _lastReq = Date.now();
  const r = await fetch(url, opts);
  if(r.status===429){
    await new Promise(res=>setTimeout(res,10000));
    _lastReq = Date.now();
    const r2 = await fetch(url, opts);
    if(!r2.ok) throw new Error('Ошибка WB API '+r2.status+' — лимит, попробуйте через минуту');
    return r2;
  }
  if(!r.ok) throw new Error('Ошибка WB API '+r.status);
  return r;
}
async function fetchWithRetry(url, headers){ return wbFetch(url, {headers}); }

async function refreshOne(n){
  if(!keys[n]){ alert('Нет API-ключа для кабинета '+n+'. Нажмите ⚙'); return; }
  const btn=document.getElementById('refreshBtn'+n);
  const icon=document.getElementById('rIcon'+n);
  if(btn) btn.disabled=true;
  if(icon) icon.innerHTML='<span class="spin">↻</span>';
  document.getElementById('v'+n).innerHTML='<div class="loading-msg"><span class="spin">↻</span> Загрузка...</div>';
  await loadCab(n);
  if(btn) btn.disabled=false;
  if(icon) icon.textContent='↻';
  document.getElementById('updBadge').textContent='обновлено '+new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
}

async function refreshData(){
  const btn=document.getElementById('refreshBtn');
  const icon=document.getElementById('rIcon');
  btn.disabled=true; icon.innerHTML='<span class="spin">↻</span>';

  // Загружаем кабинеты ПОСЛЕДОВАТЕЛЬНО чтобы не получить 429
  if(keys[1]){
    document.getElementById('v1').innerHTML='<div class="loading-msg"><span class="spin">↻</span> Загрузка кабинета Easyform...</div>';
    await loadCab(1);
  }
  if(keys[2]){
    document.getElementById('v2').innerHTML='<div class="loading-msg"><span class="spin">↻</span> Загрузка кабинета EZFR...</div>';
    // Пауза 1.5 сек между кабинетами
    await loadCab(2);
  }

  btn.disabled=false; icon.textContent='↻';
  document.getElementById('updBadge').textContent='обновлено '+new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
}

async function loadCab(n){
  const key=keys[n]; if(!key)return;
  const today=todayStr(), yest=yesterdayStr();
  const h={'Authorization':key};

  try{
    // Запросы ПОСЛЕДОВАТЕЛЬНО с паузами — 429 от параллельных запросов
    const r1=await fetchWithRetry(`https://statistics-api.wildberries.ru/api/v1/supplier/orders?dateFrom=${today}T00:00:00&flag=0`,h);
    const r2=await fetchWithRetry(`https://statistics-api.wildberries.ru/api/v1/supplier/orders?dateFrom=${yest}T00:00:00&flag=0`,h);
    const r3=await fetchWithRetry(`https://statistics-api.wildberries.ru/api/v1/supplier/stocks?dateFrom=${today}`,h);

    const [allToday,allYest,stocks]=await Promise.all([r1.json(),r2.json(),r3.json()]);

    // Только заказы нужного дня
    const todayOrders=allToday.filter(o=>(o.date||'').startsWith(today));
    const yesterdayOrders=allYest.filter(o=>(o.date||'').startsWith(yest));

    // Реклама — отдельный API, не падаем если нет доступа
    let adsData=null;
    try{
        const rAds=await wbFetch(`https://advert-api.wildberries.ru/adv/v2/fullstats`,{
        method:'POST',
        headers:{...h,'Content-Type':'application/json'},
        body:JSON.stringify([{id:0,intervals:[{begin:today+'T00:00:00',end:today+'T23:59:59'}]}])
      });
      // Если нет доступа к рекламному API — просто пропускаем
      if(rAds.ok){
        const adsRaw=await rAds.json();
        adsData=adsRaw;
      }
    }catch(e){ /* реклама недоступна */ }

    // orders7 = все заказы за 7 дней (используем allToday — оно содержит данные с dateFrom=weekAgo)
    // но нам нужен отдельный запрос за 7 дней
    const weekAgo = new Date(Date.now()-7*86400000).toISOString().slice(0,10);
    let orders7 = allToday; // fallback: используем что есть
    try{
      const r7 = await wbFetch(`https://statistics-api.wildberries.ru/api/v1/supplier/orders?dateFrom=${weekAgo}T00:00:00&flag=0`,{headers:h});
      orders7 = await r7.json();
    }catch(e){ /* используем fallback */ }
    cabData[n]={todayOrders,yesterdayOrders,stocks,adsData,orders7};
    renderCab(n);
  }catch(e){
    document.getElementById('v'+n).innerHTML=
      `<div class="status-bar"><div class="status-dot err"></div>Ошибка: ${e.message}. Проверьте API-ключ или попробуйте позже.</div>`;
  }
}

function fmtRub(v){return Math.round(v).toLocaleString('ru')+' ₽';}
function deltaHtml(pct){
  if(pct===null||pct===undefined)return '';
  return pct>=0
    ?`<span class="delta-up">▲ +${pct}% vs вчера</span>`
    :`<span class="delta-down">▼ ${pct}% vs вчера</span>`;
}


const stockSort = {1:null, 2:null};

function sortStocks(n, col){
  if(!stockSort[n]) stockSort[n]={col:'total',dir:-1};
  if(stockSort[n].col===col) stockSort[n].dir *= -1;
  else { stockSort[n].col=col; stockSort[n].dir=-1; }
  const el = document.getElementById('stocksTbl'+n);
  if(el) el.innerHTML = renderStocksTable(n);
}

function renderStocksTable(n){
  const {arts, whList} = cabData[n];
  if(!arts) return '<div class="empty">Нет данных</div>';
  const {col, dir} = stockSort[n]||{col:'total',dir:-1};

  const artList = Object.keys(arts).sort((a,b)=>{
    const va = col==='total' ? arts[a].total : (arts[a].wh[col]||0);
    const vb = col==='total' ? arts[b].total : (arts[b].wh[col]||0);
    return (va-vb)*dir;
  });

  const arrow = (c) => col===c ? (dir===-1?' ↓':' ↑') : ' ↕';
  const thStyle = (c) => col===c
    ? 'cursor:pointer;background:var(--ink);color:#FAF8F4;text-align:center;white-space:nowrap;user-select:none'
    : 'cursor:pointer;text-align:center;white-space:nowrap;user-select:none';

  const whHeaders = whList.map(w=>`<th class="wh-col" style="${thStyle(w)}" onclick="sortStocks(${n},'${w.replace(/'/g,"\\'")}')"><span style="font-size:9px">${w.slice(0,16)}</span>${arrow(w)}</th>`).join('');

  const rows = artList.map(art=>{
    const d=arts[art];
    const tc=d.total===0?'qty-out':d.total<10?'qty-low':'qty-ok';
    const cells=whList.map(wh=>{
      const q=d.wh[wh]||0;
      const c=q===0?'qty-out':q<10?'qty-low':'qty-ok';
      return `<td class="${c}" style="text-align:center">${q||'—'}</td>`;
    }).join('');
    return `<tr>
      <td><span class="art">${art}</span><div style="font-size:10px;color:var(--ink3);margin-top:2px">${d.name.slice(0,24)}</div></td>
      <td class="total-col ${tc}">${d.total}</td>${cells}
    </tr>`;
  }).join('');

  return `<table>
    <thead><tr>
      <th>Артикул</th>
      <th style="${thStyle('total')};background:var(--bg3);color:var(--ink2)" onclick="sortStocks(${n},'total')">Итого на стоке${arrow('total')}</th>
      ${whHeaders}
    </tr></thead>
    <tbody>${rows||'<tr><td class="empty" colspan="99">Нет данных</td></tr>'}</tbody>
  </table>`;
}


const defSort={1:{col:'days',dir:1},2:{col:'days',dir:1}};

function buildDeficitRows(n){
  const d=cabData[n];
  if(!d||!d.arts) return [];
  const {arts}=d;
  const orders7=d.orders7||d.todayOrders||[];
  const ord7map={};
  orders7.forEach(o=>{const a=o.supplierArticle||'—';ord7map[a]=(ord7map[a]||0)+(o.quantity||1);});
  return Object.keys(arts).map(art=>{
    const stock=arts[art].total;
    const name=arts[art].name||'';
    const ord7=ord7map[art]||0;
    const dailyRate=ord7/7;
    const monthNeed=Math.round(dailyRate*30);
    const daysLeft=dailyRate>0?Math.round(stock/dailyRate):null;
    let flagClass,flagText,barClass,barW,severity;
    if(daysLeft===null){flagClass='flag-empty';flagText='— нет продаж';barClass='bar-dead';barW=0;severity=9999;}
    else if(daysLeft<14){flagClass='flag-fire';flagText='🔥 '+daysLeft+' дн';barClass='bar-fire';barW=Math.min(100,daysLeft/14*100);severity=daysLeft;}
    else if(daysLeft<30){flagClass='flag-warn';flagText='⚠️ '+daysLeft+' дн';barClass='bar-warn';barW=Math.min(100,daysLeft/30*100);severity=daysLeft;}
    else if(daysLeft<=90){flagClass='flag-ok';flagText='✅ '+daysLeft+' дн';barClass='bar-ok';barW=Math.min(100,daysLeft/90*100);severity=daysLeft;}
    else{flagClass='flag-dead';flagText='💀 '+daysLeft+'д неликвид';barClass='bar-dead';barW=100;severity=daysLeft;}
    const deficit=monthNeed>stock?monthNeed-stock:0;
    const stockCls=stock===0?'qty-out':stock<10?'qty-low':'qty-ok';
    return {art,name,stock,ord7,monthNeed,daysLeft,deficit,flagClass,flagText,barClass,barW,stockCls,severity};
  });
}

function sortDeficit(n,col){
  const s=defSort[n];
  if(s.col===col) s.dir*=-1; else {s.col=col;s.dir=col==='days'?1:-1;}
  const el=document.getElementById('deficitTbl'+n);
  if(el) el.innerHTML=renderDeficit(n);
}

function renderDeficit(n){
  const d=cabData[n];
  if(!d||!d.arts) return '<div class="empty">Нет данных</div>';
  const rows=buildDeficitRows(n);
  const {col,dir}=defSort[n];

  rows.sort((a,b)=>{
    let va,vb;
    if(col==='art'){va=a.art;vb=b.art;return dir*(va<vb?-1:va>vb?1:0);}
    if(col==='stock'){va=a.stock;vb=b.stock;}
    else if(col==='ord7'){va=a.ord7;vb=b.ord7;}
    else if(col==='need'){va=a.monthNeed;vb=b.monthNeed;}
    else if(col==='deficit'){va=a.deficit;vb=b.deficit;}
    else{va=a.severity===9999?999999:a.severity;vb=b.severity===9999?999999:b.severity;}
    return dir*(va-vb);
  });

  const ar=c=>defSort[n].col===c?(defSort[n].dir===1?' ↑':' ↓'):' ↕';
  const th=(c,label,align='center')=>`<th onclick="sortDeficit(${n},'${c}')" style="text-align:${align};cursor:pointer;user-select:none;white-space:nowrap" class="${defSort[n].col===c?'sort-active':''}">${label}${ar(c)}</th>`;

  const trs=rows.map(r=>`<tr>
    <td><span class="art">${r.art}</span><div style="font-size:10px;color:var(--ink3);margin-top:2px">${r.name.slice(0,28)}</div></td>
    <td class="${r.stockCls}" style="text-align:center;font-size:16px;font-weight:700">${r.stock}</td>
    <td style="text-align:center">${r.ord7}</td>
    <td style="text-align:center;color:var(--ink2)">${r.monthNeed||'—'}</td>
    <td style="text-align:center;color:${r.deficit>0?'var(--red)':'var(--green)'};font-weight:${r.deficit>0?700:400}">${r.deficit>0?'-'+r.deficit:'✓'}</td>
    <td>
      <span class="flag ${r.flagClass}">${r.flagText}</span>
      ${r.daysLeft!==null?`<span class="days-bar-wrap"><span class="days-bar ${r.barClass}" style="width:${r.barW}%"></span></span>`:''}
    </td>
  </tr>`).join('');

  return `<table>
    <thead><tr>
      ${th('art','Артикул','left')}
      ${th('stock','Остаток')}
      ${th('ord7','Заказов 7дн')}
      ${th('need','Потребность 30дн')}
      ${th('deficit','Дефицит')}
      ${th('days','Статус запасов')}
    </tr></thead>
    <tbody>${trs||'<tr><td colspan="6" class="empty">Нет данных</td></tr>'}</tbody>
  </table>`;
}
function renderCab(n){
  const {todayOrders,yesterdayOrders,stocks,adsData}=cabData[n];

  // WB отдаёт поля:
  // totalPrice = исходная цена
  // discountPercent = скидка поставщика
  // finishedPrice = цена после скидки поставщика (то что нам нужно)
  // salePrice = цена клиента после СПП (если есть в ответе)
  const priceField=o=>o.finishedPrice||o.priceWithDisc||(o.totalPrice*(1-(o.discountPercent||0)/100))||o.totalPrice||0;
  const tCnt=todayOrders.length, yCnt=yesterdayOrders.length;
  const tRev=todayOrders.reduce((s,o)=>s+priceField(o),0);
  const yRev=yesterdayOrders.reduce((s,o)=>s+priceField(o),0);
  const outCnt=stocks.filter(s=>(s.quantity||0)===0).length;
  const lowCnt=stocks.filter(s=>(s.quantity||0)>0&&(s.quantity||0)<10).length;
  const dOrd=yCnt>0?Math.round((tCnt-yCnt)/yCnt*100):null;
  const dRev=yRev>0?Math.round((tRev-yRev)/yRev*100):null;

  let html='';

  // МЕТРИКИ
  html+=`<div class="metrics-row">
    <div class="metric-card"><div class="metric-label">Заказы сегодня</div><div class="metric-val">${tCnt}</div><div class="metric-delta">${deltaHtml(dOrd)}</div></div>
    <div class="metric-card"><div class="metric-label">Вчера заказов</div><div class="metric-val">${yCnt}</div></div>
    <div class="metric-card"><div class="metric-label">Сумма сегодня</div><div class="metric-val sm green">${fmtRub(tRev)}</div><div class="metric-delta">${deltaHtml(dRev)}</div></div>
    <div class="metric-card"><div class="metric-label">Сумма вчера</div><div class="metric-val sm">${fmtRub(yRev)}</div></div>
    <div class="metric-card"><div class="metric-label">Нет на складе</div><div class="metric-val amber">${outCnt}</div><div class="metric-delta delta-same">${lowCnt} позиций мало</div></div>
  </div>`;

  // БЛОК РЕКЛАМЫ
  if(adsData&&adsData.length){
    let adSpend=0,adViews=0,adClicks=0,adOrders=0,adRev=0;
    adsData.forEach(camp=>{
      (camp.intervals||[]).forEach(iv=>{
        adSpend+=(iv.sum||0);
        adViews+=(iv.views||0);
        adClicks+=(iv.clicks||0);
        adOrders+=(iv.orders||0);
        adRev+=(iv.sum_price||0);
      });
    });
    const ctr=adViews>0?(adClicks/adViews*100).toFixed(1):0;
    const costShare=adRev>0?(adSpend/adRev*100).toFixed(1):0;
    const cpo=adOrders>0?Math.round(adSpend/adOrders):0;
    html+=`<div class="ads-row">
      <div class="ads-card"><div class="ads-label">💰 Затраты на рекламу</div><div class="ads-val">${fmtRub(adSpend)}</div><div class="ads-sub">${adOrders} заказов с рекламы</div></div>
      <div class="ads-card"><div class="ads-label">📊 Доля затрат</div><div class="ads-val">${costShare}%</div><div class="ads-sub">от суммы заказов</div></div>
      <div class="ads-card"><div class="ads-label">🎯 CTR</div><div class="ads-val">${ctr}%</div><div class="ads-sub">${adViews.toLocaleString('ru')} показов</div></div>
      <div class="ads-card"><div class="ads-label">💸 CPO</div><div class="ads-val">${fmtRub(cpo)}</div><div class="ads-sub">цена 1 заказа</div></div>
    </div>`;
  } else {
    html+=`<div class="status-bar" style="margin-bottom:20px"><div class="status-dot" style="background:var(--amber)"></div>Блок рекламы: ключ должен иметь доступ к разделу «Продвижение» в настройках API WB</div>`;
  }

  // ЗАКАЗЫ
  const sorted=[...todayOrders].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const show=expanded[n]?sorted:sorted.slice(0,PREVIEW);
  const rows=show.map((o,i)=>{
    const t=o.date?new Date(o.date).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'}):'—';
    const pSupplier=priceField(o);
    // salePrice — реальная цена клиента из WB если есть, иначе считаем
    const pClient=o.salePrice||(pSupplier>0?Math.round(pSupplier*0.7):null);
    const nb=i<3&&!expanded[n]?'<span class="new-badge">NEW</span>':'';
    return `<tr>
      <td><span class="time-pill">${t}</span></td>
      <td><span class="art">${(o.supplierArticle||'—').slice(0,18)}</span></td>
      <td>${nb}${(o.subject||o.category||'—').slice(0,28)}</td>
      <td>${o.quantity||1}</td>
      <td><span class="price">${pSupplier>0?fmtRub(pSupplier):'—'}</span></td>
      <td><span class="price-client">${pClient?fmtRub(pClient):'—'}</span></td>
      <td style="font-size:11px;color:var(--ink3)">${(o.warehouseName||'—').slice(0,22)}</td>
    </tr>`;
  }).join('');

  const expandRow=!expanded[n]&&sorted.length>PREVIEW
    ?`<tr class="expand-row"><td colspan="7"><button class="expand-btn" onclick="toggleExpand(${n})">▼ Показать все ${sorted.length} заказов</button></td></tr>`
    :sorted.length>PREVIEW&&expanded[n]
    ?`<tr class="expand-row"><td colspan="7"><button class="expand-btn" onclick="toggleExpand(${n})">▲ Свернуть до ${PREVIEW}</button></td></tr>`:'';

  html+=`<div class="section">
    <div class="section-hdr"><span class="section-title">Заказы сегодня</span><span class="section-meta">${tCnt} заказов</span></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Время</th><th>Артикул</th><th>Товар</th><th>Кол-во</th><th>Цена (скидка пост.)</th><th>Цена клиента (СПП ~30%)</th><th>Склад</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="7" class="empty">Заказов сегодня нет</td></tr>'}${expandRow}</tbody>
    </table></div>
  </div>`;

  // ОСТАТКИ — сводная таблица
  const arts={};
  const whs=new Set();
  stocks.forEach(s=>{
    const art=s.supplierArticle||'—';
    const wh=s.warehouseName||'Прочие';
    const subj=s.subject||s.category||'';
    whs.add(wh);
    if(!arts[art])arts[art]={name:subj,total:0,wh:{}};
    arts[art].wh[wh]=(arts[art].wh[wh]||0)+(s.quantity||0);
    arts[art].total+=(s.quantity||0);
  });
  // Склады — по суммарному объёму (самые заполненные слева)
  const whTotals={};
  whs.forEach(wh=>{
    whTotals[wh]=Object.values(arts).reduce((s,d)=>s+(d.wh[wh]||0),0);
  });
  const whList=[...whs].sort((a,b)=>whTotals[b]-whTotals[a]);

  // Артикулы — по итого на стоке от меньшего к большему (критичные сначала)
  const artList=Object.keys(arts).sort((a,b)=>arts[a].total-arts[b].total);

  // stRows теперь в renderStocksTable

  // Сохраняем данные для сортировки
  cabData[n].arts = arts;
  cabData[n].whList = whList;
  cabData[n].artList = artList;
  if(!stockSort[n]) stockSort[n]={col:'total',dir:-1};

  html+=`<div class="section">
    <div class="section-hdr"><span class="section-title">Остатки по складам</span><span class="section-meta">${artList.length} артикулов · ${whList.length} складов</span></div>
    <div class="stocks-tbl-wrap" id="stocksTbl${n}">` + renderStocksTable(n) + `</div>
  </div>`;

  // ДЕФИЦИТ
  html+=`<div class="section">
    <div class="section-hdr">
      <span class="section-title">📦 Анализ дефицита и неликвида</span>
      <span class="section-meta">
        <span class="flag flag-fire" style="margin-right:4px">🔥 &lt;14дн — срочно</span>
        <span class="flag flag-warn" style="margin-right:4px">⚠️ 14-30дн — внимание</span>
        <span class="flag flag-ok" style="margin-right:4px">✅ 30-90дн — норм</span>
        <span class="flag flag-dead">💀 &gt;90дн — неликвид</span>
      </span>
    </div>
    <div class="deficit-wrap" id="deficitTbl${n}"></div>
  </div>`;

  document.getElementById('v'+n).innerHTML=html;
  // Рендерим дефицит после вставки HTML (нужен DOM)
  setTimeout(()=>{
    const el=document.getElementById('deficitTbl'+n);
    if(el) el.innerHTML=renderDeficit(n);
  },50);
}

function toggleExpand(n){
  expanded[n]=!expanded[n];
  if(cabData[n])renderCab(n);
}
