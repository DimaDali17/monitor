<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>EasyForm Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F0EBE1;--bg2:#E8E1D4;--bg3:#FAF8F4;--card:#FFF;--border:rgba(160,148,128,.25);--border2:rgba(160,148,128,.45);--ink:#1A1610;--ink2:#6B6357;--ink3:#A09688;--green:#2D7A4F;--red:#B84040;--amber:#A06820;--blue:#005BFF;--sgp:#5B3FA0;--raw:#8B4513;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Comfortaa',sans-serif;background:var(--bg);color:var(--ink);font-size:13px}

.header{background:var(--bg2);border-bottom:1px solid var(--border2);padding:0 20px;height:60px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.logo{width:38px;height:38px;border-radius:10px;object-fit:cover}
.bname{font-size:16px;font-weight:700}.bsub{font-size:9px;color:var(--ink3);letter-spacing:.12em;text-transform:uppercase}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px}
.clock{font-size:12px;color:var(--ink2);white-space:nowrap}
.tabs{display:flex;gap:2px;background:var(--bg);border-radius:8px;padding:3px}
.tab{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;border:none;background:0;color:var(--ink3);font-family:inherit;white-space:nowrap}
.tab.on{background:var(--ink);color:var(--bg3)}
.tab.ozon.on{background:var(--blue);color:#fff}
.b{padding:5px 10px;background:0;border:1px solid var(--border2);border-radius:7px;font-size:11px;font-weight:600;color:var(--ink2);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:4px;white-space:nowrap}
.b:hover{background:var(--ink);color:var(--bg3);border-color:var(--ink)}
.b:disabled{opacity:.4;cursor:default}
.upd{font-size:10px;color:var(--ink3)}

.sov{display:none;position:fixed;inset:0;background:rgba(240,235,225,.95);backdrop-filter:blur(6px);z-index:200;align-items:center;justify-content:center}
.sov.show{display:flex}
.sc{background:var(--card);border:1px solid var(--border2);border-radius:16px;padding:28px;width:480px;box-shadow:0 8px 40px rgba(0,0,0,.1);max-height:90vh;overflow-y:auto}
.slogo{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.stitle{font-size:20px;font-weight:700}.ssub{font-size:10px;color:var(--ink3);letter-spacing:.1em;text-transform:uppercase}
.ssec{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.1em;margin:16px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.fg{margin-bottom:10px}
.fl{font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px;font-weight:700}
.fi{width:100%;padding:8px 12px;font-size:12px;background:var(--bg3);border:1px solid var(--border2);border-radius:7px;color:var(--ink);font-family:inherit;outline:0}
.fi:focus{border-color:var(--ink)}
.sbtn{width:100%;padding:12px;background:var(--ink);color:var(--bg3);border:0;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:8px}
.smsg{font-size:12px;margin-top:8px;text-align:center}
.smsg.err{color:var(--red)}

.main{padding:20px;max-width:1600px;margin:0 auto}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.mc{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:14px 16px}
.ml{font-size:9px;color:var(--ink3);text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-bottom:7px}
.mv{font-size:24px;font-weight:700;line-height:1}.mv.g{color:var(--green)}.mv.a{color:var(--amber)}.mv.sm{font-size:18px}.mv.oz{color:var(--blue)}
.md{font-size:11px;margin-top:4px}
.du{color:var(--green)}.dd{color:var(--red)}.ds{color:var(--ink3)}

.sec{margin-bottom:20px}
.sh{display:flex;align-items:center;justify-content:space-between;padding-bottom:7px;margin-bottom:10px;border-bottom:1px solid var(--border2);flex-wrap:wrap;gap:6px}
.st{font-size:10px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.12em}
.sm2{font-size:11px;color:var(--ink3)}
.flt{padding:5px 10px;font-size:11px;background:var(--bg3);border:1px solid var(--border2);border-radius:7px;color:var(--ink);font-family:inherit;outline:0;width:170px}
.flt:focus{border-color:var(--ink)}

.tw{background:var(--card);border:1px solid var(--border);border-radius:11px;overflow:hidden}
.sw{background:var(--card);border:1px solid var(--border);border-radius:11px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;padding:7px 10px;font-size:9px;font-weight:700;color:var(--ink3);background:var(--bg3);text-transform:uppercase;letter-spacing:.1em;border-bottom:1px solid var(--border);font-family:inherit;white-space:nowrap;cursor:default}
thead th.sa{background:var(--ink)!important;color:var(--bg3)!important}
thead th.wh{background:var(--bg2)!important;color:var(--ink2)!important}
thead th[onclick]{cursor:pointer;user-select:none}
thead th.th-wb{background:#FFF3E0!important;color:#A06820!important;border-bottom:2px solid #A06820}
thead th.th-sgp{background:#EDE7F6!important;color:#5B3FA0!important;border-bottom:2px solid #5B3FA0}
thead th.th-raw{background:#FBE9E7!important;color:#8B4513!important;border-bottom:2px solid #8B4513}
thead th.th-transit{background:#E3F2FD!important;color:#0D47A1!important;border-bottom:2px dashed #90CAF9}
thead th.th-msk{background:#F3E5F5!important;color:#6A1B9A!important;border-bottom:2px dashed #CE93D8}
thead th.th-total{background:#E8F5E9!important;color:#1B5E20!important;border-bottom:2px solid #4CAF50}
thead th.th-need{background:#FFF8E1!important;color:#F57F17!important}
thead th.th-days{background:#E0F2F1!important;color:#004D40!important}
/* Группировки заголовков */
.th-group{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;text-align:center;padding:3px 6px;border-bottom:1px solid var(--border)}
.thg-wb{background:#FFF3E0;color:#A06820}
.thg-sgp{background:#EDE7F6;color:#5B3FA0}
.thg-raw{background:#FBE9E7;color:#8B4513}
.thg-need{background:#FFF8E1;color:#F57F17}
.thg-days{background:#E0F2F1;color:#004D40}
.thg-ref{background:#F3F3F3;color:#888;font-style:italic}

tbody td{padding:6px 10px;color:var(--ink);border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--bg3)}
.tp{font-size:11px;font-weight:700;color:var(--ink2);background:var(--bg2);padding:2px 8px;border-radius:20px}
.art{font-family:monospace;font-size:11px;color:var(--ink2)}
.nb{font-size:9px;background:#E4F0EB;color:var(--green);padding:2px 6px;border-radius:10px;font-weight:700;margin-right:4px}
.pr{font-weight:700}.pc{font-size:11px;color:var(--blue);font-weight:600}
.qo{color:var(--green);font-weight:700}.ql{color:var(--amber);font-weight:700}.qx{color:var(--red);font-weight:700}
.tc{font-weight:700;background:var(--bg3)!important;text-align:center;font-size:15px}
.er td{text-align:center;padding:10px}
.eb{background:0;border:1px solid var(--border2);border-radius:7px;padding:5px 16px;font-size:11px;font-weight:600;color:var(--ink2);cursor:pointer;font-family:inherit}
.eb:hover{background:var(--ink);color:var(--bg3);border-color:var(--ink)}
.fl2{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.ff{background:#FEE8E8;color:#B84040}.fw{background:#FEF3E2;color:#A06820}
.fk{background:#E8F4EE;color:#2D7A4F}.fd{background:#EDEDF0;color:#6B6B80}.fe{background:#F5F5F5;color:#A09688}
.dbw{background:var(--bg2);border-radius:4px;height:5px;width:70px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:5px}
.db{height:100%;border-radius:4px}
.bf{background:#B84040}.bw{background:#A06820}.bk{background:#2D7A4F}.bd{background:#A09688}
.em{padding:28px;text-align:center;color:var(--ink3)}
.ar-row{cursor:pointer;background:var(--bg3)}.ar-row:hover{background:var(--bg2)}
.ar-row td{font-weight:700;border-bottom:1px solid var(--border2)}
.sz-row td{font-size:12px;color:var(--ink2);border-bottom:1px solid var(--border)}
.sz-row td:first-child{padding-left:28px}
.tog{display:inline-block;width:16px;text-align:center;font-size:10px;color:var(--ink3);margin-right:4px}
.fb{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px;position:relative}
.fb input{flex:1;min-width:160px;padding:7px 10px;font-size:12px;background:var(--bg3);border:1px solid var(--border2);border-radius:7px;color:var(--ink);font-family:inherit;outline:0}
.fb input:focus{border-color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;background:var(--ink);color:var(--bg3);border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap}
.chip .cx{cursor:pointer;opacity:.7;font-size:13px;line-height:1}.chip .cx:hover{opacity:1}
.ddrop{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--border2);border-radius:8px;max-height:200px;overflow-y:auto;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.1);display:none}
.ddrop.show{display:block}
.ddrop div{padding:6px 12px;font-size:12px;cursor:pointer}.ddrop div:hover{background:var(--bg3)}
.ctog{display:inline-flex;background:var(--bg);border-radius:6px;padding:2px;gap:1px}
.ctog button{padding:3px 10px;border:0;border-radius:5px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;background:0;color:var(--ink3)}
.ctog button.on{background:var(--ink);color:var(--bg3)}
.lm{padding:50px;text-align:center;color:var(--ink3)}
.sb{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--ink2);display:flex;gap:10px;align-items:flex-start;word-break:break-all}
.sde{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px;background:var(--red)}
.sp{display:inline-block;animation:spin .8s linear infinite}
.loadbtn{margin-top:14px;padding:9px 22px;background:var(--ink);color:var(--bg3);border:0;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
/* Значки выкупаемости */
.buyrate{font-size:10px;padding:1px 6px;border-radius:10px;font-weight:700;margin-left:6px;vertical-align:middle}
.buyrate-ok{background:#E8F4EE;color:#2D7A4F}
.buyrate-est{background:#FEF3E2;color:#A06820}
/* Числа дней — цветовое кодирование */
.days-crit{color:#B84040;font-weight:700}
.days-warn{color:#A06820;font-weight:700}
.days-ok{color:#2D7A4F;font-weight:700}
.days-great{color:#A09688}
/* Справочные колонки — чуть серее */
.td-ref{color:var(--ink3)!important;font-style:italic}
/* Легенда */
.legend-bar{display:flex;gap:12px;flex-wrap:wrap;font-size:10px;color:var(--ink3);margin-top:6px}
.legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px;vertical-align:middle}
/* Tooltip */
[data-tip]{position:relative;cursor:help}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:rgba(26,22,16,.9);color:#fff;font-size:10px;font-weight:400;padding:5px 8px;border-radius:6px;white-space:nowrap;z-index:999;pointer-events:none;font-family:'Comfortaa',sans-serif;max-width:260px;white-space:normal;text-align:center;line-height:1.4}
[data-tip]:hover::before{content:'';position:absolute;bottom:calc(100% + 1px);left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:rgba(26,22,16,.9)}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="sov show" id="setup">
<div class="sc">
  <div class="slogo">
    <img id="slogoimg" class="logo" alt="">
    <div><div class="stitle">EasyForm</div><div class="ssub">WB + Ozon Dashboard</div></div>
  </div>
  <div class="ssec">Wildberries</div>
  <div class="fg"><div class="fl">API-ключ Easyform</div><input class="fi" type="password" id="sk1" placeholder="eyJ..."></div>
  <div class="fg"><div class="fl">API-ключ EZFR</div><input class="fi" type="password" id="sk2" placeholder="eyJ..."></div>
  <div class="ssec">Ozon</div>
  <div class="fg"><div class="fl">Client-ID</div><input class="fi" id="soid" placeholder="123456"></div>
  <div class="fg"><div class="fl">API-ключ</div><input class="fi" type="password" id="sokey" placeholder="xxx-xxx-xxx"></div>
  <div class="ssec">Прокси</div>
  <div class="fg"><div class="fl">Прокси 1 — для EF + Ozon</div><input class="fi" id="sprx" value="https://wb-proxy.ooo6311ooo.workers.dev"></div>
  <div class="fg"><div class="fl">Прокси 2 — для EZFR</div><input class="fi" id="sprx2" placeholder="https://wb-proxy-2.xxx.workers.dev"></div>
  <button class="sbtn" onclick="doSave()">Сохранить и загрузить EF</button>
  <div class="smsg" id="smsg"></div>
</div></div>

<div class="header">
  <img id="hlogo" class="logo" alt="">
  <div><div class="bname" id="hname">EasyForm</div><div class="bsub">Dashboard</div></div>
  <div class="hright">
    <div class="clock" id="clk"></div>
    <div class="tabs">
      <button class="tab on" onclick="go(1)">Easyform</button>
      <button class="tab" onclick="go(2)">EZFR</button>
      <button class="tab ozon" onclick="go(3)">Ozon</button>
    </div>
    <button class="b" id="rb1" onclick="reload(1)"><span id="ri1">↻</span> EF</button>
    <button class="b" id="rb2" onclick="reload(2)"><span id="ri2">↻</span> EZFR</button>
    <button class="b" id="rb3" onclick="reload(3)"><span id="ri3">↻</span> Ozon</button>
    <span class="upd" id="upd"></span>
    <button class="b" onclick="openSetup()">⚙</button>
  </div>
</div>

<div class="main">
  <div id="v1"><div class="lm">⚙ Введите API-ключи</div></div>
  <div id="v2" style="display:none"><div class="lm">⚙ Введите API-ключи</div></div>
  <div id="v3" style="display:none"><div class="lm">⚙ Введите API-ключи</div></div>
</div>

/* Кэш внешних данных */
let gBuyrate={};   // supplierArticle → число 0..1
let gSgp={};       // "арт; размер" → qty
let gRaw={};       // "арт; размер" → qty
let gExtLoaded=false;

/* Парсер CSV */
function parseCSV(text){
  const lines=text.trim().split('\n').map(l=>l.split(',').map(c=>c.trim().replace(/^"|"$/g,'')));
  if(!lines.length)return[];
  const hdr=lines[0];
  return lines.slice(1).map(row=>{const o={};hdr.forEach((h,i)=>o[h]=row[i]||'');return o;});
}

async function loadExternal(){
  if(gExtLoaded)return;
  try{
    const [rB,rS,rR]=await Promise.all([
      fetch(CSV_BUYRATE).then(r=>r.text()),
      fetch(CSV_SGP).then(r=>r.text()),
      fetch(CSV_RAW).then(r=>r.text())
    ]);
    /* Выкупаемость */
    parseCSV(rB).forEach(row=>{
      const art=(row['supplierArticle']||'').trim();
      const pct=(row['Выкупаемость']||'').replace('%','').trim();
      if(art&&pct){gBuyrate[art.toLowerCase()]=parseFloat(pct)/100;}
    });
    /* СГП: колонки Предмет, Арт производ, Размер, SUM из Штук */
    parseCSV(rS).forEach(row=>{
      const art=(row['Арт производ']||row['Арт Производ']||row['арт производ']||'').trim();
      const sz=(row['Размер']||'').trim();
      const qty=parseInt(row['SUM из Штук']||row['Штук']||0,10)||0;
      if(art){const k=(art+';'+sz).toLowerCase();gSgp[k]=(gSgp[k]||0)+qty;}
    });
    /* Сырьё */
    parseCSV(rR).forEach(row=>{
      const art=(row['Арт производ']||row['Арт Производ']||row['арт производ']||'').trim();
      const sz=(row['Размер']||'').trim();
      const qty=parseInt(row['SUM из Штук']||row['Штук']||0,10)||0;
      if(art){const k=(art+';'+sz).toLowerCase();gRaw[k]=(gRaw[k]||0)+qty;}
    });
    gExtLoaded=true;
    console.log('External data loaded. Buyrate entries:',Object.keys(gBuyrate).length,'SGP:',Object.keys(gSgp).length,'Raw:',Object.keys(gRaw).length);
  }catch(e){console.warn('Ошибка загрузки внешних данных:',e);}
}

/* Получить выкупаемость по артикулу WB */
function getBuyrate(art){
  if(!art)return null;
  const k=art.toLowerCase();
  if(gBuyrate[k]!=null)return{val:gBuyrate[k],est:false};
  /* Частичное совпадение: ищем ключ который содержится в артикуле или наоборот */
  for(const [ka,v] of Object.entries(gBuyrate)){
    if(k.includes(ka)||ka.includes(k))return{val:v,est:false};
  }
  return{val:0.7,est:true};
}

/* Получить СГП/Сырьё по артикулу производителя и размеру */
function getSgp(artPr,sz){
  if(!artPr)return 0;
  const k=(artPr+';'+sz).toLowerCase();
  return gSgp[k]||0;
}
function getRaw(artPr,sz){
  if(!artPr)return 0;
  const k=(artPr+';'+sz).toLowerCase();
  return gRaw[k]||0;
}
/* Получить суммарный СГП/Сырьё по WB-артикулу (для строки артикула без разбивки по размерам) */
function getSgpByWBArt(wbArt){
  let s=0;
  const ka=wbArt.toLowerCase();
  for(const [k,v] of Object.entries(gSgp)){const p=k.split(';')[0];if(p===ka||p.includes(ka)||ka.includes(p))s+=v;}
  return s;
}
function getRawByWBArt(wbArt){
  let s=0;
  const ka=wbArt.toLowerCase();
  for(const [k,v] of Object.entries(gRaw)){const p=k.split(';')[0];if(p===ka||p.includes(ka)||ka.includes(p))s+=v;}
  return s;
}

function pxFor(cab){return (cab===2&&PX2)?PX2:PX;}
let _wbBusy=Promise.resolve();
let _wbLast=0;
const WB_GAP=1200;
function wbQueue(fn){
  const run=_wbBusy.then(async()=>{
    const g=Math.max(0,_wbLast+WB_GAP-Date.now());
    if(g>0)await new Promise(r=>setTimeout(r,g));
    try{return await fn();}finally{_wbLast=Date.now();}
  });
  _wbBusy=run.catch(()=>{});
  return run;
}
async function wbGet(url,token,cab){
  const purl=pxFor(cab)+'?url='+encodeURIComponent(url);
  const waits=[3000,7000,15000];
  let lastInfo='';
  return wbQueue(async()=>{
    for(let i=0;i<=waits.length;i++){
      let r,txt='';
      try{r=await fetch(purl,{headers:{'X-WB-Token':token}});txt=await r.text();}catch(netErr){lastInfo='сеть/прокси: '+netErr;r=null;}
      const retriable=!r||r.status===429||r.status>=500||!txt||!txt.trim();
      if(retriable){
        if(r)lastInfo=r.status===429?'429 (лимит)':r.status>=500?'WB '+r.status:(!txt||!txt.trim())?'пустой ответ':'WB '+r.status;
        if(i===waits.length)throw new Error('WB: не удалось получить данные после '+(waits.length+1)+' попыток ('+lastInfo+'). Подождите 1–2 мин и нажмите ↻.');
        const ra=r?parseInt(r.headers.get('retry-after')||'0',10):0;
        const wait=ra>0?ra*1000:waits[i];
        const ic=document.getElementById('ri'+cab);if(ic)ic.innerHTML='<span class="sp">↻</span>';
        await new Promise(x=>setTimeout(x,wait));
        continue;
      }
      if(!r.ok)throw new Error('WB '+r.status+': '+txt.slice(0,200));
      try{return JSON.parse(txt);}catch(e){throw new Error('WB: некорректный JSON — '+txt.slice(0,160));}
    }
  });
}

async function ozPost(url,body){
  const g=Math.max(0,_ozT+1200-Date.now());if(g>0)await new Promise(r=>setTimeout(r,g));_ozT=Date.now();
  const purl=PX+'?url='+encodeURIComponent(url);
  let r=await fetch(purl,{method:'POST',headers:{'X-Ozon-Client-Id':K.oid,'X-Ozon-Api-Key':K.okey,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.status===429){await new Promise(x=>setTimeout(x,8000));_ozT=Date.now();r=await fetch(purl,{method:'POST',headers:{'X-Ozon-Client-Id':K.oid,'X-Ozon-Api-Key':K.okey,'Content-Type':'application/json'},body:JSON.stringify(body)});}

async function safeJson(r,label){

async function loadWB(n){
  const key=K[n],t=td(),y=yd(),w=wd();
  const ordFrom=new Date(Date.now()-14*864e5).toISOString().slice(0,10)+'T00:00:00Z';
  const stkFrom=new Date().getFullYear()+'-01-01T00:00:00Z';
  const BASE='https://statistics-api.wildberries.ru/api/v1/supplier';
  const allOrdersR=await wbGet(BASE+'/orders?dateFrom='+ordFrom+'&flag=0',key,n);
  const stocksR  =await wbGet(BASE+'/stocks?dateFrom='+stkFrom+'&flag=0',key,n);
  const allOrders=Array.isArray(allOrdersR)?allOrdersR:[];
  const stocks=Array.isArray(stocksR)?stocksR:[];
  const orders7=allOrders.filter(o=>(o.date||'')>=w);
  const todayO=allOrders.filter(o=>(o.date||'').startsWith(t));

  D[n]={todayO,yestO,stocks,orders7,allOrders};

async function loadOZ(){
  const t=td(),y=yd(),w=wd();
  const w2=new Date(Date.now()-14*864e5).toISOString().slice(0,10);
  const OZ='https://api-seller.ozon.ru';
  let postings=[],offset=0;
  for(let p=0;p<10;p++){
    const body={dir:'DESC',filter:{since:w2+'T00:00:00.000Z',to:t+'T23:59:59.999Z'},limit:1000,offset};
    const r=await ozPost(OZ+'/v2/posting/fbo/list',body);
    const d=await safeJson(r,'Ozon orders');
    const arr=Array.isArray(d.result)?d.result:(d.result&&d.result.postings)||[];
    postings=postings.concat(arr);
    if(arr.length<1000)break;
    offset+=1000;
  }
  const dayOf=o=>(o.created_at||o.in_process_at||'').slice(0,10);
  const todayO=postings.filter(o=>dayOf(o)===t);
  const yestO =postings.filter(o=>dayOf(o)===y);
  const orders7=postings.filter(o=>dayOf(o)>=w);
  let stocksRaw=[],soff=0;
  for(let p=0;p<6;p++){
    const rS=await ozPost(OZ+'/v2/analytics/stock_on_warehouses',{warehouse_type:'FBO',limit:500,offset:soff});
    const d=await safeJson(rS,'Ozon stocks');
    const rows=(d.result&&d.result.rows)||[];
    stocksRaw=stocksRaw.concat(rows);
    if(rows.length<500)break;
    soff+=500;
  }
  D[3]={todayO,yestO,stocks:stocksRaw,orders7,allOrders:postings,isOz:true};
  renderOZ();
}

/* ── helpers ── */
const fmt=v=>Math.round(v).toLocaleString('ru')+' ₽';
function dlt(pct){
  const h=new Date().getHours();
  return pct==null?'':pct>=0
    ?'<span class="du">▲ +'+pct+'% vs вчера к '+h+':00</span>'
    :'<span class="dd">▼ '+pct+'% vs вчера к '+h+':00</span>';
}
function wbPrice(o){return o.finishedPrice||o.priceWithDisc||(o.totalPrice*(1-(o.discountPercent||0)/100))||o.totalPrice||0;}
function wbQty(s){return s.quantity||0;}
const ozRev=o=>(o.products||[]).reduce((s,p)=>s+parseFloat(p.price||p.offer_price||0)*(p.quantity||1),0);

function sizeOrd(sz){
  const m={'XXS':101,'XS':102,'S':103,'M':104,'L':105,'XL':106,'XXL':107,'2XL':107,'XXXL':108,'3XL':108,'4XL':109,'5XL':110,'6XL':111,'7XL':112,'8XL':113};
  const u=(sz||'').toUpperCase().trim();
  if(m[u])return m[u];
  const n=parseFloat(u);if(!isNaN(n))return n;
  return 150;
}
function szCmp(a,b){return sizeOrd(a)-sizeOrd(b);}

function yestToHour(orders,type){
  const nowH=new Date().getHours(),nowM=new Date().getMinutes();
  return orders.filter(o=>{
    const dt=type==='oz'?(o.in_process_at||o.created_at):o.date;
    if(!dt)return false;
    const d=new Date(dt);
    return d.getHours()<nowH||(d.getHours()===nowH&&d.getMinutes()<=nowM);
  });
}

/* Цвет для "дней запаса" */
function daysClass(d){

function setChartMode(n,mode){CM[n]=mode;reRender(n);}

function dltW(pct){return pct==null?'':pct>=0?'<span class="du">▲ +'+pct+'% vs пр. неделю</span>':'<span class="dd">▼ '+pct+'% vs пр. неделю</span>';}
function weekData(d,type){

  const twC=tw.length,pwC=pw.length,twR=tw.reduce((s,o)=>s+pFn(o),0),pwR=pw.reduce((s,o)=>s+pFn(o),0);
  return{twC,pwC,twR,pwR,dO:pwC>0?Math.round((twC-pwC)/pwC*100):null,dR:pwR>0?Math.round((twR-pwR)/pwR*100):null};

function chartHTML(n,type){
  const d=D[n];if(!d)return'';
  const mode=CM[n]||'day',vmode=CV[n]||'ord',isRev=vmode==='rev';
  const nowH=new Date().getHours();
  const getD=o=>{const dt=type==='wb'?o.date:(o.in_process_at||o.created_at);return dt?dt.slice(0,10):''};
  const getH=o=>{const dt=type==='wb'?o.date:(o.in_process_at||o.created_at);return dt?new Date(dt).getHours():0;};
  const pFn=type==='wb'?wbPrice:ozRev;
  const t=td(),y=yd(),w=wd(),w2=new Date(Date.now()-14*864e5).toISOString().slice(0,10);
  let labels=[],todayV=[],yestV=[];
  if(mode==='day'){
    const tH=Array(24).fill(0),yH=Array(24).fill(0);
    (d.todayO||[]).forEach(o=>{const h=getH(o);tH[h]+=isRev?pFn(o):1;});
    (d.yestO||[]).forEach(o=>{const h=getH(o);yH[h]+=isRev?pFn(o):1;});
    for(let i=0;i<24;i++){labels.push(i%3===0?(i+':00'):'');todayV.push(tH[i]);yestV.push(yH[i]);}
  }else{
    const days=[];for(let i=6;i>=0;i--)days.push(new Date(Date.now()-i*864e5).toISOString().slice(0,10));
    const prevDays=[];for(let i=7;i>=1;i--)prevDays.push(new Date(Date.now()-i*864e5).toISOString().slice(0,10));
    const all=d.allOrders||[],cnt={},cntP={};
    all.forEach(o=>{const dd=getD(o);const v=isRev?pFn(o):1;if(dd>=w)cnt[dd]=(cnt[dd]||0)+v;else if(dd>=w2)cntP[dd]=(cntP[dd]||0)+v;});
    for(let i=0;i<7;i++){
      const day=days[i],prev=prevDays[i];
      labels.push(new Date(day+'T12:00:00').toLocaleDateString('ru',{day:'numeric',month:'short'}).replace('.',''));
      todayV.push(cnt[day]||0);yestV.push(cntP[prev]||0);
    }
  }
  const N=labels.length,maxO=Math.max(...todayV,...yestV,1);
  const W=700,H=160,L=40,R=12,T=14,B=22,cW=W-L-R,cH=H-T-B,gW=cW/N,bW=Math.floor(gW*0.35),gap=Math.max(1,Math.floor(gW*0.04));
  const fmtV=v=>isRev?(v>=1000?Math.round(v/1000)+'к':Math.round(v)):v;
  let bars='';
  for(let i=0;i<N;i++){
    const gx=L+i*gW,yv=yestV[i],yBH=maxO>0?(yv/maxO)*cH:0,yx=gx+gap,yy=T+cH-yBH;
    bars+=`<rect x="${yx}" y="${yy}" width="${bW}" height="${yBH}" rx="2" fill="#D5D0C8" opacity=".55"/>`;
    if(yv>0)bars+=`<text x="${yx+bW/2}" y="${yy-3}" text-anchor="middle" font-size="7" fill="var(--ink3)">${fmtV(yv)}</text>`;
    const tv=todayV[i],tBH=maxO>0?(tv/maxO)*cH:0;
    let fill=mode==='day'&&i>nowH?'#E8E4DC':tv>yv?'var(--green)':tv<yv?'var(--red)':'var(--ink3)';
    const tx=gx+gap+bW+gap,ty=T+cH-tBH;
    bars+=`<rect x="${tx}" y="${ty}" width="${bW}" height="${tBH}" rx="2" fill="${fill}" opacity=".9"/>`;
    if(tv>0&&!(mode==='day'&&i>nowH))bars+=`<text x="${tx+bW/2}" y="${ty-3}" text-anchor="middle" font-size="7" fill="var(--ink)" font-weight="600">${fmtV(tv)}</text>`;
  }
  let xLab='';const step=mode==='day'?3:1;
  for(let i=0;i<N;i+=step){if(!labels[i])continue;xLab+=`<text x="${L+i*gW+gW/2}" y="${H-4}" text-anchor="middle" font-size="${mode==='day'?8:9}" fill="var(--ink3)">${labels[i]}</text>`;}
  const ySteps=[0,Math.round(maxO/2),maxO];let yLab='';
  for(const v of ySteps){const yy=T+cH-(v/maxO)*cH;yLab+=`<text x="${L-4}" y="${yy+3}" text-anchor="end" font-size="7" fill="var(--ink3)">${fmtV(v)}</text>`;yLab+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--border)" stroke-width="0.5"/>`;}
  const onD=mode==='day'?'on':'',onW=mode==='week'?'on':'',onO=vmode==='ord'?'on':'',onR=vmode==='rev'?'on':'';
  const compLabel=mode==='day'?'вчера':'пр. неделя';
  return `<div class="sec" style="margin-bottom:14px"><div class="sh"><span class="st">${isRev?'Выручка':'Заказы'} · ${mode==='day'?'день':'неделя'}</span>
    <span style="display:flex;align-items:center;gap:8px">
      <span class="sm2" style="display:flex;gap:6px"><span style="color:var(--green);font-weight:700">■</span>&gt; <span style="color:var(--red);font-weight:700">■</span>&lt; <span style="color:#D5D0C8;font-weight:700">■</span>${compLabel}</span>
      <span class="ctog"><button class="${onO}" onclick="setChartVal(${n},'ord')">Шт</button><button class="${onR}" onclick="setChartVal(${n},'rev')">₽</button></span>
      <span class="ctog"><button class="${onD}" onclick="setChartMode(${n},'day')">День</button><button class="${onW}" onclick="setChartMode(${n},'week')">Неделя</button></span>
    </span></div>
    <div class="tw" style="padding:8px"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${yLab}${bars}${xLab}</svg></div></div>`;
}

function getArts(n){
  const d=D[n];if(!d)return[];

  if(d.isOz){
    (d.todayO||[]).concat(d.yestO||[]).concat(d.orders7||[]).forEach(o=>(o.products||[]).forEach(p=>s.add(p.offer_id||'')));

    return`<tr><td><span class="tp">${t}</span></td><td><span class="art">${artClick}</span></td><td>${sz}</td><td>${name}</td><td>${qty}</td><td><span class="pr">${price>0?fmt(price):'—'}</span></td><td style="font-size:11px;color:var(--ink3)">${wh}</td></tr>`;
  }).join('');
  const exp=!EXP[n]&&sorted.length>LIM
    ?`<tr class="er"><td colspan="7"><button class="eb" onclick="togExp(${n},'${type}')">▼ Все ${sorted.length}</button></td></tr>`
    :sorted.length>LIM&&EXP[n]?`<tr class="er"><td colspan="7"><button class="eb" onclick="togExp(${n},'${type}')">▲ Свернуть</button></td></tr>`:'';
  const secTitle=CM[n]==='week'?'Заказы за неделю':'Заказы сегодня';
  return`<div class="sec"><div class="sh"><span class="st">${secTitle}</span><span class="sm2">${orders.length} заказов</span></div>

    <tbody>${rows||'<tr><td colspan="7" class="em">Нет заказов</td></tr>'}${exp}</tbody></table></div></div>`;
}

function stocksHTML(n){

    const key=art+' · '+sz;whs.add(wh);

function fltS(n,val){FS[n]=val;const e=document.getElementById('stbl'+n);if(e)e.innerHTML=stocksTbl(n);}
function fltSZ(n,val){FSZ[n]=val;const e=document.getElementById('stbl'+n);if(e)e.innerHTML=stocksTbl(n);}

function togArt(n,art){if(OA[n].has(art))OA[n].delete(art);else OA[n].add(art);const e=document.getElementById('stbl'+n);if(e)e.innerHTML=stocksTbl(n);}
function stocksTbl(n){
  const d=D[n];if(!d||!d.arts)return'<div class="em">Нет данных</div>';
  const{arts,whList}=d,{c,d:dir}=SS[n]||{c:'total',d:-1};
  const fa=(FS[n]||'').trim().toLowerCase(),fz=(FSZ[n]||'').trim().toLowerCase();
  const byArt={};
  for(const key of Object.keys(arts)){
    const v=arts[key];
    if(fa&&!v.art.toLowerCase().includes(fa)&&!(v.name||'').toLowerCase().includes(fa))continue;
    if(fz&&!v.sz.toLowerCase().includes(fz))continue;
    if(!byArt[v.art])byArt[v.art]={name:v.name,total:0,wh:{},sizes:[]};
    byArt[v.art].total+=v.total;byArt[v.art].sizes.push(v);
    for(const w of Object.keys(v.wh)){byArt[v.art].wh[w]=(byArt[v.art].wh[w]||0)+v.wh[w];}
  }
  let artKeys=Object.keys(byArt).sort((a,b)=>{
    const va=c==='total'?byArt[a].total:(byArt[a].wh[c]||0),vb=c==='total'?byArt[b].total:(byArt[b].wh[c]||0);
    return(va-vb)*dir;
  });
  const ar=k=>SS[n].c===k?(SS[n].d<0?' ↓':' ↑'):' ↕',cl=k=>SS[n].c===k?' sa':'';
  const whH=whList.map(w=>`<th class="wh${cl(w)}" onclick="sortS(${n},'${w.replace(/'/g,"\\'")}')"><span style="font-size:8px">${w.slice(0,14)}</span>${ar(w)}</th>`).join('');
  const showArts=EXS[n]?artKeys:artKeys.slice(0,LIM);
  let rows='';
  for(const a of showArts){
    const g=byArt[a];const tc=g.total===0?'qx':g.total<10?'ql':'qo';
    const open=OA[n].has(a)||FA[n].length>0;const hasSizes=g.sizes.length>1;
    const toggle=hasSizes?`<span class="tog">${open?'▼':'▶'}</span>`:'<span class="tog"> </span>';
    const cells=whList.map(w=>{const q=g.wh[w]||0;return`<td class="${q===0?'qx':q<10?'ql':'qo'}" style="text-align:center">${q||'—'}</td>`}).join('');
    const onclick=hasSizes?` onclick="togArt(${n},'${a.replace(/'/g,"\\'")}')"`:' ';
    rows+=`<tr class="ar-row"${onclick}><td>${toggle}<span class="art">${a}</span><div style="font-size:10px;color:var(--ink3);display:inline;margin-left:6px">${g.name.slice(0,22)}</div></td><td class="tc ${tc}">${g.total}</td>${cells}</tr>`;
    if(open){
      const sorted=g.sizes.sort((x,y)=>szCmp(x.sz,y.sz));
      for(const sv of sorted){
        const sc=sv.total===0?'qx':sv.total<10?'ql':'qo';
        const scells=whList.map(w=>{const q=sv.wh[w]||0;return`<td class="${q===0?'qx':q<10?'ql':''}" style="text-align:center;font-size:11px">${q||'—'}</td>`}).join('');
        rows+=`<tr class="sz-row"><td style="padding-left:28px">${sv.sz}</td><td class="${sc}" style="text-align:center;font-weight:600">${sv.total}</td>${scells}</tr>`;
      }
    }
  }
  const span=whList.length+2;
  const exp=artKeys.length>LIM?`<tr class="er"><td colspan="${span}"><button class="eb" onclick="togExS(${n})">${EXS[n]?'▲ Свернуть':'▼ Все '+artKeys.length+' артикулов'}</button></td></tr>`:'';
  return`<table><thead><tr><th>Артикул</th><th class="${cl('total')}" style="background:var(--bg3)" onclick="sortS(${n},'total')">Итого${ar('total')}</th>${whH}</tr></thead><tbody>${rows||'<tr><td class="em" colspan="99">Ничего не найдено</td></tr>'}${exp}</tbody></table>`;
}
function togExS(n){EXS[n]=!EXS[n];const e=document.getElementById('stbl'+n);if(e)e.innerHTML=stocksTbl(n);}

function sortD(n,c){const s=DS[n];s.d=s.c===c?s.d*-1:(c==='days'?1:-1);s.c=c;const e=document.getElementById('dtbl'+n);if(e)e.innerHTML=defTbl(n);}
function togArtD(n,art){if(OAD[n].has(art))OAD[n].delete(art);else OAD[n].add(art);const e=document.getElementById('dtbl'+n);if(e)e.innerHTML=defTbl(n);}

function calcDef(stk,o7){
  const dr=o7/7,need=Math.round(dr*30),days=dr>0?Math.round(stk/dr):null;
  let fc,ft,bc,bw,sev;
  if(days===null){fc='fe';ft='нет продаж';bc='bd';bw=0;sev=99999;}
  else if(days<14){fc='ff';ft='🔥 '+days+'д';bc='bf';bw=Math.min(100,days/14*100);sev=days;}
  else if(days<30){fc='fw';ft='⚠️ '+days+'д';bc='bw';bw=Math.min(100,days/30*100);sev=days;}
  else if(days<=90){fc='fk';ft='✅ '+days+'д';bc='bk';bw=Math.min(100,days/90*100);sev=days;}
  else{fc='fd';ft='💀 '+days+'д';bc='bd';bw=100;sev=days;}
  const def=need>stk?need-stk:0;
  const sc=stk===0?'qx':stk<10?'ql':'qo';
  return{stk,o7,need,days,def,fc,ft,bc,bw,sc,sev};
}

function defTbl(n){
  const d=D[n];if(!d||!d.arts)return'<div class="em">Нет данных</div>';
  const{arts,orders7,isOz}=d;
  let om=d._om;
  if(!om){
    om={};
    (orders7||[]).forEach(o=>{
      if(isOz){(o.products||[]).forEach(p=>{const key=(p.offer_id||'—')+' · —';om[key]=(om[key]||0)+(p.quantity||1)});}
      else{const key=(o.supplierArticle||'—')+' · '+(o.techSize||'—');om[key]=(om[key]||0)+(o.quantity||1);}
    });
    d._om=om;
  }

  /* Заказов за 7 дней по артикулу (без учёта размера — для % доли) */
  const omArt={};
  for(const [k,v] of Object.entries(om)){
    const art=k.split(' · ')[0];omArt[art]=(omArt[art]||0)+v;
  }

  /* Заказов по артикулу за 7 дней — для подсчёта доли артикула */
  const totalOrders7=(orders7||[]).length;

  /* Группировка по артикулу */
  const byArt={};
  for(const a of Object.keys(arts)){
    const v=arts[a];const o7=om[a]||0;
    const r={...calcDef(v.total,o7),art:v.art,sz:v.sz,name:v.name||'',a};
    if(!byArt[v.art])byArt[v.art]={name:v.name,stk:0,o7:0,sizes:[]};
    byArt[v.art].stk+=v.total;byArt[v.art].o7+=o7;byArt[v.art].sizes.push(r);
  }

  const artRows=Object.keys(byArt).map(a=>{
    const g=byArt[a];
    const br=getBuyrate(a);
    /* МСК-сток: находим склады с МСК/МО в названии */
    let mskStk=0;
    if(d.whList){
      const mskWhs=d.whList.filter(w=>/мск|москв|подольск|краснодар|электро|коледино|тула/i.test(w));
      for(const key of Object.keys(arts)){if(arts[key].art===a){for(const w of mskWhs)mskStk+=arts[key].wh[w]||0;}}
    }
    const sgpTotal=getSgpByWBArt(a);
    const rawTotal=getRawByWBArt(a);
    return{...calcDef(g.stk,g.o7),art:a,name:g.name,sizes:g.sizes,buyrate:br,mskStk,sgpTotal,rawTotal,o7Art:omArt[a]||0};
  });

  const{c,d:dir}=DS[n];
  artRows.sort((a,b)=>{
    if(c==='art')return dir*(a.art<b.art?-1:a.art>b.art?1:0);
    let va,vb;
    if(c==='stk'){va=a.stk;vb=b.stk}else if(c==='o7'){va=a.o7;vb=b.o7}
    else if(c==='need'){va=a.need;vb=b.need}else if(c==='def'){va=a.def;vb=b.def}
    else{va=a.sev;vb=b.sev}
    return dir*(va-vb);
  });

  const ar=k=>DS[n].c===k?(DS[n].d>0?' ↑':' ↓'):' ↕';
  const cl=k=>DS[n].c===k?' sa':'';
  const th=(k,l,tip,cls='',al='center')=>`<th class="${cl(k)} ${cls}" onclick="sortD(${n},'${k}')" style="text-align:${al}" data-tip="${tip||''}">${l}${ar(k)}</th>`;
  const thf=(l,tip,cls='',al='center')=>`<th class="${cls}" style="text-align:${al}" data-tip="${tip||''}">${l}</th>`;

  /* Заголовки с группировкой */
  const colHeader=`<tr>
    <th rowspan="2" style="text-align:left;vertical-align:middle;background:var(--bg3)">Артикул${ar('art')}</th>
    <th colspan="3" class="th-group thg-wb">📦 Склад ВБ</th>
    <th colspan="2" class="th-group thg-sgp">🏭 СГП</th>
    <th colspan="2" class="th-group thg-raw">🧵 Сырьё</th>
    <th colspan="2" class="th-group thg-ref" style="border-style:dashed">* Справочно</th>
    <th class="th-group thg-need">📈 Потребность</th>
    <th colspan="3" class="th-group thg-need">⚡ Дефицит</th>
    <th colspan="3" class="th-group thg-days">⏱ Запас дней (с выкупом×)</th>
  </tr>
  <tr>
    ${th('stk','ВБ','Остаток на складах Wildberries / Ozon','th-wb')}
    ${thf('МСК*','Остаток на складах МСК и МО — справочно, не входит в Общий','th-msk')}
    ${thf('Общий','ВБ + СГП + Сырьё','th-total')}
    ${thf('СГП','Склад готовой продукции (из Google Sheets)','th-sgp')}
    ${thf('Доля р-ра','Доля этого размера в заказах за 7д','th-sgp')}
    ${thf('Сырьё','Полуфабрикаты на складе (из Google Sheets)','th-raw')}
    ${thf('Доля р-ра','Доля этого размера в заказах за 7д','th-raw')}
    ${thf('В пути*','Товар в пути к клиенту или при приёмке ВБ — справочно','th-transit')}
    ${thf('МСК*','Остаток МСК/МО — дублируется для удобства','th-msk')}
    ${th('o7','Зак/день','Среднее заказов в день за последние 7 дней','th-need')}
    ${thf('Мес. потр.','Потребность на 30 дней исходя из темпа заказов за 7д','th-need')}
    ${th('def','Дефицит шт','Нехватка до потребности на 30 дней (от остатка ВБ)','th-need')}
    ${thf('Доля арт.','Доля артикула в заказах за 7д','th-need')}
    ${th('days','ВБ×','Дней хватит остатка ВБ с учётом выкупаемости','th-days')}
    ${thf('Всё×','Дней хватит всех стоков (ВБ+СГП+Сырьё) с учётом выкупаемости','th-days')}
    ${thf('Без сырья×','Дней хватит ВБ+СГП с учётом выкупаемости','th-days')}
  </tr>`;

  const showArts=EXD[n]?artRows:artRows.slice(0,LIM);
  let trs='';
  for(const r of showArts){
    const open=OAD[n].has(r.art)||FA[n].length>0;
    const hasSizes=r.sizes.length>1;
    const toggle=hasSizes?`<span class="tog">${open?'▼':'▶'}</span>`:'<span class="tog"> </span>';
    const onclick=hasSizes?` onclick="togArtD(${n},'${r.art.replace(/'/g,"\\'")}')"`:' ';
    const br=r.buyrate;
    const brLabel=br.est
      ?`<span class="buyrate buyrate-est" data-tip="Фактической выкупаемости нет — используем 70%">~70%</span>`
      :`<span class="buyrate buyrate-ok" data-tip="Выкупаемость из Google Sheets">${Math.round(br.val*100)}%</span>`;
    const dr=r.o7/7; // заказов в день
    const drDay=dr>0?dr.toFixed(1):'—';
    const need30=r.need;
    /* Доля артикула в общих заказах 7д */
    const artO7=r.o7Art||r.o7;
    const artShare=totalOrders7>0?Math.round(artO7/totalOrders7*100)+'%':'—';
    /* Стоки */
    const wbStk=r.stk,sgpStk=r.sgpTotal,rawStk=r.rawTotal,mskStk=r.mskStk;
    const totalStk=wbStk+sgpStk+rawStk;
    /* Дни с выкупаемостью */
    const effDr=dr*br.val; // эффективная скорость потребления (с выкупом)
    const dWb=effDr>0?Math.round(wbStk/effDr):null;
    const dAll=effDr>0?Math.round(totalStk/effDr):null;
    const dNoRaw=effDr>0?Math.round((wbStk+sgpStk)/effDr):null;

    const wbC=wbStk===0?'qx':wbStk<20?'ql':'qo';
    const sgpC=sgpStk===0?'qx':sgpStk<20?'ql':'qo';
    const rawC=rawStk===0?'qx':rawStk<20?'ql':'qo';
    const totC=totalStk===0?'qx':totalStk<20?'ql':'qo';

    trs+=`<tr class="ar-row"${onclick}>
      <td>${toggle}<span class="art">${r.art}</span>${brLabel}<div style="font-size:10px;color:var(--ink3);display:inline;margin-left:4px">${r.name.slice(0,20)}</div></td>

      const sorted=r.sizes.sort((x,y)=>szCmp(x.sz,y.sz));
      for(const sr of sorted){

        const srTotal=sr.stk;
        const srDr=sr.o7/7;
        const srEffDr=srDr*br.val;
        const srDWb=srEffDr>0?Math.round(sr.stk/srEffDr):null;

        const srDNoRaw=srEffDr>0?Math.round((sr.stk+srSgp)/srEffDr):null;
        const srShare=artO7total>0&&sr.o7>0?Math.round(sr.o7/artO7total*100)+'%':'—';
        const srWbC=sr.stk===0?'qx':sr.stk<10?'ql':'qo';
        const srNeed=sr.need||0;
        trs+=`<tr class="sz-row">
          <td style="padding-left:28px;font-weight:600">${sr.sz}</td>
          <td class="${srWbC}" style="text-align:center;font-weight:600">${sr.stk}</td>

          <td style="text-align:center;font-weight:600">${srTotal}</td>
          <td style="text-align:center;font-size:11px;color:var(--sgp)">—</td>
          <td style="text-align:center;font-size:10px;color:var(--ink3)">${srShare}</td>
          <td style="text-align:center;font-size:11px;color:var(--raw)">—</td>
          <td style="text-align:center;font-size:10px;color:var(--ink3)">${srShare}</td>
          <td class="td-ref" style="text-align:center;font-size:11px">—</td>
          <td class="td-ref" style="text-align:center;font-size:11px">—</td>
          <td style="text-align:center;font-size:11px">${srDr>0?srDr.toFixed(1):'—'}</td>
          <td style="text-align:center;font-size:11px">${srNeed||'—'}</td>
          <td style="text-align:center;font-size:11px;color:${sr.def>0?'var(--red)':'var(--green)'}">${sr.def>0?'-'+sr.def:'✓'}</td>
          <td style="text-align:center;font-size:11px;color:var(--ink3)">${srShare}</td>
          <td style="text-align:center;font-size:11px">${fmtDays(srDWb)}</td>
          <td style="text-align:center;font-size:11px">${fmtDays(srDAll)}</td>
          <td style="text-align:center;font-size:11px">${fmtDays(srDNoRaw)}</td>
        </tr>`;
      }
    }
  }
  const exp=artRows.length>LIM
    ?`<tr class="er"><td colspan="17"><button class="eb" onclick="togExD(${n})">${EXD[n]?'▲ Свернуть':'▼ Все '+artRows.length+' артикулов'}</button></td></tr>`:'';
  return`<table><thead>${colHeader}</thead><tbody>${trs||'<tr><td class="em" colspan="17">Нет данных</td></tr>'}${exp}</tbody></table>`;
}
function togExD(n){EXD[n]=!EXD[n];const e=document.getElementById('dtbl'+n);if(e)e.innerHTML=defTbl(n);}

/* ── init ── */
window.onload=()=>{
  document.getElementById('hlogo').src=L1;
  document.getElementById('slogoimg').src=L1;
  try{
    const s=JSON.parse(localStorage.getItem('ef_d')||'{}');
    if(s.k1)K[1]=s.k1;if(s.k2)K[2]=s.k2;if(s.oid)K.oid=s.oid;if(s.okey)K.okey=s.okey;if(s.px)PX=s.px;if(s.px2)PX2=s.px2;
    document.getElementById('sk1').value=K[1];document.getElementById('sk2').value=K[2];
    document.getElementById('soid').value=K.oid;document.getElementById('sokey').value=K.okey;
    document.getElementById('sprx').value=PX;document.getElementById('sprx2').value=PX2;
    if(K[1]||K[2]||K.oid){
      document.getElementById('setup').classList.remove('show');
      placeholders();
    }
  }catch(e){}
};
</script>
