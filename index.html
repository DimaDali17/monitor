<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>EasyForm Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F0EBE1;--bg2:#E8E1D4;--bg3:#FAF8F4;--card:#FFF;--border:rgba(160,148,128,.25);--border2:rgba(160,148,128,.45);--ink:#1A1610;--ink2:#6B6357;--ink3:#A09688;--green:#2D7A4F;--red:#B84040;--amber:#A06820;--blue:#005BFF;--sgp:#5B3FA0;--raw:#8B4513;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Comfortaa',sans-serif;background:var(--bg);color:var(--ink);font-size:13px}
.header{background:var(--bg2);border-bottom:1px solid var(--border2);padding:0 20px;height:60px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.logo{width:38px;height:38px;border-radius:10px;object-fit:cover}
.bname{font-size:16px;font-weight:700}.bsub{font-size:9px;color:var(--ink3);letter-spacing:.12em;text-transform:uppercase}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px}
.clock{font-size:12px;color:var(--ink2);white-space:nowrap}
.tabs{display:flex;gap:2px;background:var(--bg);border-radius:8px;padding:3px}
.tab{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;border:none;background:0;color:var(--ink3);font-family:inherit;white-space:nowrap}
.tab.on{background:var(--ink);color:var(--bg3)}.tab.ozon.on{background:var(--blue);color:#fff}
.b{padding:5px 10px;background:0;border:1px solid var(--border2);border-radius:7px;font-size:11px;font-weight:600;color:var(--ink2);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:4px;white-space:nowrap}
.b:hover{background:var(--ink);color:var(--bg3);border-color:var(--ink)}.b:disabled{opacity:.4;cursor:default}
.upd{font-size:10px;color:var(--ink3)}
.sov{display:none;position:fixed;inset:0;background:rgba(240,235,225,.95);backdrop-filter:blur(6px);z-index:200;align-items:center;justify-content:center}
.sov.show{display:flex}
.sc{background:var(--card);border:1px solid var(--border2);border-radius:16px;padding:28px;width:480px;box-shadow:0 8px 40px rgba(0,0,0,.1);max-height:90vh;overflow-y:auto}
.slogo{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.stitle{font-size:20px;font-weight:700}.ssub{font-size:10px;color:var(--ink3);letter-spacing:.1em;text-transform:uppercase}
.ssec{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.1em;margin:16px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.fg{margin-bottom:10px}
.fl{font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px;font-weight:700}
.fi{width:100%;padding:8px 12px;font-size:12px;background:var(--bg3);border:1px solid var(--border2);border-radius:7px;color:var(--ink);font-family:inherit;outline:0}
.fi:focus{border-color:var(--ink)}
.sbtn{width:100%;padding:12px;background:var(--ink);color:var(--bg3);border:0;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:8px}
.smsg{font-size:12px;margin-top:8px;text-align:center}.smsg.err{color:var(--red)}
.main{padding:20px;max-width:1700px;margin:0 auto}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.mc{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:14px 16px}
.ml{font-size:9px;color:var(--ink3);text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-bottom:7px}
.mv{font-size:24px;font-weight:700;line-height:1}.mv.g{color:var(--green)}.mv.sm{font-size:18px}.mv.oz{color:var(--blue)}
.md{font-size:11px;margin-top:4px}
.du{color:var(--green)}.dd{color:var(--red)}
.sec{margin-bottom:20px}
.sh{display:flex;align-items:center;justify-content:space-between;padding-bottom:7px;margin-bottom:10px;border-bottom:1px solid var(--border2);flex-wrap:wrap;gap:6px}
.st{font-size:10px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.12em}
.sm2{font-size:11px;color:var(--ink3)}
.flt{padding:5px 10px;font-size:11px;background:var(--bg3);border:1px solid var(--border2);border-radius:7px;color:var(--ink);font-family:inherit;outline:0}
.flt:focus{border-color:var(--ink)}
.tw{background:var(--card);border:1px solid var(--border);border-radius:11px;overflow:hidden}
.sw{background:var(--card);border:1px solid var(--border);border-radius:11px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;padding:6px 9px;font-size:9px;font-weight:700;color:var(--ink3);background:var(--bg3);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--border);font-family:inherit;white-space:nowrap}
thead th.sa{background:var(--ink)!important;color:var(--bg3)!important}
thead th[onclick]{cursor:pointer;user-select:none}
thead th.th-wb{background:#FFF3E0!important;color:#A06820!important;border-bottom:2px solid #A06820}
thead th.th-sgp{background:#EDE7F6!important;color:#5B3FA0!important;border-bottom:2px solid #5B3FA0}
thead th.th-raw{background:#FBE9E7!important;color:#8B4513!important;border-bottom:2px solid #8B4513}
thead th.th-transit{background:#E3F2FD!important;color:#0D47A1!important;border-bottom:2px dashed #90CAF9}
thead th.th-msk{background:#F3E5F5!important;color:#6A1B9A!important;border-bottom:2px dashed #CE93D8}
thead th.th-total{background:#E8F5E9!important;color:#1B5E20!important;border-bottom:2px solid #4CAF50}
thead th.th-need{background:#FFF8E1!important;color:#F57F17!important}
thead th.th-days{background:#E0F2F1!important;color:#004D40!important}
.th-group{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;text-align:center;padding:3px 6px;border-bottom:1px solid var(--border)}
.thg-wb{background:#FFF3E0;color:#A06820}.thg-sgp{background:#EDE7F6;color:#5B3FA0}.thg-raw{background:#FBE9E7;color:#8B4513}
.thg-need{background:#FFF8E1;color:#F57F17}.thg-days{background:#E0F2F1;color:#004D40}.thg-ref{background:#F3F3F3;color:#888;font-style:italic}
tbody td{padding:5px 9px;color:var(--ink);border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--bg3)}
.tp{font-size:11px;font-weight:700;color:var(--ink2);background:var(--bg2);padding:2px 8px;border-radius:20px}
.art{font-family:monospace;font-size:11px;color:var(--ink2)}
.pr{font-weight:700}.qo{color:var(--green);font-weight:700}.ql{color:var(--amber);font-weight:700}.qx{color:var(--red);font-weight:700}
.tc{font-weight:700;background:var(--bg3)!important;text-align:center;font-size:14px}
.er td{text-align:center;padding:10px}
.eb{background:0;border:1px solid var(--border2);border-radius:7px;padding:5px 16px;font-size:11px;font-weight:600;color:var(--ink2);cursor:pointer;font-family:inherit}
.eb:hover{background:var(--ink);color:var(--bg3);border-color:var(--ink)}
.fl2{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:700}
.ff{background:#FEE8E8;color:#B84040}.fw{background:#FEF3E2;color:#A06820}.fk{background:#E8F4EE;color:#2D7A4F}.fd{background:#EDEDF0;color:#6B6B80}.fe{background:#F5F5F5;color:#A09688}
.dbw{background:var(--bg2);border-radius:4px;height:4px;width:60px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:4px}
.db{height:100%;border-radius:4px}.bf{background:#B84040}.bw{background:#A06820}.bk{background:#2D7A4F}.bd{background:#A09688}
.em{padding:28px;text-align:center;color:var(--ink3)}
.ar-row{cursor:pointer;background:var(--bg3)}.ar-row:hover{background:var(--bg2)}
.ar-row td{font-weight:700;border-bottom:1px solid var(--border2)}
.sz-row td{font-size:12px;color:var(--ink2);border-bottom:1px solid var(--border)}
.sz-row td:first-child{padding-left:28px}
.tog{display:inline-block;width:16px;text-align:center;font-size:10px;color:var(--ink3);margin-right:4px}
.fb{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px;position:relative}
.fb input{flex:1;min-width:160px;padding:7px 10px;font-size:12px;background:var(--bg3);border:1px solid var(--border2);border-radius:7px;color:var(--ink);font-family:inherit;outline:0}
.fb input:focus{border-color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;background:var(--ink);color:var(--bg3);border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap}
.chip .cx{cursor:pointer;opacity:.7;font-size:13px;line-height:1}.chip .cx:hover{opacity:1}
.ddrop{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--border2);border-radius:8px;max-height:200px;overflow-y:auto;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.1);display:none}
.ddrop.show{display:block}.ddrop div{padding:6px 12px;font-size:12px;cursor:pointer}.ddrop div:hover{background:var(--bg3)}
.ctog{display:inline-flex;background:var(--bg);border-radius:6px;padding:2px;gap:1px}
.ctog button{padding:3px 10px;border:0;border-radius:5px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;background:0;color:var(--ink3)}
.ctog button.on{background:var(--ink);color:var(--bg3)}
.lm{padding:50px;text-align:center;color:var(--ink3)}
.sb{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:var(--ink2);display:flex;gap:10px;align-items:flex-start;word-break:break-all}
.sde{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px;background:var(--red)}
.sp{display:inline-block;animation:spin .8s linear infinite}
.loadbtn{margin-top:14px;padding:9px 22px;background:var(--ink);color:var(--bg3);border:0;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.buyrate{font-size:9px;padding:1px 5px;border-radius:10px;font-weight:700;margin-left:5px;vertical-align:middle}
.buyrate-ok{background:#E8F4EE;color:#2D7A4F}.buyrate-est{background:#FEF3E2;color:#A06820}
.days-crit{color:#B84040;font-weight:700}.days-warn{color:#A06820;font-weight:700}.days-ok{color:#2D7A4F;font-weight:700}.days-na{color:var(--ink3)}
.td-ref{color:var(--ink3)!important}
/* Tooltip */
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);background:rgba(26,22,16,.92);color:#fff;font-size:11px;font-weight:500;padding:6px 10px;border-radius:8px;white-space:normal;z-index:9999;pointer-events:none;font-family:'Comfortaa',sans-serif;width:220px;text-align:center;line-height:1.5;box-shadow:0 4px 16px rgba(0,0,0,.25)}
[data-tip]:hover::before{content:'';position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:rgba(26,22,16,.92);z-index:9999}
thead th[data-tip]{cursor:help}
thead th[onclick][data-tip]{cursor:pointer}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

const L2="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCABMAEwDASIAAhEBAxEB/8QAHAAAAQQDAQAAAAAAAAAAAAAABgQFBwgAAQMC/8QAMxAAAgEEAAQDBwMEAwEAAAAAAQIDAAQFEQYSITEHQVEIExQiYXGRMlKBI0KhwXKisdH/xAAZAQEBAQEBAQAAAAAAAAAAAAAAAwECBAX/xAApEQACAgECBAQHAAAAAAAAAAAAAQIRAxIhBDFxkQUyUfAUYYGhscHR/9oADAMBAAIRAxEAPwBf9drtGTYTY";

/* ── Google Sheets CSVs ── */
const CSV_BUYRATE='https://docs.google.com/spreadsheets/d/e/2PACX-1vQZuc_t740K_yF5Nhw3saPZcbyxchMhJ93WrS05BbLY9OqqXtj3y5xG6WaraGsI4Z7SmNTHFyBlNTcn/pub?gid=0&single=true&output=csv';
const CSV_SGP='https://docs.google.com/spreadsheets/d/e/2PACX-1vQdfWL8acRSVEEy__OKcizuFMBn1QCZqvMlbsE0Zz8IZfSMr-sDj_8_MaYQiz8KIvQ3ag8T2qU2cTK0/pub?gid=1909727956&single=true&output=csv';
const CSV_RAW='https://docs.google.com/spreadsheets/d/e/2PACX-1vQdfWL8acRSVEEy__OKcizuFMBn1QCZqvMlbsE0Zz8IZfSMr-sDj_8_MaYQiz8KIvQ3ag8T2qU2cTK0/pub?gid=1387615415&single=true&output=csv';
const CSV_MAP='https://docs.google.com/spreadsheets/d/e/2PACX-1vQdfWL8acRSVEEy__OKcizuFMBn1QCZqvMlbsE0Zz8IZfSMr-sDj_8_MaYQiz8KIvQ3ag8T2qU2cTK0/pub?gid=1004508899&single=true&output=csv';

let gBuyrate={};      // artLower → 0..1
let gSgp={};          // "artPr_lower;szPr_lower" → qty
let gRaw={};          // "artPr_lower;szPr_lower" → qty (nobrand тоже)
// Маппинг: "wbArt_lower;wbSz_lower" → [{artPr, szPr}]
let gMap={};
let gExtLoaded=false;

function parseCSV(text){
  const lines=text.trim().split('\n');
  if(!lines.length)return[];
  const hdr=lines[0].split(',').map(c=>c.trim().replace(/^"|"$/g,''));
  return lines.slice(1).map(row=>{
    const vals=row.split(',').map(c=>c.trim().replace(/^"|"$/g,''));
    const o={};hdr.forEach((h,i)=>o[h]=vals[i]||'');return o;
  });
}

async function loadExternal(){
  if(gExtLoaded)return;
  try{
    const [rB,rS,rR,rM]=await Promise.all([
      fetch(CSV_BUYRATE).then(r=>r.text()),
      fetch(CSV_SGP).then(r=>r.text()),
      fetch(CSV_RAW).then(r=>r.text()),
      fetch(CSV_MAP).then(r=>r.text())
    ]);

    /* Выкупаемость */
    parseCSV(rB).forEach(row=>{
      const art=(row['supplierArticle']||'').trim().toLowerCase();
      const pct=(row['Выкупаемость']||'').replace('%','').trim();
      if(art&&pct)gBuyrate[art]=parseFloat(pct)/100;
    });

    /* Арт производ маппинг: WB-арт + WB-размер → производ-арт + производ-размер
       Обрабатываем Арт ВБ и Арт ВБ2 (если заполнен) */
    parseCSV(rM).forEach(row=>{
      const artPr=(row['Артикул произв']||'').trim();
      const szPr=(row['Размер произв']||'').trim();
      const szWB=(row['Размер ВБ']||'').trim();
      [row['Арт ВБ'],row['Арт ВБ2']].forEach(wb=>{
        const wbArt=(wb||'').trim();
        if(!wbArt||!artPr)return;
        const k=(wbArt.toLowerCase())+';'+(szWB.toLowerCase());
        if(!gMap[k])gMap[k]=[];
        gMap[k].push({artPr:artPr.trim(),szPr:szPr.trim()});
      });
    });

    /* СГП: "Арт производ" + "Размер" → SUM из Штук */
    parseCSV(rS).forEach(row=>{
      const art=(row['Арт производ']||'').trim();
      const sz=(row['Размер']||'').trim();

    });

    parseCSV(rR).forEach(row=>{

      gRaw[k]=(gRaw[k]||0)+qty;

      if(art.toLowerCase().includes(' nobrand')){
        const artClean=art.toLowerCase().replace(' nobrand','').trim();

function getBuyrate(art){
  if(!art)return{val:0.7,est:true};

/* Получить {sgp, raw} по WB-арт + WB-размер через маппинг */
function getStocksForSz(wbArt,wbSz){
  const k=(wbArt.toLowerCase())+';'+(wbSz.toLowerCase());
  const mappings=gMap[k]||[];
  let sgp=0,raw=0;
  mappings.forEach(({artPr,szPr})=>{
    const kp=artPr.toLowerCase()+';'+szPr.toLowerCase();
    sgp+=gSgp[kp]||0;
    raw+=gRaw[kp]||0;
  });
  /* Если маппинга нет — fallback: ищем по артикулу без размера (суммируем все размеры) */
  if(!mappings.length){
    const ka=wbArt.toLowerCase();
    for(const [kk,v] of Object.entries(gSgp)){const p=kk.split(';')[0];if(p.includes(ka)||ka.includes(p))sgp+=v;}
    for(const [kk,v] of Object.entries(gRaw)){const p=kk.split(';')[0];if(p.includes(ka)||ka.includes(p))raw+=v;}
  }
  return{sgp,raw};
}

/* Для строки артикула (без разбивки по размеру) — сумма по всем маппингам */
function getStocksForArt(wbArt){
  const ka=wbArt.toLowerCase();
  const seen=new Set();let sgp=0,raw=0;
  for(const [k,mappings] of Object.entries(gMap)){
    if(!k.startsWith(ka+';'))continue;
    mappings.forEach(({artPr,szPr})=>{
      const kp=artPr.toLowerCase()+';'+szPr.toLowerCase();
      if(!seen.has(kp)){seen.add(kp);sgp+=gSgp[kp]||0;raw+=gRaw[kp]||0;}
    });
  }
  /* fallback если нет маппинга совсем */
  if(!seen.size){
    for(const [kk,v] of Object.entries(gSgp)){const p=kk.split(';')[0];if(p.includes(ka)||ka.includes(p))sgp+=v;}
    for(const [kk,v] of Object.entries(gRaw)){const p=kk.split(';')[0];if(p.includes(ka)||ka.includes(p))raw+=v;}
  }
  return{sgp,raw};
}

/* ── WB fetch ── */
function pxFor(cab){return(cab===2&&PX2)?PX2:PX;}
let _wbBusy=Promise.resolve(),_wbLast=0;
const WB_GAP=1200;
function wbQueue(fn){
  const run=_wbBusy.then(async()=>{
    const g=Math.max(0,_wbLast+WB_GAP-Date.now());if(g>0)await new Promise(r=>setTimeout(r,g));
    try{return await fn();}finally{_wbLast=Date.now();}
  });
  _wbBusy=run.catch(()=>{});return run;
}
async function wbGet(url,token,cab){
  const purl=pxFor(cab)+'?url='+encodeURIComponent(url);
  const waits=[3000,7000,15000];let lastInfo='';
  return wbQueue(async()=>{
    for(let i=0;i<=waits.length;i++){
      let r,txt='';
      try{r=await fetch(purl,{headers:{'X-WB-Token':token}});txt=await r.text();}catch(e){lastInfo='сеть: '+e;r=null;}
      const bad=!r||r.status===429||r.status>=500||!txt||!txt.trim();
      if(bad){
        if(r)lastInfo=r.status===429?'429 (лимит)':'WB '+r.status;
        if(i===waits.length)throw new Error('WB: не удалось после '+(waits.length+1)+' попыток ('+lastInfo+'). Подождите 1–2 мин.');
        await new Promise(x=>setTimeout(x,r?parseInt(r.headers.get('retry-after')||'0',10)*1000||waits[i]:waits[i]));
        const ic=document.getElementById('ri'+cab);if(ic)ic.innerHTML='<span class="sp">↻</span>';
        continue;
      }
      if(!r.ok)throw new Error('WB '+r.status+': '+txt.slice(0,200));
      try{return JSON.parse(txt);}catch(e){throw new Error('Некорректный JSON: '+txt.slice(0,160));}
    }
  });
}
let _ozT=0;
async function ozPost(url,body){
  const g=Math.max(0,_ozT+1200-Date.now());if(g>0)await new Promise(r=>setTimeout(r,g));_ozT=Date.now();
  const purl=PX+'?url='+encodeURIComponent(url);
  let r=await fetch(purl,{method:'POST',headers:{'X-Ozon-Client-Id':K.oid,'X-Ozon-Api-Key':K.okey,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.status===429){await new Promise(x=>setTimeout(x,8000));_ozT=Date.now();r=await fetch(purl,{method:'POST',headers:{'X-Ozon-Client-Id':K.oid,'X-Ozon-Api-Key':K.okey,'Content-Type':'application/json'},body:JSON.stringify(body)});}
  if(!r.ok){const t=await r.text().catch(()=>'');throw new Error('Ozon '+r.status+': '+t.slice(0,300));}
  return r;
}

function calcDef(stk,o7){
  const dr=o7/7,need=Math.round(dr*30),days=dr>0?Math.round(stk/dr):null;
  let fc,bc,bw,sev;
  if(days===null){fc='fe';bc='bd';bw=0;sev=99999;}
  else if(days<14){fc='ff';bc='bf';bw=Math.min(100,days/14*100);sev=days;}
  else if(days<30){fc='fw';bc='bw';bw=Math.min(100,days/30*100);sev=days;}
  else if(days<=90){fc='fk';bc='bk';bw=Math.min(100,days/90*100);sev=days;}
  else{fc='fd';bc='bd';bw=100;sev=days;}
  const ft=days===null?'нет продаж':(days<14?'🔥 ':days<30?'⚠️ ':days<=90?'✅ ':'💀 ')+days+'д';
  return{stk,o7,need,days,def:Math.max(0,need-stk),fc,ft,bc,bw,sev,sc:stk===0?'qx':stk<10?'ql':'qo'};
}

      if(isOz)(o.products||[]).forEach(p=>{const key=(p.offer_id||'—')+' · —';om[key]=(om[key]||0)+(p.quantity||1);});
      else{const key=(o.supplierArticle||'—')+' · '+(o.techSize||'—');om[key]=(om[key]||0)+(o.quantity||1);}

  /* МСК-склады */
  const mskWhs=(d.mskWhs&&d.mskWhs.length)?d.mskWhs:[];

  /* Группируем по артикулу */
  const byArt={};
  for(const a of Object.keys(arts)){
    const v=arts[a];const o7=om[a]||0;
    if(!byArt[v.art])byArt[v.art]={name:v.name,stk:0,o7:0,sizes:[],msk:0};
    byArt[v.art].stk+=v.total;byArt[v.art].o7+=o7;
    /* МСК для этого артикул-размер */
    let mskQ=0;for(const w of mskWhs)mskQ+=v.wh[w]||0;
    byArt[v.art].msk+=mskQ;
    byArt[v.art].sizes.push({...v,o7,msk:mskQ});
  }

  const artRows=Object.keys(byArt).map(a=>{
    const g=byArt[a];
    const br=getBuyrate(a);
    const{sgp,raw}=getStocksForArt(a);
    return{...calcDef(g.stk,g.o7),art:a,name:g.name,sizes:g.sizes,buyrate:br,msk:g.msk,sgp,raw,o7Art:g.o7};
  });

  const{c,d:dir}=DS[n];
  artRows.sort((a,b)=>{
    if(c==='art')return dir*(a.art<b.art?-1:a.art>b.art?1:0);
    const get=r=>({stk:r.stk,o7:r.o7,need:r.need,def:r.def,days:r.sev})[c]||0;
    return dir*(get(a)-get(b));

  /* Helpers */

    <th colspan="2" class="th-group thg-ref" style="border-style:dashed">* Справочно</th>

    <th colspan="4" class="th-group thg-days">⏱ Запас дней (с выкупом×)</th>
  </tr>
  <tr>
    ${TH('stk','ВБ','Остаток на складах Wildberries или Ozon на сегодня','th-wb')}
    ${THF('МСК*','Остаток на московских и ближайших складах — справочная цифра, в Общий сток не входит','th-msk')}
    ${THF('Общий','Суммарный сток: ВБ + СГП + Сырьё. МСК и В пути не включены','th-total')}
    ${THF('СГП','Остаток готовой продукции на вашем складе — из Google Sheets (лист СГП)','th-sgp')}
    ${THF('Сырьё','Остаток полуфабрикатов на вашем складе — из Google Sheets (лист Остатки сводная). Nobrand суммируется с основным артикулом','th-raw')}
    ${THF('Доля р-ра','Доля данного размера в заказах за последние 7 дней','th-need')}
    ${THF('Сырьё','То же сырьё — продублировано для сравнения с долей размера','th-raw')}
    ${THF('Доля р-ра','Доля данного размера в заказах за последние 7 дней','th-need')}
    ${THF('В пути*','Товар в процессе доставки клиенту или приёмки на склад ВБ — справочная цифра, в расчёты не идёт','th-transit')}
    ${THF('МСК*','Московский сток — повторно для удобства сравнения с запасом дней','th-msk')}
    ${TH('o7','Зак/день','Среднее количество заказов в день за последние 7 дней (без сегодня)','th-need')}
    ${THF('Мес. потр.','Потребность на 30 дней исходя из темпа заказов за последние 7 дней','th-need')}
    ${THF('Доля арт.','Доля данного артикула в общих заказах за 7 дней по всем артикулам','th-need')}
    ${TH('def','Дефицит шт','Нехватка товара: потребность на 30 дней минус остаток на ВБ. Отрицательное значение означает достаточный запас','th-need')}
    ${THF('Статус','Визуальный индикатор запаса: 🔥 менее 14 дней, ⚠️ 14-30 дней, ✅ 30-90 дней, 💀 более 90 дней','th-need')}
    ${TH('days','ВБ×','Сколько дней хватит остатка ВБ с учётом выкупаемости. Если выкупаемость не задана, используется 70%','th-days')}
    ${THF('Всё×','Сколько дней хватит всех стоков (ВБ + СГП + Сырьё) с учётом выкупаемости','th-days')}
    ${THF('Без сырья×','Сколько дней хватит ВБ + СГП с учётом выкупаемости — показывает запас без учёта производства','th-days')}
    ${THF('МСК×','Сколько дней хватит только московского стока с учётом выкупаемости','th-days')}
  </tr>`;

  const showArts=EXD[n]?artRows:artRows.slice(0,LIM);
  let trs='';

  for(const r of showArts){
    const open=OAD[n].has(r.art)||FA[n].length>0;
    const hasSizes=r.sizes.length>1;
    const toggle=hasSizes?`<span class="tog">${open?'▼':'▶'}</span>`:'<span class="tog"> </span>';
    const onclick=hasSizes?` onclick="togArtD(${n},'${r.art.replace(/'/g,"\\'")}')"`:' ';
    const br=r.buyrate;
    const brLabel=br.est
      ?`<span class="buyrate buyrate-est" data-tip="Выкупаемость не найдена в таблице — используем 70% по умолчанию">~70%</span>`
      :`<span class="buyrate buyrate-ok" data-tip="Выкупаемость из Google Sheets: ${Math.round(br.val*100)}%">${Math.round(br.val*100)}%</span>`;

    const dr=r.o7/7;
    const drDay=Math.round(dr); // ЦЕЛОЕ
    const need30=r.need;
    const artShare=totalO7>0&&r.o7Art>0?Math.round(r.o7Art/totalO7*100)+'%':'—';
    const wbStk=r.stk,sgpStk=r.sgp,rawStk=r.raw,mskStk=r.msk;
    const totalStk=wbStk+sgpStk+rawStk;
    const effDr=dr*br.val;
    const dWb=effDr>0?Math.round(wbStk/effDr):null;
    const dAll=effDr>0?Math.round(totalStk/effDr):null;
    const dNoRaw=effDr>0?Math.round((wbStk+sgpStk)/effDr):null;
    const dMsk=effDr>0?Math.round(mskStk/effDr):null;
    const wbC=wbStk===0?'qx':wbStk<20?'ql':'qo';
    const sgpC=sgpStk===0?'qx':sgpStk<20?'ql':'qo';
    const rawC=rawStk===0?'qx':rawStk<20?'ql':'qo';
    const totC=totalStk===0?'qx':totalStk<30?'ql':'qo';

    trs+=`<tr class="ar-row"${onclick}>
      <td>${toggle}<span class="art">${r.art}</span>${brLabel}<span style="font-size:10px;color:var(--ink3);margin-left:5px">${r.name.slice(0,20)}</span></td>
      <td class="${wbC}" style="text-align:center;font-size:14px">${wbStk}</td>
      <td class="td-ref" style="text-align:center">${mskStk||'—'}</td>
      <td class="${totC}" style="text-align:center;font-size:14px;font-weight:700">${totalStk}</td>
      <td class="${sgpC}" style="text-align:center">${sgpStk||'—'}</td>
      <td style="text-align:center;font-size:10px;color:var(--ink3)">—</td>
      <td class="${rawC}" style="text-align:center">${rawStk||'—'}</td>
      <td style="text-align:center;font-size:10px;color:var(--ink3)">—</td>
      <td class="td-ref" style="text-align:center">—</td>
      <td class="td-ref" style="text-align:center">${mskStk||'—'}</td>
      <td style="text-align:center;font-weight:600">${drDay}</td>
      <td style="text-align:center;color:var(--ink2)">${need30||'—'}</td>
      <td style="text-align:center;font-size:11px;color:var(--blue)">${artShare}</td>
      <td style="text-align:center;color:${r.def>0?'var(--red)':'var(--green)'};font-weight:700">${r.def>0?'−'+r.def:'✓'}</td>
      <td><span class="fl2 ${r.fc}">${r.ft}</span><span class="dbw"><span class="db ${r.bc}" style="width:${r.bw}%"></span></span></td>
      <td style="text-align:center">${fmtDays(dWb)}</td>
      <td style="text-align:center">${fmtDays(dAll)}</td>
      <td style="text-align:center">${fmtDays(dNoRaw)}</td>
      <td style="text-align:center">${fmtDays(dMsk)}</td>
    </tr>`;

    if(open){
      const artO7total=r.o7||1;
      const sorted=r.sizes.sort((x,y)=>szCmp(x.sz,y.sz));
      for(const sr of sorted){
        const srStocks=getStocksForSz(r.art,sr.sz);
        const srSgp=srStocks.sgp,srRaw=srStocks.raw;
        const srTotal=sr.total+srSgp+srRaw;
        const srDr=sr.o7/7,srEffDr=srDr*br.val;
        const srDWb=srEffDr>0?Math.round(sr.total/srEffDr):null;
        const srDAll=srEffDr>0?Math.round(srTotal/srEffDr):null;
        const srDNoRaw=srEffDr>0?Math.round((sr.total+srSgp)/srEffDr):null;
        const srDMsk=srEffDr>0?Math.round(sr.msk/srEffDr):null;
        const srShare=artO7total>0&&sr.o7>0?Math.round(sr.o7/artO7total*100)+'%':'—';
        const srWbC=sr.total===0?'qx':sr.total<10?'ql':'qo';
        const srSgpC=srSgp===0?'qx':srSgp<10?'ql':'qo';
        const srRawC=srRaw===0?'qx':srRaw<10?'ql':'qo';
        const srTotC=srTotal===0?'qx':srTotal<15?'ql':'qo';
        const sr7=Math.round(srDr); // целое
        const{def:srDef,fc:srFc,ft:srFt,bc:srBc,bw:srBw,need:srNeed}=calcDef(sr.total,sr.o7);

        trs+=`<tr class="sz-row">
          <td style="padding-left:28px;font-weight:600">${sr.sz}</td>
          <td class="${srWbC}" style="text-align:center;font-weight:600">${sr.total}</td>
          <td class="td-ref" style="text-align:center;font-size:11px">${sr.msk||'—'}</td>
          <td class="${srTotC}" style="text-align:center;font-weight:600">${srTotal}</td>
          <td class="${srSgpC}" style="text-align:center;font-size:11px;color:var(--sgp)">${srSgp||'—'}</td>
          <td style="text-align:center;font-size:10px;color:var(--blue)">${srShare}</td>
          <td class="${srRawC}" style="text-align:center;font-size:11px;color:var(--raw)">${srRaw||'—'}</td>
          <td style="text-align:center;font-size:10px;color:var(--blue)">${srShare}</td>
          <td class="td-ref" style="text-align:center;font-size:11px">—</td>
          <td class="td-ref" style="text-align:center;font-size:11px">${sr.msk||'—'}</td>
          <td style="text-align:center;font-size:11px">${sr7}</td>
          <td style="text-align:center;font-size:11px">${srNeed||'—'}</td>
          <td style="text-align:center;font-size:11px;color:var(--blue)">${srShare}</td>
          <td style="text-align:center;font-size:11px;color:${srDef>0?'var(--red)':'var(--green)'}">${srDef>0?'−'+srDef:'✓'}</td>
          <td><span class="fl2 ${srFc}" style="font-size:10px">${srFt}</span></td>
          <td style="text-align:center;font-size:11px">${fmtDays(srDWb)}</td>
          <td style="text-align:center;font-size:11px">${fmtDays(srDAll)}</td>
          <td style="text-align:center;font-size:11px">${fmtDays(srDNoRaw)}</td>
          <td style="text-align:center;font-size:11px">${fmtDays(srDMsk)}</td>
        </tr>`;
      }
    }
  }

  const exp=artRows.length>LIM?`<tr class="er"><td colspan="19"><button class="eb" onclick="togExD(${n})">${EXD[n]?'▲ Свернуть':'▼ Все '+artRows.length+' артикулов'}</button></td></tr>`:'';
  return`<table><thead>${hdr}</thead><tbody>${trs||'<tr><td class="em" colspan="19">Нет данных</td></tr>'}${exp}</tbody></table>`;
}
function togExD(n){EXD[n]=!EXD[n];const e=document.getElementById('dtbl'+n);if(e)e.innerHTML=defTbl(n);}

/* ── init ── */
window.onload=()=>{
  document.getElementById('hlogo').src=L1;document.getElementById('slogoimg').src=L1;
  try{
    const s=JSON.parse(localStorage.getItem('ef_d')||'{}');
    if(s.k1)K[1]=s.k1;if(s.k2)K[2]=s.k2;if(s.oid)K.oid=s.oid;if(s.okey)K.okey=s.okey;if(s.px)PX=s.px;if(s.px2)PX2=s.px2;
    document.getElementById('sk1').value=K[1];document.getElementById('sk2').value=K[2];
    document.getElementById('soid').value=K.oid;document.getElementById('sokey').value=K.okey;
    document.getElementById('sprx').value=PX;document.getElementById('sprx2').value=PX2;
    if(K[1]||K[2]||K.oid){document.getElementById('setup').classList.remove('show');placeholders();}
  }catch(e){}
};
</script>
</body></html>
